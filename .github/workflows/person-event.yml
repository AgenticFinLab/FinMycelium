name: Person Event offline regression
on:
  pull_request:
    paths:
      - 'finmy/**'
      - 'tests/**'
      - 'scripts/check_person_event.py'
      - 'requirements-event-tests.txt'
      - '.github/workflows/person-event.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-event-tests.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-event-tests.txt
      - run: python scripts/check_person_event.py --junitxml=person-event-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: person-event-test-report
          path: person-event-tests.xml
