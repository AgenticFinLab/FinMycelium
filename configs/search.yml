# Search configuration; independent of Builder settings.
# Opt-in search only; the existing simple runner defaults are unchanged.
providers: [baidu, bocha, exa]  # Select baidu, bocha, exa, or a list of them.
max_results: {baidu: 3, bocha: 3, exa: 5}  # Per query; legacy scalar values remain supported.
max_search_requests: 24
max_read_sources: 40
max_model_calls: 80
max_read_chars: 16000
max_builder_material_chars: 90000  # Input budget; complete selected material is retained separately.
include_domains: []
exclude_domains: []
publication_start: null
publication_end: null
baidu_rewrite: false
allow_network: false
lm_name: deepseek/deepseek-flash  # Official DeepSeek API; uses DEEPSEEK_API_KEY.
generation_config:
  max_tokens: 8192  # Includes reasoning + answer.
  temperature: 1.0
  top_p: 0.95
  response_format: {type: json_object}
  reasoning_effort: high
  extra_body:
    thinking: {type: enabled}
timeout: 120  # Per-request timeout; saved tasks retain their own values.
max_download_bytes: 20000000
max_model_context_chars: 180000  # Conservative character guard, not a model token guarantee.
# Optional local BM25 reading: {mode: bm25}; empty keeps the existing topic reader.
retrieval: {mode: bm25}
