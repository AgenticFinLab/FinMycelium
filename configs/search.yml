# Search configuration; independent of Builder settings.
# Standalone agent search uses this flat file; pipeline options live under search_config.enhancement.
providers: [bocha]  # Select baidu, bocha, exa, or a list of them.
max_results: 5
early_stop_multiplier: 1  # Pipeline overrides this to 4.
source_languages: []  # Pipeline sets [en, zh].
max_search_requests: 12
max_read_sources: 12
max_model_calls: 30
max_read_chars: 12000
max_builder_material_chars: 120000  # Input budget; complete selected material is retained separately.
include_domains: []
exclude_domains: []
publication_start: null
publication_end: null
baidu_rewrite: false
allow_network: false
lm_name: ark/doubao-seed-2-1-lite-260915  # Search only; never inherited by Builder.
generation_config:
  max_tokens: 4096  # Ark answer limit; max_completion_tokens instead caps answer + reasoning.
timeout: 120  # Per-request timeout; saved tasks retain their own values.
max_download_bytes: 20000000
max_model_context_chars: 100000  # Conservative character guard, not a model token guarantee.
