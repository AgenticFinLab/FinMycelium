# Pipeline configuration example for SparseRagBuilder.
#
# Standard pipeline configs also default to SparseRagBuilder.
# Paths are relative to the working directory. Full Pipeline adds query
# summarization calls; the text runner uses builder_config only.

output_dir: "output/sparse"
save_folder: "output/sparse"
db_config:
  url: "sqlite:///output/sparse/metadata.sqlite3"
url_collector_config:
  delay: 1.0
  use_selenium_fallback: false
  selenium_wait_time: 5
pdf_collector_config:
  output_dir: "output/sparse/pdf"
  batch_size: 10
  language: "en"
  check_pdf_limits: true
  env_file: ".env"
summarizer_config:
  summarizer_type: "KWLMSummarizer"
  llm_name: "deepseek/deepseek-chat"
matcher_config:
  use_matcher: false
  matcher_type: "LXMatcher"
  lm_name: "deepseek/deepseek-chat"

lm_type: &lm_type "api"
lm_name: &lm_name "deepseek/deepseek-chat"

inference_config: &inference_config
  device: "cuda"

generation_config: &generation_config
  max_new_tokens: 8192
  temperature: 0.2
  top_p: 0.95

sparse_builder_config: &sparse_builder_config
  context_top_k: 8
  max_context_chars: 6000
  excerpt_char_limit: 240
  max_card_tokens: 48
  enable_sparse_routing: true
  enable_context_assets: true
  output_language: "English"
  max_json_attempts: 3
  max_calls: 300
  request_timeout_seconds: 900
  evidence_policy: "report"

builder_config:
  builder_type: "SparseRagBuilder"
  lm_type: *lm_type
  lm_name: *lm_name
  inference_config: *inference_config
  generation_config: *generation_config
  save_folder: "output/sparse"
  graph_config:
    recursion_limit: 150
  sparse_builder_config: *sparse_builder_config
  agents:
    SkeletonReconstructor:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
    SkeletonChecker:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
    ParticipantReconstructor:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
    TransactionReconstructor:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
    EpisodeReconstructor:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
    StageDescriptionReconstructor:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
    EventDescriptionReconstructor:
      lm_type: *lm_type
      lm_name: *lm_name
      inference_config: *inference_config
      generation_config: *generation_config
