<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event process graph</title>
<style>
:root {
  --navy: #0b3865;
  --ink: #203547;
  --muted: #687c8b;
  --border: #d5e0e7;
  --green: #2c745e;
  --purple: #80589f
}

* {
  box-sizing: border-box
}

[hidden] {
  display: none !important
}

body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: var(--ink);
  background: white;
  font: 14px/1.4 Arial, Helvetica, sans-serif
}

button,
select {
  font: inherit;
  color: inherit
}

button {
  cursor: pointer
}

button:focus-visible,
select:focus-visible {
  outline: 3px solid #398bc3;
  outline-offset: 2px
}

#toolbar {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: white;
  border-bottom: 1px solid var(--border)
}

#toolbar button,
#toolbar select {
  border: 1px solid #c6d3dd;
  border-radius: 4px;
  background: white;
  padding: 4px 9px
}

#picker {
  flex: 0 1 28em;
  min-width: 0;
  width: 0
}

.phase-controls, .zoom-controls {
  display: flex;
  align-items: center;
  gap: 5px
}
.phase-controls { flex: 1 1 160px; min-width: 0 }
.phase-controls button, .zoom-controls button { white-space: nowrap }
#toolbar > span { font-size: 12px; color: var(--muted) }
#zoom-level { min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums }
#toolbar button[aria-pressed=true] { color: var(--navy); border-color: #6689a8; background: #edf4fa }

#workspace, #sheet, #viewport {
  flex: 1;
  min-width: 0;
  min-height: 0
}
#workspace { display: flex; overflow: hidden }
#sheet { position: relative; display: flex; flex-direction: column }
#phase-bridges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4 }
#phase-bridges .bridge { fill: none; pointer-events: stroke; cursor: pointer }
.phase-number { display: none }
#outline[open] #phase-destination { display: none }

#viewport { overflow: hidden auto }
#viewport.phase-fitted, #viewport.measuring-fit { overflow-y: hidden }

#content { position: relative; isolation: isolate }
#diagram-scroll { overflow: auto hidden }
#diagram-size { position: relative; overflow: clip; min-width: 100% }
#graph { position: absolute; inset: 0 auto auto 0; transform-origin: top left }
#trace-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3 }

#heading {
  background: var(--navy);
  color: white;
  margin: 0;
  padding: 10px 18px;
  font-size: clamp(17px, 2vw, 24px);
  line-height: 1.2
}
#heading, #subheading { overflow-wrap: anywhere }

#subheading {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  justify-content: space-between;
  padding: 6px 18px;
  color: var(--muted)
}

#outline { flex: none; border-bottom: 1px solid var(--border) }
#outline summary { cursor: pointer; color: var(--navy); padding: 3px 18px 5px; font-size: 12px }
#navigation {
  display: flex;
  gap: 8px;
  padding: 0 16px 6px;
  max-height: 18vh;
  overflow: auto;
  align-items: stretch
}

.stage {
  background: #f7fafc;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  min-width: 210px;
  flex: 1
}

.stage small {
  font-size: 10px;
  color: var(--muted)
}

.stage h2 {
  font-size: 13px;
  margin: 3px 0 8px;
  line-height: 1.3
}

.phase-list {
  display: flex;
  gap: 6px
}

.phase-list button {
  flex: 1;
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px;
  font-size: 11px;
  line-height: 1.3
}

.phase-list button.active {
  background: #2868a8;
  color: white;
  border-color: #2868a8
}
.phase-list button.relation-destination { outline: 2px solid var(--purple); outline-offset: 1px }
@media (max-width: 799px), (max-height: 599px) {
  #navigation { gap: 3px; padding: 0 6px 5px }
  .stage { min-width: 72px; padding: 2px 4px }
  .stage small, .phase-name { display: none }
  .stage h2 { margin: 1px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .phase-list { gap: 2px; flex-wrap: wrap }
  .phase-list button { padding: 3px 2px; font-size: 10px }
  .phase-number { display: inline; white-space: nowrap }
}

#regions,
#cards,
#links {
  position: absolute;
  inset: 0;
  pointer-events: none
}

.section {
  position: absolute;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white
}

#references { display: grid; gap: 12px; padding: 0 16px }
#references { zoom: var(--content-scale, 1) }
#references:empty { display: none }
.reference-section { border: 1px solid var(--border); border-radius: 7px; padding: 12px; background: #f8fbfa }
.reference-section.sources { background: #f7f9fc }
.reference-section header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px }
.reference-section h3 { font-size: 18px; margin: 0 }
.reference-section .legend { flex-wrap: wrap; font-size: 11px }
.reference-grid { display: grid; gap: 10px; margin-top: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)) }
.reference-grid .card { position: relative; z-index: 4; min-height: 64px; width: 100% }
.reference-grid .card.evidence .title { -webkit-line-clamp: 4 }
.card.evidence { background: #f0f6ee; border-color: #9eb699 }
.relation-control { pointer-events: stroke; cursor: pointer }
.relation-control:focus-visible { stroke: var(--purple); stroke-opacity: .35; outline: none }
.edge-label.relation-control { pointer-events: all }
#inspector { flex: 0 0 clamp(320px, 32vw, 480px); min-width: 0; display: flex; flex-direction: column;
  background: #fff; border-left: 1px solid var(--border); color: var(--ink) }
.inspector-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--border) }
.inspector-nav button, .trace-link { background: #fff; border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 8px; font-size: 12px; text-align: left }
.area-links { display: inline-flex; gap: 10px; align-items: center }
.stage h2 .trace-link, #subheading .trace-link { background: transparent; color: inherit; border: 0; padding: 0; margin: 0; font: inherit }
.stage h2 .trace-link:hover, #subheading .trace-link:hover { text-decoration: underline }
.area-links button { border: 0; padding: 0; background: transparent; color: var(--navy); text-decoration: underline }
.inspector-nav button:disabled { opacity: .45; cursor: default }
#inspection { overflow: auto; padding: 18px; overflow-wrap: anywhere }
#inspection h2 { margin: 4px 0 12px; font-size: 20px; line-height: 1.25; color: var(--navy) }
#inspection h3 { margin: 20px 0 7px; color: var(--navy); font-size: 15px }
#inspection p { margin: 5px 0 9px; white-space: pre-wrap }
#inspection blockquote { margin: 12px 0; padding: 10px 12px; background: #f1f6f1;
  border-left: 3px solid var(--green); white-space: pre-wrap }
#inspection a { color: var(--navy); text-underline-offset: 2px }
.inspection-meta, .field-note { font-size: 12px; color: #506678 }
.field-note.warning { color: #84501d }
.claim, .occurrence { padding: 7px 0; border-top: 1px solid #dbe4e8 }
.claim summary, .occurrence summary { cursor: pointer; font-weight: 600; line-height: 1.4 }
.claim .support { padding: 5px 0 4px 10px; margin: 7px 0; border-left: 2px solid #c3d7ca }
.trace-link { margin: 2px 4px 3px 0; color: #235d49; background: #f7faf7 }
.trace-link:hover { border-color: #719782 }
.relation-list .trace-link, .passage-list .trace-link { display: block; width: 100% }
.occurrence .claim { margin-left: 10px }
@media (max-width: 600px), (max-width: 1024px) and (min-height: 520px) {
  #workspace { flex-direction: column }
  #inspector { min-height: 0; max-height: 48%; flex: 0 1 auto; border-left: 0; border-top: 1px solid var(--border) }
  #inspection { padding: 10px 14px }
}
@media (max-width: 640px) {
  #toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; padding: 5px }
  #toolbar button, #toolbar select { padding: 4px 6px }
  .phase-controls { grid-column: 1 / -1 }
  #toolbar > span { grid-area: 2 / 1; font-size: 11px }
  #picker { flex: 1 }
  .zoom-controls { grid-area: 2 / 2 }
  #toolbar .phase-word { display: none }
  #heading, #subheading, #outline summary { padding-inline: 10px }
  #references { padding-inline: 8px }
  .reference-section { padding: 9px }
}

.section h3 {
  font-size: 18px;
  margin: 9px 12px
}

.section .legend {
  position: absolute;
  left: 620px;
  max-width: 450px;
  font-size: 11px;
  color: var(--green);
  margin: 14px
}

.relationship-legend { display: flex; align-items: center; gap: 10px }
.legend-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap }

#links {
  overflow: visible;
  z-index: 1
}

#cards {
  z-index: 2
}

.edge-line,
.edge-halo,
.edge-flow {
  stroke-linecap: round;
  stroke-linejoin: round
}

.edge-line,
.edge-label,
.edge-origin,
.edge-halo {
  transition: opacity 140ms ease
}

.edge-flow {
  stroke-dasharray: 6 24;
  animation: edge-direction 1.8s linear infinite
}

@keyframes edge-direction {
  to { stroke-dashoffset: -60 }
}

@media (prefers-reduced-motion: reduce) {
  .edge-flow { display: none !important; animation: none }
  .edge-line, .edge-label, .edge-origin, .edge-halo, .card { transition: none !important }
}

#links .edge-label text {
  font: 600 10.5px Arial, Helvetica, sans-serif;
  stroke: none
}
#links .edge-label.relation-control text { font-size: 12px }

.card {
  pointer-events: auto;
  position: absolute;
  display: block;
  text-align: left;
  border: 1px solid #9dbeb0;
  background: #e2f0e6;
  border-radius: 6px;
  padding: 8px 10px;
  overflow: hidden;
  overflow-wrap: anywhere;
  cursor: pointer
}

.card.context,
.card.phase {
  background: #fff4d7;
  border-color: #d8be76
}

.card.source {
  background: #f2f6fa;
  border-color: #a5b6c7
}

.card.party {
  background: transparent;
  border: 0;
  padding: 0;
  text-align: center
}

.party-icon {
  display: block;
  width: 56px;
  height: 56px;
  margin: 0 auto 4px
}

.card.party .title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  -webkit-line-clamp: 2
}

.party-caption {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px
}

.card:hover {
  outline: 2px solid #7093a8;
  outline-offset: 1px
}

.card { transition: opacity 140ms ease, box-shadow 140ms ease }
.card.relation-muted { opacity: .48 }
.card.evidence-active { opacity: 1; box-shadow: 0 0 0 2px #709983 }
.card.relation-neighbor { box-shadow: 0 0 0 2px #7eac9566 }
.card.context.relation-neighbor { box-shadow: 0 0 0 2px #d8be7680 }
.card.relation-focus { outline: 2px solid #537f98; outline-offset: 2px }
.card.party.relation-neighbor,
.card.party.relation-focus { outline: none; box-shadow: none }
.card.party.relation-neighbor .party-icon circle:first-child {
  stroke: #6e98bc;
  stroke-width: 2
}
.card.party.relation-focus .party-icon circle:first-child {
  stroke: #3e6b92;
  stroke-width: 2.6
}

.card .meta {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  font-weight: 600;
  padding-right: 0;
  margin-bottom: 5px;
  color: #385164
}

.card .title {
  font-size: 13px;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden
}

.card.compact .title {
  -webkit-line-clamp: 2
}

.card.compact .participants {
  display: none
}

.card.action .title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  -webkit-line-clamp: 3
}

.card.context .title {
  font-weight: 400
}

.card .participants {
  display: block;
  color: #2868a8;
  font-size: 10px;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
  margin-top: 6px
}

.badges {
  position: absolute;
  right: 4px;
  top: 4px;
  background: var(--green);
  color: white;
  border-radius: 3px;
  font-size: 9px;
  padding: 2px 4px;
  max-width: 90px;
  overflow: hidden;
  white-space: nowrap
}

.card.source .title {
  color: var(--green);
  font-size: 13px;
  font-weight: 600;
  -webkit-line-clamp: 2
}

.card .excerpt {
  font-size: 11px;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 7px;
  line-height: 1.35
}

.card .targets {
  display: block;
  color: var(--green);
  font-size: 10px;
  margin-top: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.card[aria-expanded=true] {
  z-index: 8;
  box-shadow: 0 5px 20px #233b4c35;
  outline: 2px solid #537f98
}

[hidden] {
  display: none !important
}

svg text {
  font: 10px Arial, Helvetica, sans-serif;
  paint-order: stroke;
  stroke: white;
  stroke-width: 5px;
  stroke-linejoin: round
}
</style>
</head>
<body>
<div id="toolbar">
<div class="phase-controls"><button id="previous" aria-label="Previous phase">←<span class="phase-word"> Phase</span></button>
<select id="picker" aria-label="Phase"></select>
<button id="next" aria-label="Next phase"><span class="phase-word">Phase </span>→</button></div>
<!--__BUILD_STATUS__-->
<div class="zoom-controls" role="group" aria-label="Diagram zoom">
<button id="fit" aria-pressed="true" title="Fit all cards in this phase (100%)">Fit phase</button>
<button id="minus" aria-label="Zoom out">−</button>
<output id="zoom-level" aria-label="Zoom relative to the fitted phase"></output>
<button id="plus" aria-label="Zoom in">+</button>
<button id="zoom" title="Show cards at their original reading size">Reading size</button></div>
</div>
<div id="workspace"><main id="sheet">
<h1 id="heading"></h1><div id="subheading"></div>
<details id="outline"><summary>Stages and phases<span id="phase-destination"></span></summary><nav id="navigation" aria-label="Stages and phases"></nav></details>
<div id="viewport"><div id="content">
<div id="diagram-scroll" tabindex="0" role="region" aria-label="Phase diagram"><div id="diagram-size"><div id="graph"><div id="regions"></div><svg id="links" aria-label="Graph relationships"></svg><div id="cards"></div></div></div></div>
<div id="references"></div>
<svg id="trace-overlay" aria-hidden="true"><defs id="trace-defs"></defs><g id="evidence-lines"></g></svg>
</div></div>
<svg id="phase-bridges" aria-hidden="true"><defs><marker id="phase-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 1L9 5L0 9L3 5Z" fill="var(--purple)"/></marker></defs><g></g></svg>
</main>
<aside id="inspector" hidden aria-labelledby="inspection-title">
  <div class="inspector-nav"><button id="inspection-back" type="button">← Back</button>
  <button id="inspection-close" type="button" aria-label="Close details">Close ×</button></div>
  <div id="inspection"></div>
</aside></div>
<script id="epg-data" type="application/json">__EPG_GRAPH_JSON__</script>
<script id="epg-layout" type="application/json">__EPG_LAYOUT_JSON__</script>
<script id="epg-view" type="application/json">__EPG_VIEW_JSON__</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const graph = JSON.parse($('epg-data').textContent);
const view = JSON.parse($('epg-view').textContent);
const evidence = new Map(graph.evidence.map(item => [item.evidence_id, item]));
const sources = new Map(graph.sources.map(item => [item.source_id, item]));
const cards = new Map();
let drawnEdges = [], hovered = null, focused = null;
let relationshipLabels = null, relationshipObstacles = [];
const EDGE_STYLES = {
  relation: {color: '#80589f', tint: '#f7f3fa', border: '#d8c9e3', width: 2.2, opacity: .94},
  party: {color: '#607f9c', tint: '#f2f7fb', border: '#c0d1df', width: 1.4, opacity: .76},
  context: {color: '#a18a51', tint: '#fff8e8', border: '#dfcea0', width: 1.45, opacity: .82},
  evidence: {color: '#4f8270', tint: '#f2f8f5', border: '#bdd5c8', width: 1.05, opacity: .34}
};

function edgeStyle(edge) {
  const style = EDGE_STYLES[edge.kind] || EDGE_STYLES.context;
  return {...style, opacity: edge.type === 'about' ? .52 : style.opacity};
}

function edgePattern(edge) {
  if (edge.kind === 'relation' && (edge.type === 'order_unknown' || edge.record?.basis === 'inferred')) return '5 4';
  if (edge.kind === 'context') return '8 3';
  if (edge.kind === 'evidence') return '2 5';
  return '';
}
let current = 0,
  expanded = null,
  scale = 1,
  zoomRatio = 1,
  fitCache = null;
let diagramWidth = 0;
let phaseTrail = [];

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function position(node, box) {
  const [x, y, w, h] = box;
  Object.assign(node.style, {
    left: x + 'px',
    top: y + 'px',
    width: w + 'px',
    height: h + 'px'
  });
}

function svg(tag, attrs) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
}

function bounds(node) {
  return [node.offsetLeft, node.offsetTop, node.offsetWidth, node.offsetHeight];
}

function partyIcon(type) {
  const icon = svg('svg', {'viewBox': '0 0 56 56', 'class': 'party-icon', 'aria-hidden': 'true'});
  icon.append(svg('circle', {cx: 28, cy: 28, r: 27, fill: '#dfedfa', stroke: '#83a6c7'}));
  if (type === 'organization') {
    icon.append(svg('path', {d: 'M16 14H40V43H16Z', fill: '#2868a8'}));
    for (const x of [21, 31]) for (const y of [20, 29])
      icon.append(svg('rect', {x, y, width: 4, height: 5, fill: 'white'}));
  } else {
    icon.append(svg('circle', {cx: 28, cy: 19, r: 7, fill: '#2868a8'}));
    icon.append(svg('path', {d: 'M15 42V35Q15 28 22 28H34Q41 28 41 35V42Z', fill: '#2868a8'}));
  }
  return icon;
}

function linkBox(item) {
  const box = bounds(item.button);
  if (item.card.kind === 'party')
    return [box[0] + (box[2] - 56) / 2, box[1], 56, 56];
  return box;
}

function highlight(key) {
  hovered = key;
  const active = hovered || focused || expanded;
  const moving = Boolean(hovered || (focused && !expanded));
  const neighbors = new Set(active ? [active] : []);
  for (const item of drawnEdges) {
    const {edge, line, halo, flow, origin, emphasis} = item;
    const selected = (edge.relation_id && edge.relation_id === selection?.id) ||
      Boolean(active && (active === edge.from_key || active === edge.to_key));
    const style = edgeStyle(edge);
    if (selected) {
      neighbors.add(edge.from_key);
      neighbors.add(edge.to_key);
    }
    line.setAttribute('opacity', selected ? 1 : active ? .16 : style.opacity);
    line.setAttribute('stroke-width', selected ? style.width + .8 : style.width);
    halo.setAttribute('stroke-width', style.width + 4);
    halo.setAttribute('opacity', selected ? .95 : 0);
    emphasis.style.display = selected ? '' : 'none';
    flow.style.display = selected && moving && !symmetricRelation(edge.type) &&
      edge.record?.basis !== 'inferred' ? '' : 'none';
    origin.setAttribute('opacity', selected && !symmetricRelation(edge.type) ? .9 : 0);
  }
  for (const [nodeKey, item] of cards) {
    item.button.classList.toggle('relation-focus', nodeKey === active);
    item.button.classList.toggle('relation-neighbor', nodeKey !== active && neighbors.has(nodeKey));
    item.button.classList.toggle('relation-muted', Boolean(active && !neighbors.has(nodeKey)));
  }
  drawRelationshipLabels(active);
}

function drawRelationshipLabels(active) {
  if (!relationshipLabels) return;
  // Keep action labels mounted when focus leaves a card for a relation.
  // Only the ancillary labels depend on which card the reader is inspecting.
  const persistent = relationshipLabels.firstElementChild, contextual = relationshipLabels.lastElementChild;
  contextual.replaceChildren();
  const obstacles = [...relationshipObstacles];
  const priority = {relation: 0, context: 1, party: 2, evidence: 3};
  const visible = drawnEdges.filter(({edge}) => edge.kind === 'relation' || (active ?
    edge.from_key === active || edge.to_key === active :
    edge.kind !== 'evidence' && edge.type !== 'about'));
  visible.sort((a, b) => (priority[a.edge.kind] ?? 4) - (priority[b.edge.kind] ?? 4));
  for (const item of visible) {
    const {edge, points} = item;
    const relation = edge.kind === 'relation';
    if (relation && item.label) { obstacles.push(item.labelBox); continue; }
    const text = relation ? relationName(edge.record) : pretty(edge.type);
    let location;
    if (edge.jump) {
      const connector = port(item.slot, 3);
      location = {box: item.slot, anchor: connector, connector};
    } else if (relation) {
      location = actionLabelPosition(points, item.slot, obstacles);
    } else {
      location = labelPosition(points, labelWidth(text, false), obstacles, diagramWidth);
    }
    if (!location) continue;
    const {box, anchor, connector} = location;
    obstacles.push(box);
    const style = edgeStyle(edge);
    const label = svg('g', {'class': 'edge-label', 'data-from': edge.from_key, 'data-to': edge.to_key});
    if (edge.relation_id) {
      label.classList.add('relation-control');

      label.append(svg('line', {x1: anchor[0], y1: anchor[1], x2: connector[0], y2: connector[1],
        stroke: style.color, 'stroke-width': .8, opacity: .6}));

      fill: style.color, 'text-anchor': 'middle'});

function paintCard(card, container) {

// The diagram scrolls independently of the outline. Join each diagram port to
// its actual Phase button using viewport coordinates, including after zoom.
function drawPhaseBridges() {
  const overlay = $('phase-bridges'), layer = overlay.lastElementChild;
  layer.replaceChildren();
  if (!$('outline').open) return;
  const base = overlay.getBoundingClientRect(), nav = $('navigation').getBoundingClientRect();
  const viewport = $('viewport').getBoundingClientRect(), graphBox = $('graph').getBoundingClientRect();
  if (graphBox.top < viewport.top - 1 || graphBox.top >= viewport.bottom) return;
  const byPage = new Map();
  for (const line of drawnEdges) {
    const link = line.edge.jump;
    if (!link) continue;
    if (!byPage.has(link.page)) byPage.set(link.page, []);
    byPage.get(link.page).push(line);
  }
  for (const [index, lines] of byPage) {
    const tab = $('navigation').querySelector('[data-page="' + index + '"]');
    if (!tab) continue;
    const box = tab.getBoundingClientRect();
    if (box.bottom <= nav.top || box.bottom > nav.bottom + 1) continue;
    // Fan edges along the same tab in port order and retain the recorded arrow direction.
    lines.sort((a, b) => a.edge.gateX - b.edge.gateX);
    lines.forEach(({edge}, i) => {
      const tabX = box.left + box.width * (i + 1) / (lines.length + 1);
      const graphX = graphBox.left + edge.gateX * scale;
      if (tabX < nav.left || tabX > nav.right || graphX < viewport.left || graphX > viewport.right) return;
      const port = [graphX - base.left, graphBox.top - base.top],
        button = [tabX - base.left, box.bottom - base.top];
      const [a, b] = edge.remoteFrom ? [button, port] : [port, button];
      const mid = (a[1] + b[1]) / 2;
      const path = svg('path', {class: 'bridge', 'data-relation-id': edge.relation_id, 'data-page': index,
        d: 'M' + a + ' C' + [a[0], mid] + ' ' + [b[0], mid] + ' ' + b,
        stroke: EDGE_STYLES.relation.color, 'stroke-width': Math.max(.8,
          (EDGE_STYLES.relation.width + (selection?.id === edge.relation_id ? .8 : 0)) * scale),
        'stroke-dasharray': edgePattern(edge) ? (5 * scale) + ' ' + (4 * scale) : 'none'});
      if (!edge.remoteFrom && !symmetricRelation(edge.type)) path.setAttribute('marker-end', 'url(#phase-arrow)');
      path.onclick = () => inspectRecord(edge.relation_id);
      layer.append(path);
    });
  }
}

function port(box, side) {
  const [x, y, w, h] = box;
  return [
    [x, y + h / 2],
    [x + w, y + h / 2],
    [x + w / 2, y],
    [x + w / 2, y + h]
  ][side];
}

function outward(point, side) {
  const shifts = [
    [-12, 0],
    [12, 0],
    [0, -12],
    [0, 12]
  ];
  return point.map((v, i) => v + shifts[side][i]);
}

function ports(a, b, kind) {
  const dx = b[0] + b[2] / 2 - a[0] - a[2] / 2;
  const dy = b[1] + b[3] / 2 - a[1] - a[3] / 2;
  if (kind === 'evidence') return [2, Math.abs(dx) > b[2] ? dx > 0 ? 0 : 1 : 3];
  if (Math.abs(dy) > Math.max(a[3], b[3])) return dy > 0 ? [3, 2] : [2, 3];
  return dx > 0 ? [1, 0] : [0, 1];
}

function blocked(a, b, boxes) {
  return boxes.some(([x, y, w, h]) => {
    if (a[0] === b[0]) return a[0] > x - 3 && a[0] < x + w + 3 && Math.max(a[1], b[1]) > y - 3 && Math
      .min(a[1], b[1]) < y + h + 3;
    return a[1] > y - 3 && a[1] < y + h + 3 && Math.max(a[0], b[0]) > x - 3 && Math.min(a[0], b[0]) < x +
      w + 3;
  });
}

function routingGrid(boxes, canvasWidth, height, gates) {
  const xs = new Set([10, canvasWidth - 10, ...gates]),
    ys = new Set([8, height - 10]);
  for (const [x, y, w, h] of boxes) {
    [x - 12, x + w + 12, x + w / 2].forEach(v => xs.add(v));
    [y - 12, y + h + 12, y + h / 2].forEach(v => ys.add(v));
  }
  const x = [...xs].sort((a, b) => a - b),
    y = [...ys].sort((a, b) => a - b),
    width = x.length;
  const neighbors = Array.from({
    length: width * y.length
  }, () => []);
  for (let j = 0; j < y.length; j++)
    for (let i = 0; i < x.length; i++) {
      const id = j * width + i,
        p = [x[i], y[j]];
      for (const [ni, nj] of [
          [i + 1, j],
          [i, j + 1]
        ]) {
        if (ni >= x.length || nj >= y.length) continue;
        const q = [x[ni], y[nj]],
          other = nj * width + ni;
        if (blocked(p, q, boxes)) continue;
        const cost = Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]);
        neighbors[id].push([other, cost]);
        neighbors[other].push([id, cost]);
      }
    }
  return {
    x,
    y,
    width,
    neighbors
  };
}
class Heap {
  constructor() {
    this.items = [];
  }
  push(item) {
    const a = this.items;
    a.push(item);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (a[p][0] <= item[0]) break;
      a[i] = a[p];
      i = p;
    }
    a[i] = item;
  }
  pop() {
    const a = this.items,
      result = a[0],
      last = a.pop();
    if (a.length) {
      let i = 0;
      while (i * 2 + 1 < a.length) {
        let c = i * 2 + 1;
        if (c + 1 < a.length && a[c + 1][0] < a[c][0]) c++;
        if (a[c][0] >= last[0]) break;
        a[i] = a[c];
        i = c;
      }
      a[i] = last;
    }
    return result;
  }
}

function route(start, end, grid) {
  const {
    x,
    y,
    width,
    neighbors
  } = grid;
  const first = y.indexOf(start[1]) * width + x.indexOf(start[0]),
    last = y.indexOf(end[1]) * width + x.indexOf(end[0]);
  const distance = new Map([
      [first, 0]
    ]),
    previous = new Map(),
    heap = new Heap();
  const point = id => [x[id % width], y[Math.floor(id / width)]];
  const heuristic = id => {
    const p = point(id);
    return Math.abs(p[0] - end[0]) + Math.abs(p[1] - end[1]);
  };
  heap.push([heuristic(first), first]);
  while (heap.items.length) {
    const [estimate, id] = heap.pop();
    if (id === last) {
      const path = [point(id)];
      let cursor = id;
      while (previous.has(cursor)) {
        cursor = previous.get(cursor);
        path.push(point(cursor));
      }
      return path.reverse();
    }
    if (estimate > distance.get(id) + heuristic(id)) continue;
    for (const [next, length] of neighbors[id] || []) {
      const cost = distance.get(id) + length + 1;
      if (cost >= (distance.get(next) ?? Infinity)) continue;
      distance.set(next, cost);
      previous.set(next, id);
      heap.push([cost + heuristic(next), next]);
    }
  }
  return null;
}

function simplify(points) {
  const result = [];
  for (const point of points) {
    const last = result[result.length - 1];
    if (last && point[0] === last[0] && point[1] === last[1]) continue;
    while (result.length > 1) {
      const a = result[result.length - 2], b = result[result.length - 1];
      if (!((a[0] === b[0] && b[0] === point[0]) ||
            (a[1] === b[1] && b[1] === point[1]))) break;
      result.pop();
    }
    result.push(point);
  }
  return result;
}

function labelWidth(text, relation) {
  return Math.ceil(text.length * (relation ? 6.6 : 5.7)) + 14;
}

function overlapsLabel([x, y, w, h], [ox, oy, ow, oh]) {
  return x < ox + ow + 3 && x + w > ox - 3 && y < oy + oh + 3 && y + h > oy - 3;
}

// Project onto the wire itself, including the interior of each orthogonal segment.
function actionLabelPosition(points, slot, obstacles) {
  const [left, top, w, h] = slot, cx = left + w / 2, cy = top + h / 2;
  const clamp = (v, a, b) => Math.max(Math.min(a, b), Math.min(Math.max(a, b), v));
  let anchor = points[0], distance = Infinity;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    const x = clamp(cx, a[0], b[0]), y = clamp(cy, a[1], b[1]);
    const d = Math.hypot(x - cx, y - cy);
    if (d < distance) { anchor = [x, y]; distance = d; }
  }
  const [x, y] = anchor;
  const positions = [[x - w / 2, y - h - 5], [x - w / 2, y + 5],
                     [x + 5, y - h / 2], [x - w - 5, y - h / 2]];
  const box = positions.map(([bx, by]) => [bx, by, w, h]).find(b =>
    b[0] >= 8 && b[0] + w <= diagramWidth - 8 && b[1] >= 0 &&
    !obstacles.some(o => o !== slot && overlapsLabel(b, o))) || slot;
  return {box, anchor, connector: [clamp(x, box[0], box[0] + w), clamp(y, box[1], box[1] + h)]};
}

function labelPosition(points, width, obstacles, canvasWidth) {
  const height = 20;
  const candidates = [];
  for (let offset = 0; offset < 4; offset++) {
    const gap = 5 + offset * 27;
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      const x = (a[0] + b[0]) / 2, y = (a[1] + b[1]) / 2;
      if (a[1] === b[1] && Math.abs(a[0] - b[0]) >= Math.min(width, 32)) {
        candidates.push(
          {box: [x - width / 2, y - height - gap, width, height], anchor: [x, y], connector: [x, y - gap]},
          {box: [x - width / 2, y + gap, width, height], anchor: [x, y], connector: [x, y + gap]});
      } else if (a[0] === b[0] && Math.abs(a[1] - b[1]) > height + 8) {
        candidates.push(
          {box: [x + gap, y - height / 2, width, height], anchor: [x, y], connector: [x + gap, y]},
          {box: [x - width - gap, y - height / 2, width, height], anchor: [x, y], connector: [x - gap, y]});
      }
    }
  }
  return candidates.find(({box, anchor, connector}) =>
    box[0] > 8 && box[0] + box[2] < canvasWidth - 10 && box[1] > 0 &&
    box[1] + box[3] < parseFloat($('graph').style.height) - 5 &&
    !obstacles.some(other => overlapsLabel(box, other)) && !blocked(anchor, connector, obstacles));
}

function drawEdges() {

  const boxes = new Map([...cards].filter(([, item]) => !['source', 'evidence'].includes(item.card.kind))

  const jumps = [...page.jumps].sort((a, b) => a.page - b.page);
  const singleRow = jumps.length > 0 &&
    slots.get(jumps[0].relation_id)[1] === slots.get(jumps[jumps.length - 1].relation_id)[1];
  const cross = jumps.map((jump, i) => {
    const rid = jump.relation_id, record = objects.get(rid).record;

    const remoteFrom = jump.id === record.from_action_id;

    return {kind: 'relation', type: record.type, relation_id: rid, record, jump, remoteFrom,
      from_key: remoteFrom ? remote : local, to_key: remoteFrom ? local : remote,
      gateX: singleRow ? slot[0] + slot[2] / 2 : (i + .5) * diagramWidth / jumps.length};
  });
  const partyLabels = [...cards.values()].filter(item => item.card.kind === 'party').map(item => {
      const [x, y, w] = bounds(item.button);

    });
  const headings = [];

    const [x, y] = section.box;
    headings.push([x + 10, y + 5, Math.min(400, section.title.length * 10), 30]);
    if (section.title === 'Actions and their context') headings.push([645, y + 7, 450, 28]);
  }
  const obstacles = [...boxes.values(), ...partyLabels, ...headings];
  for (const {edge, lane, width} of page.actionLabels) {
    const a = boxes.get(edge.from_key), b = boxes.get(edge.to_key);
    slots.set(edge.relation_id, [actionLabelX(a, b) - width / 2,
      Math.max(a[1], b[1]) - (lane + 1) * LABEL_LANE_HEIGHT, width, 20]);
  }
  relationshipObstacles = obstacles.concat([...slots.values()]);
  const grid = routingGrid(obstacles, diagramWidth, height, cross.map(edge => edge.gateX));
  const structural = page.edges.filter(edge => edge.kind !== 'evidence').concat(cross);
  structural.sort((a, b) => Number(a.kind === 'relation') - Number(b.kind === 'relation'));
  for (const edge of structural) {
    const a = boxes.get(edge.from_key),
      b = boxes.get(edge.to_key);
    if (!a || !b) continue;
    const preferred = ports(a, b, edge.kind);
    // A cross-page wire passes through its label and exits at the graph's upper border.
    if (edge.jump) preferred[edge.remoteFrom ? 0 : 1] = 3;
    let points = null;
    const alternatives = [
      [...preferred]
    ];
    for (const as of [preferred[0], 0, 1, 2, 3])
      for (const bs of [preferred[1], 0, 1, 2, 3]) {
        if (as !== preferred[0] || bs !== preferred[1]) alternatives.push([as, bs]);
      }
    for (const [as, bs] of alternatives) {
      if (edge.jump && (edge.remoteFrom ? as : bs) !== 3) continue;
      const start = port(a, as),
        end = port(b, bs);
      const path = route(outward(start, as), outward(end, bs), grid);
      if (path) {
        points = simplify([start, ...path, end]);
        break;
      }
    }
    if (!points) {
      if (edge.kind !== 'relation') continue;
      const start = port(a, preferred[0]), end = port(b, preferred[1]);
      points = [start, [start[0], end[1]], end];
    }
    if (edge.jump) {
      const box = slots.get(edge.relation_id), top = port(box, 2);
      const gate = [edge.gateX, 8], above = outward(top, 2);
      const path = route(gate, above, grid) || [gate, [gate[0], above[1]], above];
      const stem = [[edge.gateX, 0], ...path, top];
      points = simplify(edge.remoteFrom ? [...stem, ...points] : [...points, ...stem.reverse()]);
    }
    const style = edgeStyle(edge);
    const attributes = {
      points: points.map(p => p.join(',')).join(' '),
      fill: 'none',
      stroke: style.color,
      'marker-end': symmetricRelation(edge.type) || (edge.jump && !edge.remoteFrom) ?
        'none' : 'url(#arrow-' + edge.kind + ')',
      'stroke-dasharray': edgePattern(edge) || 'none',
      'data-from': edge.from_key,
      'data-to': edge.to_key
    };
    const line = svg('polyline', {...attributes, 'class': 'edge-line'});
    const tooltip = svg('title', {});
    tooltip.textContent = edge.type.replaceAll('_', ' ');
    line.append(tooltip);
    baseLayer.append(line);
    if (edge.relation_id) {
      const hit = svg('polyline', {points: attributes.points, fill: 'none', stroke: 'transparent',
        'stroke-width': 14, 'class': 'relation-control', role: 'button', tabindex: 0,
        'data-relation-id': edge.relation_id, 'aria-controls': 'inspector',
        'aria-label': relationName(edge.record)});
      hit.onclick = () => inspectRecord(edge.relation_id);
      hit.onkeydown = event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); inspectRecord(edge.relation_id); }
      };
      hitLayer.append(hit);
      if (edge.relation_id === returnId) returnTo = hit;
      if (edge.relation_id === focusId) hit.focus({preventScroll: true});
    }
    const emphasis = svg('g', {'class': 'edge-emphasis'});
    const halo = svg('polyline', {points: attributes.points, fill: 'none', stroke: 'white',
      'class': 'edge-halo'});
    const focusLine = svg('polyline', {...attributes, 'class': 'edge-line', 'stroke-width': style.width + .8});
    const flow = svg('polyline', {points: attributes.points, fill: 'none', stroke: style.color,
      'stroke-width': style.width + 1.2, 'class': 'edge-flow', opacity: .8});
    const origin = svg('circle', {cx: points[0][0], cy: points[0][1], r: 2.5,
      fill: style.color, stroke: 'white', 'stroke-width': 1, 'class': 'edge-origin'});
    emphasis.append(halo, focusLine, flow, origin);
    emphasisLayer.append(emphasis);
    drawnEdges.push({edge, line, points, halo, focusLine, flow, origin, emphasis,
      slot: slots.get(edge.relation_id), label: null});
  }
  highlight(hovered);
  paintEvidenceSelection();
}

function paintEvidenceSelection() {
  const evidenceLayer = $('evidence-lines');
  evidenceLayer.replaceChildren();
  for (const item of cards.values()) item.button.classList.remove('evidence-active');
  if (!selection) return;
  const {id, field} = fieldFocus || selection;
  const quotes = selectedPassages(id, field);
  const page = view.pages[current];
  const links = page.edges.filter(edge => edge.kind === 'evidence');
  const kind = objects.get(id)?.kind;
  if (kind === 'relation' && selectedPhaseLink()) {
    for (const {card, button} of cards.values())
      if (card.kind === 'evidence' && quotes.has(card.id)) button.classList.add('evidence-active');
  }
  if (!fieldFocus && (kind === 'entity' || kind === 'person')) {
    for (const edge of links) if (edge.to === id) quotes.add(edge.from);
  }
  const origin = $('trace-overlay').getBoundingClientRect();
  const frame = $('diagram-scroll').getBoundingClientRect();
  function relativePoint(x, y, inDiagram) {
    if (inDiagram && (x < frame.left || x > frame.right)) return null;
    return [x - origin.left, y - origin.top];
  }
  function point(key, top) {
    const {card, button} = cards.get(key);
    const node = card.kind === 'party' ? button.querySelector('.party-icon') : button;
    const box = node.getBoundingClientRect();
    return relativePoint(box.left + box.width / 2, top ? box.top : box.bottom, $('graph').contains(button));
  }
  function connect(a, b) {
    if (!a || !b) return;
    const middle = (a[1] + b[1]) / 2;
    evidenceLayer.append(svg('path', {d: 'M' + a + ' C' + [a[0], middle] + ' ' + [b[0], middle] + ' ' + b,
      fill: 'none', stroke: EDGE_STYLES.evidence.color, 'stroke-width': 1.6, 'stroke-dasharray': '3 5',
      'marker-end': 'url(#arrow-evidence)'}));
  }
  for (const edge of links) {
    const show = edge.type === 'contains' ? quotes.has(edge.to) :
      quotes.has(edge.from) && (edge.to === id || edge.from === id);
    if (!show) continue;
    cards.get(edge.from_key).button.classList.add('evidence-active');
    cards.get(edge.to_key).button.classList.add('evidence-active');
    connect(point(edge.from_key, true), point(edge.to_key, false));
  }
  for (const line of drawnEdges) {
    const rid = line.edge.relation_id;
    if (!rid || (rid !== id && !(kind === 'evidence' && selectedPassages(rid, null).has(id)))) continue;
    const p = line.line.getPointAtLength(line.line.getTotalLength() / 2).matrixTransform(line.line.getScreenCTM());
    for (const [key, item] of cards) if (item.card.kind === 'evidence' && quotes.has(item.card.id)) {
      item.button.classList.add('evidence-active');
      connect(point(key, true), relativePoint(p.x, p.y, true));
    }
  }
}

function fitScale() {
  const viewport = $('viewport');
  const width = viewport.offsetWidth, height = viewport.clientHeight;
  if (!width || !height) return 0;
  if (fitCache?.width === width && fitCache.height === height) return fitCache.scale;
  const coreHeight = $('diagram-scroll').hidden ? 0 : $('graph').offsetHeight;
  const content = $('content'), refs = $('references');
  viewport.classList.add('measuring-fit');
  // Quote and source rows wrap at different scales. Measure their actual layout
  // without redrawing the diagram or routing any edges during the search.
  function fits(value) {
    content.style.setProperty('--content-scale', value);
    const tail = refs.getBoundingClientRect().height;
    return Math.round(coreHeight * value) + tail <= height &&
      refs.scrollWidth <= refs.clientWidth + 1;
  }
  let upper = coreHeight ? Math.min(width / view.pages[current].width, height / coreHeight) : 1;
  if (!coreHeight) while (upper < height && fits(upper)) upper *= 2;
  let best = upper;
  if (!fits(upper)) {
    best = 0;
    for (let i = 0; i < 14; i++) {
      const middle = (best + upper) / 2;
      if (fits(middle)) best = middle;
      else upper = middle;
    }
  }
  viewport.classList.remove('measuring-fit');
  fitCache = {width, height, scale: best};
  return best;
}

function spreadColumns(width) {
  diagramWidth = width;
  $('graph').style.width = width + 'px';
  const nodes = [...cards.values()].filter(item => $('cards').contains(item.button));
  if (!nodes.length) return;
  const boxes = nodes.map(item => item.card.box);
  const left = Math.min(...boxes.map(([x]) => x));
  const right = Math.max(...boxes.map(([x, , w]) => x + w));
  const centers = boxes.map(([x, , w]) => x + w / 2);
  const first = Math.min(...centers), last = Math.max(...centers);
  const inset = Math.min(left, view.pages[current].width - right);
  const extra = Math.max(0, width - right - inset);
  // Every row shares the same horizontal mapping. The layout owns row assignment and order.
  nodes.forEach(({button, card}, i) => {
    const share = first === last ? .5 : (centers[i] - first) / (last - first);
    const x = card.box[0] + extra * share;
    button.style.left = x + 'px';
  });
}

function sizeDiagram() {
  const area = $('diagram-scroll'), diagram = $('graph');
  const empty = area.hidden && !$('references').childElementCount;
  $('viewport').classList.toggle('phase-fitted', zoomRatio === 1);
  for (const button of ['fit', 'minus', 'plus', 'zoom']) $(button).disabled = empty;
  if (empty) {
    $('zoom-level').textContent = '—';
    if (!diagramWidth) { spreadColumns(view.pages[current].width); drawEdges(); }
    return;
  }
  const fit = fitScale();
  if (!fit) return;
  scale = fit * zoomRatio;
  $('content').style.setProperty('--content-scale', scale);
  $('diagram-size').style.height = Math.round(diagram.offsetHeight * scale) + 'px';
  const width = Math.max(view.pages[current].width, area.clientWidth / scale);
  diagram.style.transform = 'scale(' + scale + ')';
  $('diagram-size').style.width = Math.round(width * scale) + 'px';
  $('fit').setAttribute('aria-pressed', String(zoomRatio === 1));
  $('zoom-level').textContent = Math.round(zoomRatio * 100) + '%';
  $('minus').disabled = zoomRatio <= Math.min(.25, 1 / fit) + .001;
  $('plus').disabled = zoomRatio >= Math.max(2, 2 / fit) - .001;
  if (width !== diagramWidth) {
    spreadColumns(width);
    drawEdges();
  } else {
    paintEvidenceSelection();
  }
  drawPhaseBridges();
}

function changeZoom(value) {
  const area = $('diagram-scroll'), viewport = $('viewport');
  const frame = viewport.getBoundingClientRect(), before = $('graph').getBoundingClientRect();
  const centerX = area.clientWidth / 2;
  const centerY = Math.min(viewport.clientHeight, Math.max(0, before.bottom - frame.top)) / 2;
  const fractionX = before.width ? (frame.left + centerX - before.left) / before.width : 0;
  let y = (frame.top + centerY - before.top) / scale;
  let targetY = centerY;
  // Start detailed reading at the selected card or the first action in the overview.
  const selected = cards.get(expanded)?.button;
  const anchor = zoomRatio === 1 && value > 1 && centerY
    ? ($('cards').contains(selected) ? selected : $('cards').querySelector('.action')) : null;
  if (anchor) {
    const box = anchor.getBoundingClientRect();
    y = (box.top + box.height / 2 - before.top) / scale;
    targetY = viewport.clientHeight / 2;
  }
  const fit = fitScale();
  if (!fit) return;
  zoomRatio = Math.max(Math.min(.25, 1 / fit), Math.min(Math.max(2, 2 / fit), value));
  sizeDiagram();
  if (zoomRatio === 1) {
    area.scrollLeft = 0;
    viewport.scrollTop = 0;
  } else if (!area.hidden) {
    const after = $('graph').getBoundingClientRect();
    const box = anchor?.getBoundingClientRect();
    const targetX = box ? box.left + box.width / 2 : after.left + fractionX * after.width;
    area.scrollLeft += targetX - frame.left - centerX;
    if (centerY) viewport.scrollTop += after.top + y * scale - frame.top - targetY;
  }
  paintEvidenceSelection();
}

function phaseLabel(page) {
  const index = graph.phases.findIndex(phase => phase.phase_id === page.phase);
  return index >= 0 ? 'Phase ' + (index + 1) : 'Event background';
}
/*__FIELD_INSPECTOR__*/

// A workbench already running during an upgrade can supply pre-slot page geometry.
// Reserve the label band once, before measuring the diagram or drawing any edges.
function prepareLegacyRelationLayout(page) {
  if (page.relation_slots) return;
  page.jumps = (page.jumps || []).flatMap(link => {
    const r = objects.get(link.relation_id)?.record;
    if (!r || !page.phase) return [];
    const local = link.id === r.to_action_id ? r.from_action_id :
      link.id === r.from_action_id ? r.to_action_id : null;
    const destination = view.pages[link.page]?.phase;
    if (!destination || destination === page.phase || objects.get(local)?.record.phase_id !== page.phase ||
        objects.get(link.id)?.record.phase_id !== destination) return [];
    return [{...link, action_id: local}];
  });
  const ids = [...page.jumps].sort((a, b) => a.page - b.page).map(link => link.relation_id);
  const columns = Math.max(1, Math.floor(page.width / 185));
  page.relation_slots = Object.fromEntries(ids.map((id, i) => {
    const row = Math.floor(i / columns), count = Math.min(columns, ids.length - row * columns);
    return [id, [(i % columns + .5) / count, (row + 1) * 32]];
  }));
  if (!ids.length) return;
  const inset = 12 + 32 * Math.ceil(ids.length / columns);
  for (const item of [...page.cards, ...page.sections]) item.box[1] += inset;
  page.height += inset;
}

const LABEL_LANE_HEIGHT = 26;
function actionLabelX(a, b) {
  const ax = a[0] + a[2] / 2, bx = b[0] + b[2] / 2;
  if (a[1] === b[1]) return (ax + bx) / 2;
  return a[1] > b[1] ? ax : bx;
}

// Measure at the narrowest diagram width. As columns spread, these local
// positions move with their Actions and the clearance between labels grows.
function prepareActionLabelLanes(page) {
  page.actionLabels = [];
  const diagramCards = page.cards.filter(c => c.kind !== 'source' && c.kind !== 'evidence');
  const boxes = new Map(diagramCards.map(c => [c.key, c.box]));
  const rows = new Map();
  for (const edge of page.edges.filter(e => e.kind === 'relation')) {
    const a = boxes.get(edge.from_key), b = boxes.get(edge.to_key);
    const row = Math.max(a[1], b[1]), x = actionLabelX(a, b);
    const width = labelWidth(relationName(edge.record), true);
    if (!rows.has(row)) rows.set(row, []);
    rows.get(row).push({edge, width, left: x - width / 2});
  }
  // An inset above one row shifts every lower row together with its labels.
  for (const [y, labels] of [...rows].sort((a, b) => b[0] - a[0])) {
    const ends = [];
    for (const entry of labels.sort((a, b) => a.left - b.left)) {
      let lane = ends.findIndex(right => right + 6 <= entry.left);
      if (lane < 0) lane = ends.length;
      ends[lane] = entry.left + entry.width;
      page.actionLabels.push({edge: entry.edge, width: entry.width, lane});
    }
    const above = Math.max(0,
      ...diagramCards.filter(c => c.box[1] < y).map(c => c.box[1] + c.box[3]),
      ...page.sections.filter(s => s.box[1] < y).map(s => s.box[1] + 38));
    const inset = above + ends.length * LABEL_LANE_HEIGHT + 6 - y;
    if (inset <= 0) continue;
    for (const c of page.cards) if (c.box[1] >= y) c.box[1] += inset;
    for (const s of page.sections) {
      if (s.box[1] >= y) s.box[1] += inset;
      else if (s.box[1] + s.box[3] > y) s.box[3] += inset;
    }
    page.height += inset;
  }
}

$('fit').onclick = () => changeZoom(1);
$('minus').onclick = () => changeZoom((Math.ceil(zoomRatio * 10 - .000001) - 1) / 10);
$('plus').onclick = () => changeZoom((Math.floor(zoomRatio * 10 + .000001) + 1) / 10);
$('zoom').onclick = () => changeZoom(1 / fitScale());
const wideOutline = matchMedia('(min-width: 800px) and (min-height: 600px)');
$('outline').open = wideOutline.matches;
wideOutline.addEventListener('change', e => { $('outline').open = e.matches || view.pages[current].jumps.length > 0; });
new ResizeObserver(sizeDiagram).observe($('viewport'));
$('diagram-scroll').addEventListener('scroll', () => {
  if (selection) paintEvidenceSelection();
  drawPhaseBridges();
}, {passive: true});
$('viewport').addEventListener('scroll', drawPhaseBridges, {passive: true});
$('navigation').addEventListener('scroll', drawPhaseBridges, {passive: true});
$('outline').addEventListener('toggle', drawPhaseBridges);
$('previous').onclick = () => showPage(current - 1);
$('next').onclick = () => showPage(current + 1);
$('picker').onchange = e => showPage(Number(e.target.value));
for (const [i, page] of view.pages.entries()) {
  prepareLegacyRelationLayout(page);
  prepareActionLabelLanes(page);
  const option = el('option', phaseLabel(page) + (page.phase ? ' · ' + page.title : ''));
  option.value = i;
  $('picker').append(option);
}
showPage(Math.max(0, view.pages.findIndex(page => page.cards.some(card => card.kind === 'action'))));
</script>
