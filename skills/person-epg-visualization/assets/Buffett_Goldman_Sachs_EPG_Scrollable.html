"published_at": "2026-04-14", "retrieved_at": "2026-11-15T16:43:10.076522+00:00", "content_status": "partial"}, {"source_id": "e4efbe664e8ec2e876751a9c", "title": "Buffett trades warrants for smaller stake in Goldman", "url": "https://www.reuters.com/article/business/buffett-trades-warrants-for-smaller-stake-in-goldman-idUSBRE92P0K9/", "origin": null, "published_at": "2013-03-26", "retrieved_at": "2026-11-15T16:44:17.411699+00:00", "content_status": "partial"}, {"source_id": "f5092ae3388f0f119a570dad", "title": "Berkshire amends warrant deal with Goldman Sachs | AP News", "url": "https://apnews.com/berkshire-amends-warrant-deal-with-goldman-sachs-1675e41494904f2e88106228906d84b6", "origin": null, "published_at": "2013-03-26", "retrieved_at": "2026-11-15T16:44:17.433040+00:00", "content_status": "partial"}, {"source_id": "94c02af0a2ea37a09b20f31e", "title": "Buffett to get increased share in Goldman Sachs - BBC News", "url": "https://www.bbc.com/news/business-21944267", "origin": null, "published_at": "2013-03-26", "retrieved_at": "2026-11-15T16:44:17.448545+00:00", "content_status": "partial"}, {"source_id": "c137539fa5cede8c8a6c521b", "title": null, "url": "https://www.berkshirehathaway.com/letters/2013ltr.pdf", "origin": null, "published_at": null, "retrieved_at": "2026-11-15T16:46:01.797110+00:00", "content_status": "success"}, {"source_id": "1f093d207a31878e687f148e", "title": "Goldman Sachs to Redeem Preferred Stock Issued to Berkshire Hathaway | Goldman Sachs", "url": "https://www.goldmansachs.com/pressroom/press-releases/2011/redeem-stock", "origin": null, "published_at": "2011-03-18", "retrieved_at": "2026-11-15T16:42:19.804244+00:00", "content_status": "success"}], "evidence": [{"evidence_id": "EVD-cd48ea15dbc7b9b4719d", "sample_id": "219e1b8b4e783abdf4d1c027-document", "source_id": "219e1b8b4e783abdf4d1c027", "quote": "In addition, we own positions in non-traded securities of Dow Chemical, General Electric, Goldman\nSachs, Swiss Re and Wrigley with an aggregate cost of $21.1 billion and a carrying value of $26.0 billion. We\npurchased these five positions in the last 18 months. Setting aside the significant equity potential they provide us,\nthese holdings deliver us an aggregate of $2.1 billion annually in dividends and interest.", "start": 4372, "end": 4788, "location_status": "matched", "sample_sha256": "3f6ce08763ca16b899cc64898ae9cbe01e099e75dbb938b477a04306603c5fc6"}, {"evidence_id": "EVD-e47272b102b683bf5188", "sample_id": "219e1b8b4e783abdf4d1c027-document", "source_id": "219e1b8b4e783abdf4d1c027", "quote": "February 26, 2010 Warren E. Buffett\nChairman of the Board", "start": 6624, "end": 6681, "location_status": "matched", "sample_sha256": "3f6ce08763ca16b899cc64898ae9cbe01e099e75dbb938b477a04306603c5fc6"}, {"evidence_id": "EVD-6585dfe2baf605221af9", "sample_id": "219e1b8b4e783abdf4d1c027-document", "source_id": "219e1b8b4e783abdf4d1c027", "quote": "Nothing, however, is more fun for us than getting together with our shareholder-partners at Berkshire’s\nannual meeting.", "start": 6403, "end": 6522, "location_status": "matched", "sample_sha256": "3f6ce08763ca16b899cc64898ae9cbe01e099e75dbb938b477a04306603c5fc6"}, {"evidence_id": "EVD-270d6953ee22671cdbca", "sample_id": "4732c27ce7d8220f17e59d36-document", "source_id": "4732c27ce7d8220f17e59d36", "quote": "On the plus side last year, we made purchases totaling $14.5 billion in fixed-income securities issued\nby Wrigley, Goldman Sachs and General Electric. We very much like these commitments, which carry high\ncurrent yields that, in themselves, make the investments more than satisfactory. But in each of these three\npurchases, we also acquired a substantial equity participation as a bonus.", "start": 2073, "end": 2460, "location_status": "matched", "sample_sha256": "2cf52e0d34b0df8882c0edf02f93f8384dbb2526ffbf3fe6cc6466515a61f144"}, {"evidence_id": "EVD-6e8e7b8d3530ba213ee5", "sample_id": "4732c27ce7d8220f17e59d36-document", "source_id": "4732c27ce7d8220f17e59d36", "quote": "To fund these large purchases, I had to\nsell portions of some holdings that I would have preferred to keep (primarily Johnson & Johnson, Procter &\nGamble and ConocoPhillips).", "start": 2461, "end": 2635, "location_status": "matched", "sample_sha256": "2cf52e0d34b0df8882c0edf02f93f8384dbb2526ffbf3fe6cc6466515a61f144"}, {"evidence_id": "EVD-23d118fb8ed27a1c6e57", "sample_id": "4732c27ce7d8220f17e59d36-document", "source_id": "4732c27ce7d8220f17e59d36", "quote": "However, I have pledged – to you, the rating agencies and myself – to always run\nBerkshire with more than ample cash. We never want to count on the kindness of strangers in order to meet\ntomorrow’s obligations. When forced to choose, I will not trade even a night’s sleep for the chance of extra\nprofits.", "start": 2636, "end": 2940, "location_status": "matched", "sample_sha256": "2cf52e0d34b0df8882c0edf02f93f8384dbb2526ffbf3fe6cc6466515a61f144"}, {"evidence_id": "EVD-dedc8300ac079bf3768e", "sample_id": "4732c27ce7d8220f17e59d36-document", "source_id": "4732c27ce7d8220f17e59d36", "quote": "February 27, 2009 Warren E. Buffett\nChairman of the Board", "start": 4303, "end": 4360, "location_status": "matched", "sample_sha256": "2cf52e0d34b0df8882c0edf02f93f8384dbb2526ffbf3fe6cc6466515a61f144"}, {"evidence_id": "EVD-8ea4241d86911c9ee2b9", "sample_id": "356d705c591a9e9be00faa5e-document", "source_id": "356d705c591a9e9be00faa5e", "quote": "NEW YORK, March 26, 2013 -- The Goldman Sachs Group, Inc. (NYSE: GS) today announced that it has amended its warrant agreement with Berkshire Hathaway Inc., and certain of its subsidiaries (collectively, Berkshire Hathaway) from cash settlement to net share settlement.", "start": 2987, "end": 3256, "location_status": "matched", "sample_sha256": "db6065860de3e3be4d95a81176dc8213620e9ebbbea193b317e20d64fcd26aab"}, {"evidence_id": "EVD-c449b55bd94fd507cab6", "sample_id": "356d705c591a9e9be00faa5e-document", "source_id": "356d705c591a9e9be00faa5e", "quote": "“We intend to hold a significant investment in Goldman Sachs, a firm that I did my first transaction with more than 50 years ago,” said Warren Buffett, Chairman and Chief Executive Officer of Berkshire Hathaway.", "start": 3258, "end": 3469, "location_status": "matched", "sample_sha256": "db6065860de3e3be4d95a81176dc8213620e9ebbbea193b317e20d64fcd26aab"}, {"evidence_id": "EVD-ff2fb48f345acd651de3", "sample_id": "356d705c591a9e9be00faa5e-document", "source_id": "356d705c591a9e9be00faa5e", "quote": "“I have been privileged to have known and admired Goldman’s executive leadership team since my first meeting with Sidney Weinberg in 1940.”", "start": 3471, "end": 3610, "location_status": "matched", "sample_sha256": "db6065860de3e3be4d95a81176dc8213620e9ebbbea193b317e20d64fcd26aab"}, {"evidence_id": "EVD-5cae3aaba4ddd706f95b", "sample_id": "356d705c591a9e9be00faa5e-document", "source_id": "356d705c591a9e9be00faa5e", "quote": "“We are pleased that Berkshire Hathaway intends to remain a long-term investor in Goldman Sachs,” said Lloyd C. Blankfein, Chairman and Chief Executive Officer of Goldman Sachs.", "start": 3612, "end": 3789, "location_status": "matched", "sample_sha256": "db6065860de3e3be4d95a81176dc8213620e9ebbbea193b317e20d64fcd26aab"}, {"evidence_id": "EVD-859e9d713cd064b25a50", "sample_id": "356d705c591a9e9be00faa5e-document", "source_id": "356d705c591a9e9be00faa5e", "quote": "The warrant had provided Berkshire Hathaway the right to purchase 43,478,260 shares of Goldman Sachs’ common stock, par value $0.01 per share, at an exercise price of $115 at any time until October 1, 2013.", "start": 3791, "end": 3997, "location_status": "matched", "sample_sha256": "db6065860de3e3be4d95a81176dc8213620e9ebbbea193b317e20d64fcd26aab"}, {"evidence_id": "EVD-f7002073def28faeaa0c", "sample_id": "356d705c591a9e9be00faa5e-document", "source_id": "356d705c591a9e9be00faa5e", "quote": "Under the amended agreement, Goldman Sachs will deliver to Berkshire Hathaway the number of shares of common stock equal in value to the difference between the average closing price over the 10 trading days preceding October 1, 2013 and the exercise price of $115 multiplied by the number of shares of common stock covered by the warrant (43,478,260).", "start": 3998, "end": 4349, "location_status": "matched", "sample_sha256": "db6065860de3e3be4d95a81176dc8213620e9ebbbea193b317e20d64fcd26aab"}, {"evidence_id": "EVD-ec1a7f2d14babe9426d1", "sample_id": "810da557f18ea28e6ce49f0c-document", "source_id": "810da557f18ea28e6ce49f0c", "quote": "NEW YORK - October 1, 2013 - The Goldman Sachs Group, Inc. (NYSE: GS) today announced that Berkshire Hathaway Inc., and certain of its subsidiaries (collectively, Berkshire Hathaway) have exercised in full their warrant to purchase shares of Goldman Sachs’ common stock.", "start": 3014, "end": 3284, "location_status": "matched", "sample_sha256": "148b720613ed1fe6a7976175b798fee3cd8377424489f7642c90d7a63e55b1ad"}, {"evidence_id": "EVD-2aa4a6f2569d8219677a", "sample_id": "810da557f18ea28e6ce49f0c-document", "source_id": "810da557f18ea28e6ce49f0c", "quote": "Goldman Sachs will deliver 13,062,594 shares of common stock to Berkshire Hathaway on October 4, 2013.", "start": 3286, "end": 3388, "location_status": "matched", "sample_sha256": "148b720613ed1fe6a7976175b798fee3cd8377424489f7642c90d7a63e55b1ad"}, {"evidence_id": "EVD-308359c27b55ba94f14c", "sample_id": "3d30378962d36f913c8882c6-document", "source_id": "3d30378962d36f913c8882c6", "quote": "(Reuters) - Warren Buffett will become one of Goldman Sachs' ten largest shareholders essentially for free, after he and the bank amended a 2008 deal to exchange his potential profit on Goldman warrants for stock.", "start": 809, "end": 1022, "location_status": "matched", "sample_sha256": "e8123b59bfb33e8034294cdcaa64b7ebc107d3cc69b29b21dbd4ee0cb47f2e90"}, {"evidence_id": "EVD-9af64de0c67bf739eb2e", "sample_id": "3d30378962d36f913c8882c6-document", "source_id": "3d30378962d36f913c8882c6", "quote": "The exchange, which Goldman detailed on Tuesday, saves Buffett billions of dollars in upfront costs and lets Goldman minimize dilution to its stock. Under a 2008 deal, Buffett had held the right to acquire about 43.5 million shares of stock at an exercise price of $115.", "start": 1024, "end": 1294, "location_status": "matched", "sample_sha256": "e8123b59bfb33e8034294cdcaa64b7ebc107d3cc69b29b21dbd4ee0cb47f2e90"}, {"evidence_id": "EVD-5cdd597a6e57b2367bda", "sample_id": "3d30378962d36f913c8882c6-document", "source_id": "3d30378962d36f913c8882c6", "quote": "Goldman said it will now give Berkshire shares reflecting the difference between the warrants' origin", "start": 1296, "end": 1397, "location_status": "matched", "sample_sha256": "e8123b59bfb33e8034294cdcaa64b7ebc107d3cc69b29b21dbd4ee0cb47f2e90"}, {"evidence_id": "EVD-8455aaeb3fa36dd111df", "sample_id": "479d9dde099e87f5e59034c5-document", "source_id": "479d9dde099e87f5e59034c5", "quote": "New York, NY - September 23, 2008 -- The Goldman Sachs Group, Inc. (NYSE: GS) announced today that it has reached an agreement to sell $5 billion of perpetual preferred stock to Berkshire Hathaway, Inc. in a private offering. The preferred stock has a dividend of 10 percent and is callable at any time at a 10 percent premium. In conjunction with this offering, Berkshire Hathaway will also receive warrants to purchase $5 billion of common stock with a strike price of $115 per share, which are exercisable at any time for a five year term.", "start": 2946, "end": 3488, "location_status": "matched", "sample_sha256": "66b015cc31d3b6ff11b91882df132d521eca3916e011d6a258d1fdc19b1c6cb0"}, {"evidence_id": "EVD-6d72188ad29546079b30", "sample_id": "479d9dde099e87f5e59034c5-document", "source_id": "479d9dde099e87f5e59034c5", "quote": "In addition, Goldman Sachs is raising at least $2.5 billion in common equity in a public offering.", "start": 3490, "end": 3588, "location_status": "matched", "sample_sha256": "66b015cc31d3b6ff11b91882df132d521eca3916e011d6a258d1fdc19b1c6cb0"}, {"evidence_id": "EVD-704a994055def1143489", "sample_id": "479d9dde099e87f5e59034c5-document", "source_id": "479d9dde099e87f5e59034c5", "quote": "“We are pleased that given our longstanding relationship, Warren Buffett, arguably the world’s most admired and successful investor, has decided to make such a significant investment in Goldman Sachs. We view it as a strong validation of our client franchise and future prospects,” said Lloyd C. Blankfein, Chairman and CEO of The Goldman Sachs Group, Inc. “This investment will further bolster our strong capitalization and liquidity position.”", "start": 3590, "end": 4035, "location_status": "matched", "sample_sha256": "66b015cc31d3b6ff11b91882df132d521eca3916e011d6a258d1fdc19b1c6cb0"}, {"evidence_id": "EVD-8f427c5df8a30e41ed0c", "sample_id": "479d9dde099e87f5e59034c5-document", "source_id": "479d9dde099e87f5e59034c5", "quote": "“Goldman Sachs is an exceptional institution,” said Warren Buffett, Chairman and CEO of Berkshire Hathaway, Inc. “It has an unrivaled global franchise, a proven and deep management team and the intellectual and financial capital to continue its track record of outperformance.”", "start": 4037, "end": 4314, "location_status": "matched", "sample_sha256": "66b015cc31d3b6ff11b91882df132d521eca3916e011d6a258d1fdc19b1c6cb0"}, {"evidence_id": "EVD-774d7e3887930f74898a", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "Published Mon, Apr 18 2011 1:34 PM EDT Updated Mon, Apr 18 2011 1:37 PM EDT", "start": 460, "end": 535, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-28c774a45a0938b058ab", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "Billionaire investor Warren Buffett received a $5.5 billion check from Goldman Sachs, repaying an investment Buffett made in Goldman at the height of the financial crisis, CNBC learned Monday.", "start": 566, "end": 758, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-10784b4823828dfe2bf4", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "In September of 2008, the CEO of Berkshire Hathaway and longtime Goldman Sachs client bought $5 billion in preferred stock in Goldman and received warrants to buy $5 billion of its common stock.", "start": 813, "end": 1007, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-6d160a23adaa12dd36f0", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "At the time, Buffett's investment was a sign of confidence in the bank and helped to boost its stock price. It was also a smart investment by the \"Oracle of Omaha,\" as the preferred shares paid a hefty 10 percent dividend.", "start": 1009, "end": 1231, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-0e0327b8c6d6eecf6203", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "Buffett told CNBC the check consists of $5 billion to buy back the 50,000 preferred shares he aquired, plus a $500 million dividend. Buffet continues to hold warrants to buy 43,478,260 shares of the New York-based bank.", "start": 1232, "end": 1451, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-610bcb956fc72aea47d7", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "The warrants, which can be exercised over the next two and a half yars, have a strike price of $115. With Goldman trading at about $152.97, Buffett stands to make a hefty profit from the warrants as well.", "start": 1453, "end": 1657, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-11ea427a1090c8d895fa", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "Goldman announced it would buy back the preferred shares in March, after passing its latest stress test. It said it would take a charge of $2.80 a share in the first quarter to cover the costs of the buyback.", "start": 1694, "end": 1902, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-8f87255b7ec0bc48d28c", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "In comments to CNBC Monday, the firm said that \"Berkshire Hathaway's September 2008 investment in Goldman Sachs was a major vote of confidence in our firm, and we are very appreciative of it.\"", "start": 1904, "end": 2096, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-01ec50e25d12879fd251", "sample_id": "07845faddf660053bd5ce9f1-document", "source_id": "07845faddf660053bd5ce9f1", "quote": "Berkshire Hathaway CEO Warren Buffett Getty Images", "start": 761, "end": 811, "location_status": "matched", "sample_sha256": "e8bd7b125ae841beaa76ec6fda832fb5b2c43d4929caee559d34f1ad7fd8f4fa"}, {"evidence_id": "EVD-cb9b772a0328742f7269", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Associated Press // March 18, 2011 //", "start": 421, "end": 458, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-5ad545bc90ebbe9952fa", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "The Goldman Sachs Group Inc. said Friday it has received regulators’ permission to spend $5.65 billion to repurchase Berkshire Hathaway’s preferred shares in the banking giant.", "start": 484, "end": 660, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-032baef589c08f8e252d", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Goldman said the Federal Reserve has approved its plan to repay Warren Buffett’s company for the $5 billion investment it made at the height of the financial crisis in the fall of 2008.", "start": 663, "end": 848, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-53ffd1ad5936b9636acb", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Goldman was eager to repay Berkshire because it had been paying 10-percent interest on the preferred shares, which translated into an annual expense of $500 million.", "start": 851, "end": 1016, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-7b41a912e014357c0dc8", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "The repurchase will weigh down Goldman’s first-quarter earnings by $2.80 per share because it includes a one-time preferred dividend of about $1.65 billion.", "start": 1194, "end": 1350, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-abe7b3dccc8264e1c55a", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Buffett did not immediately respond to a message Friday seeking comment, but he predicted in his annual letter to shareholders last month that Goldman would soon redeem the shares.", "start": 2620, "end": 2800, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-5322467adb39e465ec25", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Buffett has said that the $500 million dividend Goldman had been paying Berkshire broke down to nearly $16 a second, making every tick of the clock sound like music to his ears. But he said Goldman didn’t seem to like hearing its money tick away.", "start": 2802, "end": 3048, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-c78eb678da15b5c42f61", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Buffett told shareholders that Goldman’s decision to redeem shares – along with similar moves by Swiss Re and General Electric – will diminish Berkshire’s earning power because it will no long receive the special high dividends.", "start": 3051, "end": 3279, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-f86c4bd9b0558f5ac4cc", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "Berkshire’s 50,000 preferred shares of common stock will be repurchased for $110,000 apiece on April 18 because Goldman was required to give 30 days’ notice.", "start": 3282, "end": 3439, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-88a00342540391d724de", "sample_id": "d390ffe67fb43e6415f72026-document", "source_id": "d390ffe67fb43e6415f72026", "quote": "But Berkshire will continue to hold warrants to buy 43.5 million common Goldman shares at a price of $115 per share anytime before the fall of 2013.", "start": 3442, "end": 3590, "location_status": "matched", "sample_sha256": "0d6e2d50f366b2c2d9910f02e20b99a6f4b918d7d90f208589ce0eb7b46fd043"}, {"evidence_id": "EVD-9d4b00f457e33de07da5", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Published Tue, Sep 23 2008 6:19 PM EDT Updated Thu, Aug 5 2010 11:27 AM EDT", "start": 558, "end": 633, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-27bda8a858929715c101", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "In a surprise return to Wall Street, Warren Buffett's Berkshire Hathaway has a deal to invest at least $5 billion in Goldman Sachs.", "start": 661, "end": 792, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-3cc2a7dd9dac1c75ad4b", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Up until now, he has rejected all pleas to come to Wall Street's aid during the current crisis.", "start": 794, "end": 889, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-f3c98ebf489db76fc77b", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Berkshire will buy $5 billion in preferred Goldman stock with a dividend of 10 percent. It will also get warrants to buy another $5 billion in common stock over five years.", "start": 1035, "end": 1207, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-bc740cb27eb588277803", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Goldman revealed the vote of confidence from the man generally considered the world's greatest investor late this afternoon in a news release.", "start": 891, "end": 1033, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-cea96119c02ab359466b", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Buffett has avoided Wall Street since he came to Salomon Brothers' aid as a hands-on manager when it was hit by a trading scandal in 1991. He had bought a $700 million stake in the company four years before.", "start": 1209, "end": 1416, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-19859e69b85549888028", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "He eventually turned a profit on the investment, but it was a long and difficult experience for him, making tonight's news especially unexpected.", "start": 1419, "end": 1564, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-0f19aaa846092adb8160", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "In a brief off-camera telephone conversation tonight, Buffett told CNBC's Becky Quick he loves the terms of the deal and he loves Goldman.", "start": 1566, "end": 1704, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-15b706f98a43c6ed829e", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Buffett is quoted in the release with some very positive comments about Goldman, which recently converted from an investment bank to a bank holding company.", "start": 2591, "end": 2747, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-39f33151c91337048c88", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "\"Goldman Sachs is an exceptional institution. It has an unrivaled global franchise, a proven and deep management team and the intellectual and financial capital to continue its track record of outperformance.”", "start": 2749, "end": 2958, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-76c1c8a45517d5f3d4d5", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Goldman CEO Lloyd Blankfein returns the favor in his quote. \"We are pleased that given our longstanding relationship, Warren Buffett, arguably the world’s most admired and successful investor, has decided to make such a significant investment in Goldman Sachs. We view it as a strong validation of our client franchise and future prospects. This investment will further bolster our strong capitalization and liquidity position.\"", "start": 2960, "end": 3388, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-89011e42422321fcd869", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Berkshire will also receive warrants to purchase $5 billion of common stock with a strike price of $115 a share. The warrants can be used at any time over a five year period.", "start": 3390, "end": 3564, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-1b13d9fcc4c1fafc4022", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "In addition, Goldman will raise at least $2.5 billion in common equity through a public offering.", "start": 3566, "end": 3663, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-99df11c948e6a4de0bbd", "sample_id": "f6fa09f6e6ee500b9fa3fafc-document", "source_id": "f6fa09f6e6ee500b9fa3fafc", "quote": "Goldman shares are higher in after-hours trading tonight (Tuesday.) Morgan Stanley is also gaining.", "start": 3665, "end": 3764, "location_status": "matched", "sample_sha256": "c542d271bf9c8dc4edb41ceb5c14248d7cfed77ce588a1b5166aca7b7431651a"}, {"evidence_id": "EVD-e4d1c482a3e6c1b69da6", "sample_id": "5671b678be19b15554f5e3ba-document", "source_id": "5671b678be19b15554f5e3ba", "quote": "At the height of the global financial crisis, Warren Buffett’s Berkshire Hathaway invests US$5 billion in Goldman Sachs, further strengthening the firm’s capitalization and liquidity in turbulent times.", "start": 877, "end": 1079, "location_status": "matched", "sample_sha256": "8e5579b949b85b1f3c2f960ad2a79f856f39d2ee19b710a1f6bf1d5416feb9ff"}, {"evidence_id": "EVD-f4719e00243276db05fd", "sample_id": "5671b678be19b15554f5e3ba-document", "source_id": "5671b678be19b15554f5e3ba", "quote": "As the 2008 global financial crisis continued to challenge markets, leading Wall Street firms worked to ensure they were adequately capitalized and had sufficient liquidity. While many US firms looked overseas for capital infusions, Goldman Sachs found willing investors closer to home.", "start": 1081, "end": 1367, "location_status": "matched", "sample_sha256": "8e5579b949b85b1f3c2f960ad2a79f856f39d2ee19b710a1f6bf1d5416feb9ff"}, {"evidence_id": "EVD-ae9b0e9cab2df456f0b7", "sample_id": "5671b678be19b15554f5e3ba-document", "source_id": "5671b678be19b15554f5e3ba", "quote": "Warren Buffett first met senior partner Sidney Weinberg in 1940 and had worked with Goldman Sachs for more than 50 years. This long-term relationship formed the basis for approaching the legendary investor about making a potential investment in Goldman Sachs to help the firm meet capital needs during the financial crisis.", "start": 1571, "end": 1894, "location_status": "matched", "sample_sha256": "8e5579b949b85b1f3c2f960ad2a79f856f39d2ee19b710a1f6bf1d5416feb9ff"}, {"evidence_id": "EVD-44aa9ba27e0358344e67", "sample_id": "5671b678be19b15554f5e3ba-document", "source_id": "5671b678be19b15554f5e3ba", "quote": "On September 23, 2008 – two days after Goldman Sachs became a bank holding company – the firm announced a private offering to Berkshire Hathaway whereby Berkshire Hathaway would purchase US$5 billion in special preferred shares that would pay a 10 percent annual dividend. The firm had the option of buying back the shares for US$5 billion plus a one-time dividend of US$500 million. Buffett stipulated that Goldman Sachs’ top executives pledge not to sell their own shares before Buffett sold his. Berkshire Hathaway would also acquire warrants to buy an additional US$5 billion of common stock at US$115 per share.", "start": 1965, "end": 2581, "location_status": "matched", "sample_sha256": "8e5579b949b85b1f3c2f960ad2a79f856f39d2ee19b710a1f6bf1d5416feb9ff"}, {"evidence_id": "EVD-459c830f9256520a9e9b", "sample_id": "5671b678be19b15554f5e3ba-document", "source_id": "5671b678be19b15554f5e3ba", "quote": "The day after the announcement, Goldman Sachs completed a public offering of 46.7 million shares of common stock at US$123 per share for proceeds of US$5.75 billion in an offering that was well-received and oversubscribed.", "start": 2583, "end": 2805, "location_status": "matched", "sample_sha256": "8e5579b949b85b1f3c2f960ad2a79f856f39d2ee19b710a1f6bf1d5416feb9ff"}, {"evidence_id": "EVD-c9d24532a8d008012983", "sample_id": "5671b678be19b15554f5e3ba-document", "source_id": "5671b678be19b15554f5e3ba", "quote": "In March 2011, Goldman Sachs announced it would exercise its option to buy back the Berkshire Hathaway shares two years early. The firm had secured the approval of the Federal Reserve to make the payments after a review of its balance sheet.", "start": 4174, "end": 4415, "location_status": "matched", "sample_sha256": "8e5579b949b85b1f3c2f960ad2a79f856f39d2ee19b710a1f6bf1d5416feb9ff"}, {"evidence_id": "EVD-ec6c58f552e309009d13", "sample_id": "cf699b579fc8177d8e58b3c8-document", "source_id": "cf699b579fc8177d8e58b3c8", "quote": "The Goldman Sachs Group, Inc. (the “Company”) has agreed to issue and sell, and Berkshire Hathaway Inc. and certain affiliates (the “Investor”) have agreed to purchase, (1) 50,000 shares of the Company’s 10% Cumulative Perpetual Preferred Stock, Series G, having a liquidation value of $100,000 per share (“Preferred Stock”), and (2) a Warrant (the “Warrant”) to purchase 43,478,260 shares of the Company’s voting common stock, par value $0.01 per share (“Common Stock”), for an aggregate purchase price of $5.0 billion in cash.", "start": 724, "end": 1252, "location_status": "matched", "sample_sha256": "a38d9b42c65d46c4419232b37fd73c0a8ca3e142222d2d23dabc161a8a828e31"}, {"evidence_id": "EVD-625f253f4505c77dcea9", "sample_id": "cf699b579fc8177d8e58b3c8-document", "source_id": "cf699b579fc8177d8e58b3c8", "quote": "Dividends on the Preferred Stock will accrue on the liquidation value at a rate per annum of 10% but will be paid only when, as and if declared by the Company’s Board of Directors out of legally available funds. At any time when such dividends have not been paid in full, the unpaid amounts will accrue dividends at the same 10% rate and the Company will not be permitted to pay dividends or other distributions on, or to repurchase, any of the outstanding Common Stock or any of the Company’s outstanding preferred stock of any series. Subject to the approval of the Board of Governors of the Federal Reserve System, the Preferred Stock may be redeemed by the Company at any time, in whole or in part, at a redemption price of 110% of the liquidation value to be redeemed plus any accrued, unpaid dividends. The Preferred Stock has no maturity date and will rank senior to the outstanding Common Stock (and pari passu with the Company’s other outstanding series of preferred stock) with respect to the payment of dividends and distributions in liquidation.", "start": 1255, "end": 2312, "location_status": "matched", "sample_sha256": "a38d9b42c65d46c4419232b37fd73c0a8ca3e142222d2d23dabc161a8a828e31"}, {"evidence_id": "EVD-764d15c846f0132e307c", "sample_id": "cf699b579fc8177d8e58b3c8-document", "source_id": "cf699b579fc8177d8e58b3c8", "quote": "As long as at least 10,000 shares of the Preferred Stock remain outstanding, the Preferred Stock, voting as a separate class, will have the right to approve any future issuance of preferred stock ranking senior to the Preferred Stock, and any amendment of the certificate of incorporation or future merger, reclassification or similar event in which the rights and other terms of the Preferred Stock (or successor securities) are substantially modified. Subject to certain limited exceptions, the Preferred Stock and the Warrant are not transferrable for five years, and the shares of Common Stock issuable on exercise of the Warrant may be transferred at any time but only in public offerings and other public market sales, or in private transactions, that do not involve the transfer to any single purchaser or group of more than 3.5% of the outstanding Common Stock. So long as the Investor owns at least 10,000 shares of Preferred Stock, in the event of a spin-off of a business by the Company, a portion of the Preferred Stock owned by the Investor will be exchanged for preferred stock in the spun-off business, based on the relative value of the Company and the spun-off business.", "start": 2315, "end": 3502, "location_status": "matched", "sample_sha256": "a38d9b42c65d46c4419232b37fd73c0a8ca3e142222d2d23dabc161a8a828e31"}, {"evidence_id": "EVD-e7244d25f5d46e1ae94c", "sample_id": "cf699b579fc8177d8e58b3c8-document", "source_id": "cf699b579fc8177d8e58b3c8", "quote": "The Warrant is exercisable at the holder’s option at any time and from time to time, in whole or in part, for five years at an exercise price of $115 per share of the Common Stock. The exercise price and the number of shares issuable on exercise of the Warrant are subject to antidilution adjustments for stock splits, reclassifications, noncash distributions, extraordinary cash dividends, pro rata repurchases of Common Stock, business combination transactions, and certain issuances of Common Stock (or securities convertible into or exercisable for Common Stock) at a price (or having a conversion or exercise price) that is less than 95% of the market price of the Common Stock at the pricing of the securities issuance. The Investor has agreed that it will not increase its beneficial ownership of the outstanding Common Stock above 14.9%. (At the date of issuance, the Warrant will be exercisable for approximately 9.0% of the post-exercise outstanding Common Stock.)", "start": 3505, "end": 4479, "location_status": "matched", "sample_sha256": "a38d9b42c65d46c4419232b37fd73c0a8ca3e142222d2d23dabc161a8a828e31"}, {"evidence_id": "EVD-66567eedd3ea2efb85f3", "sample_id": "cf699b579fc8177d8e58b3c8-document", "source_id": "cf699b579fc8177d8e58b3c8", "quote": "Date of Report (Date of earliest event reported): September 23, 2008", "start": 407, "end": 475, "location_status": "matched", "sample_sha256": "a38d9b42c65d46c4419232b37fd73c0a8ca3e142222d2d23dabc161a8a828e31"}, {"evidence_id": "EVD-4b21684e8b955b48fb8d", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "Wed, Sep 24, 2008| Porter Stansberry", "start": 406, "end": 442, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-5f2dc824e7ff9586d298", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "Last night, Warren Buffett announced Berkshire Hathaway (his holding company) would take a $5 billion position in Goldman Sachs.", "start": 659, "end": 787, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-61e46c7d4f7663774270", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "Berkshire Hathaway is buying $5 billion of perpetual preferred stock with a 10% coupon. These shares are senior to both Goldman's other preferred stock and its common stock. That means no other shareholders will receive any dividends until Buffett has been paid his 10%, in full, each year.", "start": 958, "end": 1248, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-1093e30ce8ae93f7497d", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "And that's not all... To sweeten the deal for Buffett, Goldman agreed to include a warrant (a long-term call option) that entitles Berkshire Hathaway to buy an additional $5 billion in regular common stock, at $115 per share. (Goldman's trading for about $130 now.) Thus, if Goldman can turn things around, Berkshire will receive an enormous payday down the road. It will be entitled to buy stock at $115, no matter what the price has risen to five years from now.", "start": 1250, "end": 1714, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-df9db305290838721d79", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "Using these options as a rough guide, our options trading expert, Jeff Clark, estimates the options Buffett received from Goldman are worth about $78 each. On a $5 billion position, that's a total value of $3.2 billion.", "start": 2026, "end": 2245, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-194e933e38c1303e03de", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "In other words, Buffett received a security worth about $3.2 billion in exchange for his $5 billion investment in a high-yielding preferred stock. His net exposure is only $1.8 billion. On this capital at risk, he's getting paid $500 million per year. That's a 27.7% annual return. And he may eventually end up owning 10% of the company.", "start": 2247, "end": 2584, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-8a4eac245f70e28de253", "sample_id": "0be4c20228ecfd8bf35d9e73-document", "source_id": "0be4c20228ecfd8bf35d9e73", "quote": "Buffett said he wouldn't have purchased Goldman unless he was sure Congress would do the \"right thing\" by approving the $700 billion bailout.", "start": 2679, "end": 2820, "location_status": "matched", "sample_sha256": "24bd5bcef84d1e0ef413813c6f7e8788da02df35bc8bcd65b56403e1fd9725b6"}, {"evidence_id": "EVD-513ef27e72eb9e650b05", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "Lloyd Blankfein—who was born poor in the South Bronx, put himself through Harvard, and became the C.E.O. of Goldman Sachs in 2006, after 24 years at the firm—is a history buff, a lawyer, a wordsmith, and something of an armchair philosopher.", "start": 390, "end": 631, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-bc9bc2684ccce1530c08", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "On a Thursday in October—the very day when the firm announced it had made $8.4 billion in profits so far this year—he speculates whether Goldman would have survived the financial conflagration in the fall of 2008 entirely on its own, without any kind of help, implicit or explicit, from the government. “I thought we would, but it was a hell of a higher risk than I was happy with,” he says, sitting in his 30th-floor office in Goldman’s old headquarters, at 85 Broad Street, in Lower Manhattan. “As a result of actions taken [by the government], we were better off than we otherwise would have been. Was it dispositive? I don’t know. I don’t think so … but I don’t know.”", "start": 632, "end": 1304, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-fa92909325acbddfcf27", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "He adds, “If you ask, in my heart of hearts, do I think we would have failed . . . ” He pauses, then pulls out his trump card: at the height of the crisis, Warren Buffett agreed to invest $5 billion in Goldman Sachs.", "start": 1306, "end": 1522, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-e95a0ea3af367babd0b2", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "Buffett, the venerated Nebraska investor, is famously reluctant to put money into Wall Street firms. But he has a long history with Goldman. As a 10-year-old he went to New York with his father, a broker in Omaha, and they stopped by Goldman Sachs to visit Sidney Weinberg.", "start": 1524, "end": 1797, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-d77059441fc94f1b7928", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "As Goldman’s leader from 1930 to 1969, Weinberg helped build the firm into the powerhouse it became. “For 45 minutes, Weinberg talked to me as if I were a grown-up,” Buffett likes to recall. “And on the way out he asked me, ‘What stock do you like, Warren?’” In later years Buffett liked to cite Byron Trott, who until recently worked in Goldman’s Chicago office, as one of the few investment bankers worth his salt.", "start": 1798, "end": 2214, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-eb3e49f17783ca9fb6d3", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "And so, when Trott asked Buffett if he would be interested in investing in Goldman during the frenetic days after Lehman Brothers’ bankruptcy, Buffett thought about it, and on Tuesday, September 23, he and Trott hammered out a deal.", "start": 2216, "end": 2448, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-c04264b0c2b692f09c8f", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "In a very brief—and very Buffett—call that afternoon with Blankfein, Trott, and then co-president Jon Winkelried, Buffett said he would invest $5 billion in exchange for a hefty 10 percent dividend and rights to buy additional stock over the next five years at a price of $115 a share.", "start": 2449, "end": 2734, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-ba58c3d953e922e939bd", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "“I’m taking my grandkids out to Dairy Queen,” he told the Goldman men. “Call me and let me know what you want to do.”", "start": 2735, "end": 2852, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-10b2fc44f7438a3a01cb", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "Goldman accepted Buffett’s tough terms, and thanks to the investment was able to raise another $5.75 billion, by selling stock to other investors. Blankfein says the firm could have raised multiples of that but didn’t need more money.", "start": 2854, "end": 3088, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-532f007bbb1ab14a5ce3", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "And Buffett has said that while no one could ever understand the balance sheet of any Wall Street firm, he has confidence that Blankfein is both very smart and very conservative.", "start": 3089, "end": 3267, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-609e03a4c1f8dfce0feb", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "But there was another reason he invested: “If I didn’t think the government was going to act, I would not be doing anything this week,” he explained to CNBC’s Becky Quick. “I might be trying to undo things this week.”", "start": 3268, "end": 3485, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-45f5722be6b2ff1fe472", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "Blankfein refers to this period as “the fog of war,” and yet at 85 Broad Street a clear story line has emerged from almost every level of the firm: it was Goldman’s much-celebrated culture and its superior ability to manage risk, not the helping hand of the government, that got it through the events of fall 2008.", "start": 3487, "end": 3801, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-b55f0cba8af34c39ecaf", "sample_id": "f1d80741e4c3a99a79e10bd8-document", "source_id": "f1d80741e4c3a99a79e10bd8", "quote": "When I ask Gary Cohn, Goldman’s chief operating officer, and David Viniar, the firm’s chief financial officer, if, barring a financial Armageddon, Goldman would have survived without all the various forms of government intervention, Viniar says, “ Yes!” almost before I can finish the question. “I think we would not have failed,” says Cohn. “We had cash.”", "start": 3802, "end": 4158, "location_status": "matched", "sample_sha256": "3d88211b1c76d5eddca126280dc1d28a3d7d1fdfb44ee112daa69ac69cd5e288"}, {"evidence_id": "EVD-20cd0f190257dc8b0745", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "September 2008 — the week after Lehman Brothers collapsed. Goldman's CFO called a man in Omaha. The call lasted under five minutes. Those five minutes changed a chapter of American financial history.", "start": 612, "end": 811, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-bf828549e6ab773675ac", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "Tuesday afternoon, September 23, 2008.\n\nGoldman Sachs CFO David Viniar called Omaha. The man who picked up the phone was Warren Buffett. He was 78 years old.", "start": 958, "end": 1115, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-69b35ccdfd4f24b711ec", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "Buffett's terms were simple. And ruthless.\n\nFirst, $5 billion in preferred stock. Berkshire Hathaway would purchase $5 billion in Goldman Sachs perpetual preferred shares.\n\nSecond, 10% annual dividend. The preferred shares would pay 10% per year — meaning Goldman would pay Berkshire a fixed $500 million every year.\n\nThird, $5 billion in warrants. Berkshire would additionally receive warrants to purchase Goldman Sachs common shares at $115 per share, worth $5 billion. Valid for five years.\n\nFourth, 10% redemption premium. If Goldman wanted to redeem the preferred shares, it would have to pay 110% of face value.\n\nBuffett didn't write these terms on paper. He stated them over the phone. Viniar wrote them down.\n\nIt took under five minutes.", "start": 1157, "end": 1902, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-d0b0fbf8024e0119ba31", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "Inside Goldman, the immediate reaction was divided. \"This is usury,\" some executives said. A 10% annual dividend was more than double the typical corporate preferred rate at the time. The warrants were structured to hand Buffett billions more if Goldman's stock recovered.\n\nCEO Lloyd Blankfein made the call: \"We accept.\"", "start": 1904, "end": 2225, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-c12181d8a3cdef2fb8dd", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "Third, this fear is temporary. Buffett's lifelong principle: \"Be greedy when others are fearful.\" He had repeated this for decades. September 2008 was exactly that moment.", "start": 2267, "end": 2438, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-14a2788bc439287b8c23", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "In March 2011, Goldman redeemed Berkshire's preferred shares — paying 110% of face value as agreed. Berkshire received a $500 million premium.", "start": 3322, "end": 3464, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-4889f273e2db34a6164f", "sample_id": "10b5ad036c925b78c15e1bc5-document", "source_id": "10b5ad036c925b78c15e1bc5", "quote": "In 2013, Berkshire exercised the warrants — converting them to approximately 13 million Goldman shares via cash settlement. Value at the time: roughly $2.1 billion.\n\nTotal return: Dividends: $1.25 billion Premium: $500 million Warrant shares: $2.1 billion Total: approximately $3.85 billion.", "start": 3525, "end": 3816, "location_status": "matched", "sample_sha256": "c675ddc2f755a418812eec9c878fc886c731cf62d56d27be99a42ff0dd24b4eb"}, {"evidence_id": "EVD-fd393e8c9a8db7a1bdc4", "sample_id": "e4efbe664e8ec2e876751a9c-document", "source_id": "e4efbe664e8ec2e876751a9c", "quote": "Warren Buffett has given up his chance to become Goldman Sachs Group Inc's largest shareholder by converting his warrants into a smaller stake in the bank at no additional cost to his Berkshire Hathaway Inc .", "start": 791, "end": 999, "location_status": "matched", "sample_sha256": "ad65b4910291569ab5524c0e1280ccdd4c9d0975effd98e0886df3be1e34e8f7"}, {"evidence_id": "EVD-b57fc4a2b4c2e6f9c142", "sample_id": "e4efbe664e8ec2e876751a9c-document", "source_id": "e4efbe664e8ec2e876751a9c", "quote": "Buffett received the warrants as part of a 2008 deal during the depths of the financial crisis, when his investment in Goldman was seen as a vote of confidence in the firm.", "start": 1001, "end": 1173, "location_status": "matched", "sample_sha256": "ad65b4910291569ab5524c0e1280ccdd4c9d0975effd98e0886df3be1e34e8f7"}, {"evidence_id": "EVD-8c6e476b73570e56d9ed", "sample_id": "e4efbe664e8ec2e876751a9c-document", "source_id": "e4efbe664e8ec2e876751a9c", "quote": "Under that deal, Berkshire had the right to buy about 43.5 million Goldman shares - or a roughly 9 percent stake - at an exercise price of $115 per share, for $5 billion in total.", "start": 1174, "end": 1353, "location_status": "matched", "sample_sha256": "ad65b4910291569ab5524c0e1280ccdd4c9d0975effd98e0886df3be1e34e8f7"}, {"evidence_id": "EVD-d7994adfad9dcbce5be7", "sample_id": "f5092ae3388f0f119a570dad-document", "source_id": "f5092ae3388f0f119a570dad", "quote": "Updated 3:05 PM GMT-7, March 26, 2013", "start": 512, "end": 549, "location_status": "matched", "sample_sha256": "0c5773234c300dd1ea1da1fbc2309de39bba8abf2457ceb56766d0a98f04df92"}, {"evidence_id": "EVD-fb24404d4573fbab939f", "sample_id": "f5092ae3388f0f119a570dad-document", "source_id": "f5092ae3388f0f119a570dad", "quote": "OMAHA, Neb. (AP) — Warren Buffett’s company will likely become one of the biggest shareholders in Goldman Sachs Group Inc. later this year, and Berkshire Hathaway Inc. won’t even have to part with any cash to do so.", "start": 551, "end": 766, "location_status": "matched", "sample_sha256": "0c5773234c300dd1ea1da1fbc2309de39bba8abf2457ceb56766d0a98f04df92"}, {"evidence_id": "EVD-504b938acb80509557b9", "sample_id": "f5092ae3388f0f119a570dad-document", "source_id": "f5092ae3388f0f119a570dad", "quote": "Berkshire and Goldman said Tuesday they had renegotiated an agreement that gave Berkshire the right to buy 43.5 million shares of the investment bank for $115 per share. Now the 2008 deal will be settled with stock", "start": 768, "end": 982, "location_status": "matched", "sample_sha256": "0c5773234c300dd1ea1da1fbc2309de39bba8abf2457ceb56766d0a98f04df92"}, {"evidence_id": "EVD-1bb68eec92f960310fdc", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "Publication date (source/provider metadata): 2013-03-26", "start": 224, "end": 279, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-bc14e04030d2db7b4aa5", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "Warren Buffett is to become a top 10 shareholder of Goldman Sachs after he agreed to amend the terms of his 2008 investment in the bank.\n\nIn September 2008, Mr Buffett's Berkshire Hathaway fund invested $5bn (£3.3bn) in Goldman at 10% interest.", "start": 534, "end": 778, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-4e361b157464b50a062b", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "In addition to the interest, Berkshire was given the opportunity to buy billions of additional shares in the future.\n\nGoldman is now giving Buffett shares for free to limit diluting its stock.\n\nIn return, the deal means Berkshire does not have to spend billions of dollars up front.", "start": 780, "end": 1062, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-e3c485aaf776f2024a46", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "Under the 2008 deal, Berkshire had the right - called a warrant - to buy a further 43.5 million shares for $115 each on 1 October this year.\n\nThe $115 figure compares with Goldman's $147.43 share price in early Tuesday trading.\n\nInstead of buying the shares, Berkshire will now get additional Goldman shares equivalent in value to the difference between $115 and the average closing price of Goldman's shares for the 10 trading days before 1 October.", "start": 1064, "end": 1514, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-b52adcb50c08138d5fc2", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "According to estimates, this will make him the bank's ninth-largest shareholder.", "start": 1516, "end": 1596, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-90fed2d96c71d32e05cc", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "Goldman Sachs chief executive Lloyd Blankfein said: \"We are pleased that Berkshire Hathaway intends to remain a long-term investor in Goldman Sachs.\"", "start": 1598, "end": 1747, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-bf9324ed3f2979d51b7f", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "The 2008 investment in Goldman came at the height of the global financial crisis.\n\nIt attracted much media attention, specifically surrounding the generous 10% interest the bank agreed to pay Berkshire.", "start": 1868, "end": 2070, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-5213c7cb64922f31c576", "sample_id": "94c02af0a2ea37a09b20f31e-document", "source_id": "94c02af0a2ea37a09b20f31e", "quote": "Analysts said this reflected Goldman's need for the funds, and the lack of other potential investors either willing or able to put the money forward.", "start": 2072, "end": 2221, "location_status": "matched", "sample_sha256": "278fe3e36b66a4ca9ec30c1e7984ad431d27e1be56446cf7d5b5f1e9cdb29b38"}, {"evidence_id": "EVD-7c1c8531d327c04edf1f", "sample_id": "c137539fa5cede8c8a6c521b-document", "source_id": "c137539fa5cede8c8a6c521b", "quote": "Below we list our fifteen common stock investments that at yearend had the largest market value.", "start": 6639, "end": 6735, "location_status": "matched", "sample_sha256": "f84e7b025155aef9bfb9b398a3837356fb628a0fa840761a22663d68cf8148b9"}, {"evidence_id": "EVD-660633a5901eae9c683e", "sample_id": "c137539fa5cede8c8a6c521b-document", "source_id": "c137539fa5cede8c8a6c521b", "quote": "12/31/13\nShares**\nCompany\nPercentage of\nCompany\nOwned\nCost* Market\n(in millions)", "start": 6738, "end": 6818, "location_status": "matched", "sample_sha256": "f84e7b025155aef9bfb9b398a3837356fb628a0fa840761a22663d68cf8148b9"}, {"evidence_id": "EVD-5a7d16ec3a301555faea", "sample_id": "c137539fa5cede8c8a6c521b-document", "source_id": "c137539fa5cede8c8a6c521b", "quote": "13,062,594 The Goldman Sachs Group, Inc. .......... 2 . 8 7 5 0 2,315", "start": 7094, "end": 7163, "location_status": "matched", "sample_sha256": "f84e7b025155aef9bfb9b398a3837356fb628a0fa840761a22663d68cf8148b9"}, {"evidence_id": "EVD-5ff293564990733d5213", "sample_id": "c137539fa5cede8c8a6c521b-document", "source_id": "c137539fa5cede8c8a6c521b", "quote": "*This is our actual purchase price and also our tax basis; GAAP “cost” differs in a few cases because of\nwrite-ups or write-downs that have been required under its rules.", "start": 7965, "end": 8135, "location_status": "matched", "sample_sha256": "f84e7b025155aef9bfb9b398a3837356fb628a0fa840761a22663d68cf8148b9"}, {"evidence_id": "EVD-9f30cb0b17e78ca8dedd", "sample_id": "c137539fa5cede8c8a6c521b-document", "source_id": "c137539fa5cede8c8a6c521b", "quote": "**Excludes shares held by Berkshire subsidiary pension funds.", "start": 8138, "end": 8199, "location_status": "matched", "sample_sha256": "f84e7b025155aef9bfb9b398a3837356fb628a0fa840761a22663d68cf8148b9"}, {"evidence_id": "EVD-330404cc1bd0fdd4e6b8", "sample_id": "c137539fa5cede8c8a6c521b-document", "source_id": "c137539fa5cede8c8a6c521b", "quote": "BERKSHIRE HATHAWAY INC.\n\n\nTo the Shareholders of Berkshire Hathaway Inc.:", "start": 267, "end": 340, "location_status": "matched", "sample_sha256": "f84e7b025155aef9bfb9b398a3837356fb628a0fa840761a22663d68cf8148b9"}, {"evidence_id": "EVD-4714089faeaf18c7b0e3", "sample_id": "1f093d207a31878e687f148e-document", "source_id": "1f093d207a31878e687f148e", "quote": "New York, March 18, 2011 -- The Goldman Sachs Group, Inc. (NYSE: GS) today announced that the Federal Reserve has concluded that it has no objection to Goldman Sachs’ proposed 2011 capital actions, which include the redemption in full of the 50,000 shares of the Company’s 10% Cumulative Perpetual Preferred Stock, Series G (Preferred Shares) held by Berkshire Hathaway Inc. and certain of its subsidiaries (collectively, Berkshire Hathaway), the repurchase of outstanding common stock and a potential increase in our quarterly common stock dividend.", "start": 2969, "end": 3519, "location_status": "matched", "sample_sha256": "f9d093c4dd1a722ef55ec39253b857ccc94d84aa9aa1b31d9b76dd4785aa108c"}, {"evidence_id": "EVD-6d1435ce560f9ffaee8b", "sample_id": "1f093d207a31878e687f148e-document", "source_id": "1f093d207a31878e687f148e", "quote": "The Company has mailed notices of redemption to Berkshire Hathaway stating that the Company will redeem in full the Preferred Shares held by Berkshire Hathaway, for the stated redemption price of $110,000 per share, plus accrued and unpaid dividends. The redemption date will be April 18, 2011. Berkshire Hathaway continues to hold the warrant to purchase 43,478,260 shares of the Company’s common stock, par value $0.01 per share, which Berkshire Hathaway purchased from the Company concurrently with the Preferred Shares on October 1, 2008.", "start": 3521, "end": 4063, "location_status": "matched", "sample_sha256": "f9d093c4dd1a722ef55ec39253b857ccc94d84aa9aa1b31d9b76dd4785aa108c"}, {"evidence_id": "EVD-33af91651114452a8470", "sample_id": "1f093d207a31878e687f148e-document", "source_id": "1f093d207a31878e687f148e", "quote": "The redemption includes a one-time preferred dividend of approximately $1.64 billion which will be reflected in the Company’s first quarter results. This is expected to reduce reported diluted earnings per common share for the first quarter by approximately $2.80 per share. The redemption also results in the acceleration of $24 million of preferred dividends that are payable from April 1 to the redemption date, which will reduce reported diluted earnings per common share for the first quarter by approximately $0.04. While the Preferred Shares were outstanding, the Company incurred a dividend expense of $125 million per quarter, or $500 million annually, which reduced diluted earnings per common share by $0.85 in 2010.", "start": 4065, "end": 4792, "location_status": "matched", "sample_sha256": "f9d093c4dd1a722ef55ec39253b857ccc94d84aa9aa1b31d9b76dd4785aa108c"}], "stages": [{"stage_id": "STG-d59cc4c3ae4186fdfa44", "event_id": "PERSON-0001-E0034", "name": "Crisis assessment and investment establishment", "description": "The situation in which Buffett considered the Goldman solicitation, assessed and communicated conditions and terms, made or announced the investment commitment, and was reported to have established the preferred-stock and warrant position. Related funding sales belong to this establishment process. Public statements, attributed decisions and reported transactions remain distinct rather than being collapsed into one observed closing act.", "time": {"text": "Undated pre-commitment activity through the 2008 investment establishment", "kind": "occurrence_window", "start": null, "end": "2009-01-01", "start_precision": "unknown", "end_precision": "year"}, "boundary_reason": "The end is a coarse boundary derived from records placing the purchase and warrant deal in 2008; the following stage begins with later shareholder reporting and then redemption-related conduct. The start cannot be fixed because several preliminary assessments, rejections and explanations are undated. Negotiation, announcement and funding are retained in one establishment stage because the evidence does not justify cleaner day-level divisions for every undated action.", "support": [{"target": "/description", "mode": "I", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3", "EVD-69b35ccdfd4f24b711ec", "EVD-8455aaeb3fa36dd111df", "EVD-10784b4823828dfe2bf4"], "reason": "The solicitation narrative, oral-term account, September 23 investment announcement and reported September purchase collectively support an establishment stage encompassing assessment, commitment and reported position formation."}, {"target": "/boundary_reason", "mode": "I", "evidence_ids": ["EVD-69b35ccdfd4f24b711ec", "EVD-b57fc4a2b4c2e6f9c142", "EVD-8c6e476b73570e56d9ed"], "reason": "The term communication is dated September 23, 2008, while Reuters places the warrant deal in 2008. Those records support the establishment setting and coarse year-end boundary but not a precise beginning for all preliminary conduct."}, {"target": "/time", "mode": "I", "evidence_ids": ["EVD-b57fc4a2b4c2e6f9c142", "EVD-8c6e476b73570e56d9ed"], "reason": "The warrant transaction is expressly associated with a 2008 deal, supporting a half-open boundary at the start of 2009. The null start preserves the undated pre-commitment activity."}], "gaps": [{"target": "/time/start", "reason": "The records do not establish when the complete pattern of pre-announcement rejections, consideration and investment-related assessments began."}]}, {"stage_id": "STG-4b6dbe04aaa82fc25fc0", "event_id": "PERSON-0001-E0034", "name": "Position reporting and preferred-share redemption", "description": "After establishment, Buffett's documented conduct shifts to official reporting of the Goldman financing position and then to anticipating and explaining the preferred-share redemption and its economic consequences. Goldman's redemption remains corporate context; Buffett's check receipt and explanation are not treated as his execution of the buyback.", "time": {"text": "2009 through the April 18, 2011 preferred-share redemption", "kind": "occurrence_window", "start": "2009-01-01", "end": "2011-04-19", "start_precision": "year", "end_precision": "day"}, "boundary_reason": "The stage opens on a coarse post-establishment boundary and contains the February 2009 and February 2010 shareholder disclosures. Its behavioral turn occurs when Buffett begins discussing imminent redemption, and it closes after the April 18, 2011 redemption day, when the preferred leg no longer remained outstanding.", "support": [{"target": "/description", "mode": "I", "evidence_ids": ["EVD-270d6953ee22671cdbca", "EVD-cd48ea15dbc7b9b4719d", "EVD-abe7b3dccc8264e1c55a", "EVD-0e0327b8c6d6eecf6203"], "reason": "The two letters document the reporting mode, while the redemption prediction and Buffett's explanation of the repayment check document the subsequent redemption-response mode."}, {"target": "/boundary_reason", "mode": "I", "evidence_ids": ["EVD-dedc8300ac079bf3768e", "EVD-cb9b772a0328742f7269", "EVD-abe7b3dccc8264e1c55a"], "premise_refs": [{"collection": "contexts", "object_id": "CTX-f030c74ef96789348064", "field": "/time"}, {"collection": "contexts", "object_id": "CTX-f030c74ef96789348064", "field": "/description"}], "reason": "The letter signature establishes the early reporting observation, the dated article places the prediction in February 2011, and Goldman's redemption record supplies the April 18 situation-changing boundary."}, {"target": "/time", "mode": "I", "evidence_ids": ["EVD-dedc8300ac079bf3768e", "EVD-abe7b3dccc8264e1c55a"], "premise_refs": [{"collection": "contexts", "object_id": "CTX-f030c74ef96789348064", "field": "/time"}], "reason": "The start is a coarse boundary before the February 27, 2009 report, not an alleged action on January 1. The end is the day after the documented April 18 redemption, following the half-open convention."}]}, {"stage_id": "STG-e54826a7206b251affe0", "event_id": "PERSON-0001-E0034", "name": "Warrant retention, amendment and residual share position", "description": "Following preferred redemption, the event situation centers on the surviving warrant, then Buffett's reported amendment-related conduct and stated intention to remain a significant Goldman investor, and finally the corporate warrant settlement and observed residual common-stock position. The share delivery is not independently attributed to Buffett as a personal execution.", "time": {"text": "After the April 18, 2011 redemption through the 2013 year-end residual-position observation", "kind": "occurrence_window", "start": "2011-04-19", "end": "2014-01-01", "start_precision": "day", "end_precision": "year"}, "boundary_reason": "The preferred redemption changes the situation to a warrant-only interval. The March 26, 2013 amendment announcement marks active renegotiation, and the announced October 4 share delivery separates agreement-related conduct from the residual-share observation. The final boundary follows Berkshire's December 31, 2013 common-stock listing; it is not a documented disposal date.", "support": [{"target": "/description", "mode": "I", "evidence_ids": ["EVD-c449b55bd94fd507cab6", "EVD-fd393e8c9a8db7a1bdc4"], "premise_refs": [{"collection": "contexts", "object_id": "CTX-f34f6b7257a7def1ca89", "field": "/description"}, {"collection": "contexts", "object_id": "CTX-6df77ae30892ba8e71fc", "field": "/description"}, {"collection": "contexts", "object_id": "CTX-b7f3db7591f45859fc48", "field": "/description"}], "reason": "The surviving-warrant record, Buffett's amendment-release statement, the reported conversion, the announced share delivery and the year-end listing together support the successive situations in this stage."}, {"target": "/boundary_reason", "mode": "I", "evidence_ids": ["EVD-8ea4241d86911c9ee2b9"], "premise_refs": [{"collection": "contexts", "object_id": "CTX-f030c74ef96789348064", "field": "/time"}, {"collection": "contexts", "object_id": "CTX-6df77ae30892ba8e71fc", "field": "/time"}, {"collection": "contexts", "object_id": "CTX-b7f3db7591f45859fc48", "field": "/time"}], "reason": "The redemption, amendment announcement, delivery and year-end listing provide situation-based boundaries rather than arbitrary equal date bins."}, {"target": "/time", "mode": "I", "evidence_ids": [], "premise_refs": [{"collection": "contexts", "object_id": "CTX-f030c74ef96789348064", "field": "/time"}, {"collection": "contexts", "object_id": "CTX-6df77ae30892
