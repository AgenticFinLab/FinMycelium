<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event process graph</title>
<style>
:root {
  --navy: #0b3865;
  --ink: #203547;
  --muted: #687c8b;
  --border: #d5e0e7;
  --green: #2c745e;
  --purple: #80589f
}

* {
  box-sizing: border-box
}

[hidden] {
  display: none !important
}

body {
  margin: 0;
  color: var(--ink);
  background: #edf2f6;
  font: 14px/1.4 Arial, Helvetica, sans-serif
}

button,
select {
  font: inherit;
  color: inherit
}

button {
  cursor: pointer
}

button:focus-visible,
select:focus-visible {
  outline: 3px solid #398bc3;
  outline-offset: 2px
}

#toolbar {
  height: 46px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: white;
  border-bottom: 1px solid var(--border)
}

#toolbar button,
#toolbar select {
  border: 1px solid #c6d3dd;
  border-radius: 4px;
  background: white;
  padding: 4px 9px
}

#picker {
  max-width: 650px
}

.spacer {
  flex: 1
}

#viewport {
  height: calc(100vh - 46px);
  overflow: auto;
  padding: 12px;
  touch-action: pan-x pan-y
}

#sheet {
  width: 1134px;
  position: relative;
  background: white;
  box-shadow: 0 2px 10px #20354716
}

#heading {
  background: var(--navy);
  color: white;
  padding: 14px 24px;
  font-size: 24px;
  line-height: 1.2
}

#subheading {
  display: flex;
  justify-content: space-between;
  padding: 9px 24px;
  color: var(--muted)
}

#navigation {
  display: flex;
  gap: 8px;
  padding: 0 22px 10px;
  align-items: stretch
}

/* Keep the existing stage controls in reach while the canvas scrolls sideways. */
#heading,
#subheading,
#navigation {
  position: sticky;
  left: 0;
  width: 1134px;
  max-width: 100%
}

#subheading,
#navigation {
  background: white
}

.stage {
  background: #f7fafc;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  min-width: 210px;
  flex: 1
}

.stage small {
  font-size: 10px;
  color: var(--muted)
}

.stage h2 {
  font-size: 13px;
  margin: 3px 0 8px;
  line-height: 1.3
}

.phase-list {
  display: flex;
  gap: 6px
}

.phase-list button {
  flex: 1;
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px;
  font-size: 11px;
  line-height: 1.3
}

.phase-list button.active {
  background: #2868a8;
  color: white;
  border-color: #2868a8
}

#graph {
  position: relative;
  width: 1134px
}

#regions,
#cards,
#links {
  position: absolute;
  inset: 0;
  pointer-events: none
}

.section {
  position: absolute;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white
}

.section.evidence {
  background: #fafdfe
}

.section h3 {
  font-size: 18px;
  margin: 9px 12px
}

.section .legend {
  position: absolute;
  left: 620px;
  max-width: 450px;
  font-size: 11px;
  color: var(--green);
  margin: 14px
}

#links {
  overflow: visible;
  z-index: 1
}

#cards {
  z-index: 2
}

.card {
  pointer-events: auto;
  position: absolute;
  display: block;
  text-align: left;
  border: 1px solid #9dbeb0;
  background: #e2f0e6;
  border-radius: 6px;
  padding: 8px 10px;
  overflow: hidden;
  overflow-wrap: anywhere;
  cursor: pointer
}

.card.context,
.card.phase {
  background: #fff4d7;
  border-color: #d8be76
}

.card.source {
  background: white;
  border-color: #8fb5a4
}

.card.party {
  background: transparent;
  border: 0;
  padding: 0;
  text-align: center
}

.party-icon {
  display: block;
  width: 56px;
  height: 56px;
  margin: 0 auto 4px
}

.card.party .title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  -webkit-line-clamp: 2
}

.party-caption {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px
}

.card.party[aria-expanded=true] {
  padding: 9px;
  text-align: left;
  background: #e5f0fa;
  border: 1px solid #92b2d5
}

.card:hover {
  outline: 2px solid #7093a8;
  outline-offset: 1px
}

.card .meta {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  font-weight: 600;
  padding-right: 0;
  margin-bottom: 5px;
  color: #385164
}

.card .title {
  font-size: 13px;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden
}

.card.compact .title {
  -webkit-line-clamp: 2
}

.card.compact .participants {
  display: none
}

.card.action .title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  -webkit-line-clamp: 3
}

.card.context .title {
  font-weight: 400
}

.card .participants {
  display: block;
  color: #2868a8;
  font-size: 10px;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
  margin-top: 6px
}

.badges {
  position: absolute;
  right: 4px;
  top: 4px;
  background: var(--green);
  color: white;
  border-radius: 3px;
  font-size: 9px;
  padding: 2px 4px;
  max-width: 90px;
  overflow: hidden;
  white-space: nowrap
}

.card.source .title {
  color: var(--green);
  font-size: 13px;
  font-weight: 600;
  -webkit-line-clamp: 2
}

.card .excerpt {
  font-size: 11px;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 7px;
  line-height: 1.35
}

.card .targets {
  display: block;
  color: var(--green);
  font-size: 10px;
  margin-top: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.card[aria-expanded=true] {
  z-index: 8;
  box-shadow: 0 5px 20px #233b4c35;
  outline: 2px solid #537f98
}

.card .detail {
  display: block;
  height: 100%;
  overflow: auto;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap
}

.card .detail strong {
  display: block;
  font-size: 14px;
  line-height: 1.35;
  margin-bottom: 8px
}

.card .detail p {
  margin: 8px 0
}

.card .detail .quote {
  border-top: 1px solid #cddfd6;
  padding-top: 8px
}

.card .detail a {
  color: #2868a8;
  word-break: break-all
}

[hidden] {
  display: none !important
}

#jumps {
  padding: 4px 24px 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap
}

#jumps button {
  background: white;
  color: var(--purple);
  font-size: 11px;
  border: 1px solid #d6c9df;
  border-radius: 4px;
  padding: 6px 10px
}

svg text {
  font: 10px Arial, Helvetica, sans-serif;
  paint-order: stroke;
  stroke: white;
  stroke-width: 5px;
  stroke-linejoin: round
}
</style>
</head>

, "time": {"text": "After-hours trading on September 23, 2008", "kind": "occurrence_window", "start": "2008-09-23", "end": "2008-09-24", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-99df11c948e6a4de0bbd"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-99df11c948e6a4de0bbd"]}, {"target": "/time", "mode": "I", "evidence_ids": ["EVD-9d4b00f457e33de07da5", "EVD-99df11c948e6a4de0bbd"], "reason": "The report places the after-hours movement 'tonight (Tuesday)' and its publication line is Tuesday, September 23, 2008."}], "gaps": [{"target": "/description", "reason": "The report does not quantify the share-price movement or establish that Buffett's endorsement caused it."}]}, {"context_id": "CTX-d811ea7ae95185c266dd", "category": "environment", "description": "The source situates the investment within the 2008 global financial crisis, when leading Wall Street firms were seeking adequate capitalization and liquidity. It says that while many US firms looked overseas for capital infusions, Goldman Sachs found willing investors closer to home.", "entity_refs": ["ENT-c1d3add6532941830c73"], "time": {"text": "2008 global financial crisis", "kind": "occurrence_window", "start": "2008-01-01", "end": "2009-01-01", "start_precision": "year", "end_precision": "year"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-f4719e00243276db05fd"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-f4719e00243276db05fd"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-f4719e00243276db05fd"]}]}, {"context_id": "CTX-778e7464aef2ade46d1b", "category": "relations", "description": "The source says that Buffett first met senior partner Sidney Weinberg in 1940 and had worked with Goldman Sachs for more than 50 years. It states that this long-term relationship formed the basis for approaching Buffett about a potential Goldman Sachs investment to help the firm meet its capital needs during the financial crisis.", "entity_refs": ["PERSON-0001", "ENT-36e7b8847aa61d72ca0e", "ENT-c1d3add6532941830c73"], "time": {"text": "First meeting in 1940; crisis-era approach not separately dated", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-ae9b0e9cab2df456f0b7"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-ae9b0e9cab2df456f0b7"]}], "gaps": [{"target": "/time", "reason": "The passage supplies 1940 for the first meeting but does not date the subsequent approach or provide a single occurrence window covering the relationship, approach and proposed investment."}, {"target": "/description", "reason": "The passage does not identify who approached Buffett, when the approach occurred, or what response he gave at that stage."}]}, {"context_id": "CTX-e599203c35b7a2ed045a", "category": "relations", "description": "On September 23, 2008, Goldman Sachs announced a private offering under which Berkshire Hathaway would purchase US$5 billion of special preferred shares paying a 10 percent annual dividend. Goldman had an option to buy back the shares for US$5 billion plus a one-time US$500 million dividend, and Berkshire would also acquire warrants to buy an additional US$5 billion of common stock at US$115 per share.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "September 23, 2008 announcement", "kind": "occurrence_window", "start": "2008-09-23", "end": "2008-09-24", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-44aa9ba27e0358344e67"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-44aa9ba27e0358344e67"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-44aa9ba27e0358344e67"]}], "gaps": [{"target": "/description", "reason": "This paragraph announces the proposed purchase and instrument terms but does not identify transaction signatories or separately document authorization and closing mechanics."}]}, {"context_id": "CTX-a9217585c95efbc14873", "category": "environment", "description": "On the day after the Berkshire investment announcement, Goldman Sachs completed a separate public offering of 46.7 million common shares at US$123 per share, raising US$5.75 billion. The source describes that offering as well-received and oversubscribed.", "entity_refs": ["ENT-c1d3add6532941830c73"], "time": {"text": "The day after the September 23, 2008 announcement", "kind": "occurrence_window", "start": "2008-09-24", "end": "2008-09-25", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-459c830f9256520a9e9b"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-459c830f9256520a9e9b"]}, {"target": "/time", "mode": "I", "evidence_ids": ["EVD-44aa9ba27e0358344e67", "EVD-459c830f9256520a9e9b"], "reason": "The Berkshire announcement is dated September 23, 2008, and the public-offering sentence expressly places its completion on the following day, supporting September 24 without supplying a more precise time."}]}, {"context_id": "CTX-a68400a75b64953f0561", "category": "relations", "description": "In March 2011, Goldman Sachs announced that it would exercise its option to buy back the Berkshire Hathaway shares two years early. The source states that Goldman had secured Federal Reserve approval to make the payments following a review of its balance sheet.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3", "ENT-fd7afb94e4ae7a245bbf"], "time": {"text": "March 2011 announcement", "kind": "occurrence_window", "start": "2011-03-01", "end": "2011-04-01", "start_precision": "month", "end_precision": "month"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-c9d24532a8d008012983"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-c9d24532a8d008012983"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-c9d24532a8d008012983"]}], "gaps": [{"target": "/description", "reason": "The passage announces an intended early buyback and reports regulatory approval, but does not itself confirm the payment date, completed redemption, payment amount or precise announcement day."}]}, {"context_id": "CTX-95d5b83c2468ae84ab8e", "category": "relations", "description": "Goldman Sachs's Form 8-K states that Goldman agreed to issue and sell, and Berkshire Hathaway Inc. and certain affiliates agreed to purchase, 50,000 shares of 10% Cumulative Perpetual Preferred Stock, Series G, with a liquidation value of $100,000 per share, together with a warrant to purchase 43,478,260 shares of voting common stock with par value $0.01 per share. The stated aggregate purchase price was $5.0 billion in cash.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "The form reports September 23, 2008 as the earliest event date; the supplied range does not separately state the agreement's execution or closing date.", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-ec6c58f552e309009d13"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-ec6c58f552e309009d13"]}, {"target": "/time", "mode": "O", "evidence_ids": ["EVD-66567eedd3ea2efb85f3"]}], "gaps": [{"target": "/time", "reason": "The earliest-event metadata and the September 29 filing date do not independently establish when the agreement was executed or when the securities sale and warrant issuance closed."}, {"target": "/description", "reason": "This passage records an agreement to issue, sell and purchase, not completed closing. It does not name Warren Buffett or document his personal decision, authorization or execution, so it does not independently support a new focal-person Action."}]}, {"context_id": "CTX-29d11ed35b0bdfa022b8", "category": "relations", "description": "The filing states that Series G preferred dividends accrue annually at 10% of liquidation value but are payable only when declared by Goldman's board from legally available funds. Unpaid amounts accrue dividends at the same rate, and while dividends remain unpaid Goldman cannot pay dividends or other distributions on, or repurchase, outstanding common stock or any series of its preferred stock. Subject to approval by the Board of Governors of the Federal Reserve System, Goldman may redeem the preferred stock at any time, in whole or in part, at 110% of the liquidation value redeemed plus accrued unpaid dividends. The preferred stock has no maturity date and ranks senior to common stock, and pari passu with Goldman's other preferred series, for dividends and liquidation distributions.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3", "ENT-fd7afb94e4ae7a245bbf"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-625f253f4505c77dcea9"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-ec6c58f552e309009d13", "EVD-625f253f4505c77dcea9"]}], "gaps": [{"target": "/time", "reason": "These are instrument terms; the supplied range does not provide a separate effective period or an actual dividend-payment or redemption date."}, {"target": "/description", "reason": "The passage establishes dividend and redemption rights and restrictions, not that dividends were declared or paid or that Goldman exercised the redemption right."}]}, {"context_id": "CTX-99743573aa5bb187cdd8", "category": "relations", "description": "While at least 10,000 preferred shares remain outstanding, the preferred stock voting as a separate class has approval rights over future senior preferred issuance and specified charter amendments, mergers, reclassifications or similar events that substantially modify its rights. Subject to limited exceptions, the preferred stock and warrant are not transferrable for five years. Common shares issuable on exercise may be transferred at any time, but only through public offerings and other public market sales, or private transactions, that do not transfer more than 3.5% of outstanding common stock to any single purchaser or group. While the investor owns at least 10,000 preferred shares, a Goldman spin-off requires part of that preferred stock to be exchanged for preferred stock in the spun-off business based on the relative values of Goldman and that business.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "Five-year transfer restriction; calendar start and end dates are not stated in the supplied range.", "kind": "duration", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-764d15c846f0132e307c"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-ec6c58f552e309009d13", "EVD-764d15c846f0132e307c"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-764d15c846f0132e307c"]}], "gaps": [{"target": "/time", "reason": "The source states a five-year restriction but does not provide calendar endpoints in this range."}]}, {"context_id": "CTX-0ca476ac99e2b4fe4e66", "category": "relations", "description": "The warrant is exercisable at the holder's option, in whole or in part, at any time and from time to time for five years at $115 per common share. Its exercise price and share count are subject to antidilution adjustments for stock splits, reclassifications, noncash distributions, extraordinary cash dividends, pro rata common-stock repurchases, business combinations, and certain issuances of common stock or convertible or exercisable securities below 95% of the common stock's market price at pricing. The investor agreed not to increase its beneficial ownership above 14.9% of outstanding common stock. At issuance, the warrant would be exercisable for approximately 9.0% of post-exercise outstanding common stock.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "Five-year exercise period; the supplied range does not provide calendar start or end dates.", "kind": "duration", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-e7244d25f5d46e1ae94c"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-ec6c58f552e309009d13", "EVD-e7244d25f5d46e1ae94c"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-e7244d25f5d46e1ae94c"]}], "gaps": [{"target": "/time", "reason": "The five-year exercise right is stated without calendar endpoints in this range."}, {"target": "/description", "reason": "These are the original warrant terms only. This range does not report exercise, amendment, settlement, share delivery or any residual common-stock position."}]}, {"context_id": "CTX-21c3582bcef9151594e6", "category": "relations", "description": "The article stated that Berkshire Hathaway was buying $5 billion of Goldman Sachs perpetual preferred stock with a 10% coupon. It said the shares were senior to Goldman's other preferred stock and common stock, and that no other shareholders would receive dividends until Buffett had been paid his 10% in full each year.", "entity_refs": ["ENT-fd0c53f3221a07cd4df3", "ENT-c1d3add6532941830c73", "PERSON-0001"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-61e46c7d4f7663774270"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-61e46c7d4f7663774270"]}], "gaps": [{"target": "/time", "reason": "The present-tense statement that Berkshire 'is buying' does not separately establish the agreement's signing or closing date."}, {"target": "/description", "reason": "The passage alternates between Berkshire as buyer and Buffett as dividend recipient without resolving the preferred shares' legal owner; its dividend characterization is retained as the source's assertion."}]}, {"context_id": "CTX-3774624178344989be8c", "category": "relations", "description": "The article stated that Goldman agreed to include a warrant, described as a long-term call option, entitling Berkshire Hathaway to buy an additional $5 billion of Goldman common stock at $115 per share. It reported Goldman trading at about $130 at the time and said Berkshire would be entitled to buy at $115 regardless of how high the price had risen five years from then.", "entity_refs": ["ENT-fd0c53f3221a07cd4df3", "ENT-c1d3add6532941830c73"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-1093e30ce8ae93f7497d"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-1093e30ce8ae93f7497d"]}], "gaps": [{"target": "/time", "reason": "The article supplies neither the warrant agreement's execution date nor an exact expiration date; its 'five years from now' wording is not converted into one."}, {"target": "/description", "reason": "The passage summarizes the warrant's economics but does not provide the complete agreement, share count, settlement mechanics, or confirmation of issuance and closing."}]}, {"context_id": "CTX-ec95e926e5426eef411f", "category": "relations", "description": "Jeff Clark, identified by the article as its options-trading expert, estimated that the Goldman options Buffett received were worth about $78 each, or $3.2 billion in total on a $5 billion position. The article then calculated net exposure of $1.8 billion, $500 million in annual payments and a 27.7% annual return, and said Buffett might eventually own 10% of the company. These are the source's estimates and analysis, not observed cash receipts or confirmation of a resulting shareholding.", "entity_refs": ["ENT-c4dd54c27919820fee82", "PERSON-0001", "ENT-c1d3add6532941830c73"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-df9db305290838721d79", "EVD-194e933e38c1303e03de"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-df9db305290838721d79", "EVD-194e933e38c1303e03de"]}], "gaps": [{"target": "/time", "reason": "The article does not separately date Clark's valuation work or establish an as-of date for every calculated figure."}, {"target": "/description", "reason": "The option valuation is expressly a rough-guide estimate, and the excerpt does not supply its model inputs or establish that the potential 10% ownership was ever obtained."}]}, {"context_id": "CTX-731dcc78d22d09bfe59e", "category": "relations", "description": "The article describes Buffett as famously reluctant to invest in Wall Street firms but as having a long history with Goldman. It says that, as a 10-year-old, he visited Sidney Weinberg at Goldman Sachs with his father. Buffett recalls Weinberg speaking to him for 45 minutes as if he were an adult and asking him what stock he liked.", "entity_refs": ["PERSON-0001", "ENT-c1d3add6532941830c73", "ENT-36e7b8847aa61d72ca0e"], "time": {"text": "Buffett's childhood and later recollection; no visit date stated", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-e95a0ea3af367babd0b2", "EVD-d77059441fc94f1b7928"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-e95a0ea3af367babd0b2", "EVD-d77059441fc94f1b7928"]}], "gaps": [{"target": "/time", "reason": "The passage gives Buffett's age and Weinberg's leadership dates but does not state the childhood visit's date or when Buffett made the recollection."}]}, {"context_id": "CTX-22edb540a576a0efc634", "category": "relations", "description": "In later years, Buffett liked to cite Byron Trott, who until recently had worked in Goldman's Chicago office, as one of the few investment bankers worth his salt. This records Buffett's reported regard for Trott, which preceded their investment interaction.", "entity_refs": ["PERSON-0001", "ENT-f174a0aa5ad2090f66e2", "ENT-c1d3add6532941830c73"], "time": {"text": "In later years; exact period not stated", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-d77059441fc94f1b7928"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-d77059441fc94f1b7928"]}], "gaps": [{"target": "/time", "reason": "The phrases 'in later years' and 'until recently' do not establish exact dates for Buffett's regard or Trott's Goldman employment."}]}, {"context_id": "CTX-adfddfea39212009ad15", "category": "relations", "description": "Byron Trott asked Buffett whether he would be interested in investing in Goldman during the frenetic days after Lehman Brothers' bankruptcy. This other actor's approach initiated the interaction in which Buffett considered the possibility and subsequently negotiated with Trott.", "entity_refs": ["PERSON-0001", "ENT-f174a0aa5ad2090f66e2", "ENT-c1d3add6532941830c73", "ENT-f36e88ef4880989abcc8"], "time": {"text": "The frenetic days after Lehman Brothers' bankruptcy; exact dates not stated", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}], "gaps": [{"target": "/time", "reason": "The passage supplies a relative setting for Trott's approach but no exact solicitation date."}]}, {"context_id": "CTX-4689a1e9016b9c285cc2", "category": "relations", "description": "Vanity Fair reports that Goldman accepted Buffett's tough terms and, thanks to the investment, was able to raise another $5.75 billion by selling stock to other investors. It also reports Blankfein's statement that Goldman could have raised multiples of that amount but did not need more money. The causal contribution of Buffett's investment is the source's account, not a separately demonstrated calculation.", "entity_refs": ["ENT-c1d3add6532941830c73", "PERSON-0001"], "time": {"text": "Following Buffett's offer; acceptance and additional stock-sale dates not stated", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-10b2fc44f7438a3a01cb"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-10b2fc44f7438a3a01cb"]}], "gaps": [{"target": "/time", "reason": "The passage does not separately date Goldman's acceptance or its sale of stock to other investors."}]}, {"context_id": "CTX-ac4cbaea9250234e3139", "category": "relations", "description": "Discussing whether Goldman could have survived the fall 2008 crisis without government help, Blankfein said he thought it would have survived, but at a much higher risk than he was comfortable with. He said government actions left Goldman better off, while expressing uncertainty about whether they were dispositive. When asked whether Goldman would have failed, he invoked Buffett's agreement to invest $5 billion as his trump card.", "entity_refs": ["ENT-3938c86b6c487e7495e5", "ENT-c1d3add6532941830c73", "PERSON-0001"], "time": {"text": "An October interview concerning fall 2008; exact interview date and year not stated in the passage", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "O", "evidence_ids": ["EVD-bc9bc2684ccce1530c08", "EVD-fa92909325acbddfcf27"]}, {"target": "/entity_refs", "mode": "O", "evidence_ids": ["EVD-513ef27e72eb9e650b05", "EVD-bc9bc2684ccce1530c08", "EVD-fa92909325acbddfcf27"]}], "gaps": [{"target": "/time", "reason": "The article says only 'a Thursday in October' for the interview and does not provide a complete interview date."}]}, {"context_id": "CTX-1da65c714b993ca71d81", "category": "relations", "description": "Blankfein referred to the crisis period as “the fog of war.” Vanity Fair reports that a firmwide story line credited Goldman's culture and risk management, rather than government assistance, with getting it through fall 2008. Asked whether Goldman would have survived without government intervention barring a financial Armageddon, David Viniar answered affirmatively, while Gary Cohn said he thought Goldman would not have failed because it had cash. These are reported beliefs, not established findings about a counterfactual.", "entity_refs": ["ENT-3938c86b6c487e7495e5", "ENT-c1d3add6532941830c73", "ENT-5612d96c1506d2fb3d49", "ENT-b967d35d9be5fdebe7e4"], "time": {"text": "Accounts concerning fall 2008; interview dates not fully stated", "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "O", "evidence_ids": ["EVD-45f5722be6b2ff1f d that the arrangement would make him the bank's ninth-largest shareholder. This was an estimate, not an observed completed position or evidence of the residual common-stock position's endpoint.", "entity_refs": ["PERSON-0001", "ENT-c1d3add6532941830c73"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-bc14e04030d2db7b4aa5", "EVD-b52adcb50c08138d5fc2"]}, {"target": "/entity_refs", "mode": "I", "evidence_ids": ["EVD-bc14e04030d2db7b4aa5", "EVD-b52adcb50c08138d5fc2"], "reason": "The opening names Buffett and Goldman Sachs, resolving the later estimate's pronouns 'him' and 'the bank.'"}], "gaps": [{"target": "/time", "reason": "The estimate is undated and concerns a projected future position rather than a observed holding period."}]}, {"context_id": "CTX-4f4b9847aa2f170ed247", "category": "relations", "description": "BBC quoted Goldman Sachs chief executive Lloyd Blankfein saying: \"We are pleased that Berkshire Hathaway intends to remain a long-term investor in Goldman Sachs.\"", "entity_refs": ["ENT-3938c86b6c487e7495e5", "ENT-fd0c53f3221a07cd4df3", "ENT-c1d3add6532941830c73"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "O", "evidence_ids": ["EVD-90fed2d96c71d32e05cc"]}, {"target": "/entity_refs", "mode": "O", "evidence_ids": ["EVD-90fed2d96c71d32e05cc"]}], "gaps": [{"target": "/time", "reason": "The article does not separately date Blankfein's statement; its publication date is not automatically the statement date."}]}, {"context_id": "CTX-8327d3f6b3be06a4993e", "category": "environment", "description": "BBC situated the 2008 Goldman investment at the height of the global financial crisis. It reported that the investment attracted substantial media attention, particularly concerning the 10% interest Goldman agreed to pay Berkshire.", "entity_refs": ["ENT-fd0c53f3221a07cd4df3", "ENT-c1d3add6532941830c73"], "time": {"text": "2008 investment", "kind": "occurrence_window", "start": "2008-01-01", "end": "2009-01-01", "start_precision": "year", "end_precision": "year"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-bf9324ed3f2979d51b7f"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-bf9324ed3f2979d51b7f"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-bf9324ed3f2979d51b7f"]}]}, {"context_id": "CTX-37ac2eded0d112f762fd", "category": "environment", "description": "BBC reported analysts' view that the 10% interest reflected Goldman's need for the funds and the lack of other potential investors either willing or able to provide the money.", "entity_refs": ["ENT-c1d3add6532941830c73"], "time": {"text": null, "kind": "unknown", "start": null, "end": null, "start_precision": "unknown", "end_precision": "unknown"}, "perspective": "belief", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-bf9324ed3f2979d51b7f", "EVD-5213c7cb64922f31c576"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-5213c7cb64922f31c576"]}], "gaps": [{"target": "/time", "reason": "The article does not identify the analysts or date their assessment; the structured record does not assign it an action date."}]}, {"context_id": "CTX-b7f3db7591f45859fc48", "category": "relations", "description": "Berkshire Hathaway's 2013 shareholder letter lists 13,062,594 shares of The Goldman Sachs Group, Inc. among its fifteen common-stock investments with the largest market value at year-end. The 12/31/13 table reports 2.8% of Goldman owned, a cost of $750 million and a market value of $2,315 million. The footnotes state that cost is the actual purchase price and tax basis, subject to certain GAAP differences, and that the listed share counts exclude shares held by Berkshire subsidiary pension funds.", "entity_refs": ["ENT-fd0c53f3221a07cd4df3", "ENT-c1d3add6532941830c73"], "time": {"text": "12/31/13", "kind": "occurrence_window", "start": "2013-12-31", "end": "2014-01-01", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "O", "evidence_ids": ["EVD-7c1c8531d327c04edf1f", "EVD-660633a5901eae9c683e", "EVD-5a7d16ec3a301555faea", "EVD-5ff293564990733d5213", "EVD-9f30cb0b17e78ca8dedd", "EVD-330404cc1bd0fdd4e6b8"]}, {"target": "/entity_refs", "mode": "I", "evidence_ids": ["EVD-7c1c8531d327c04edf1f", "EVD-5a7d16ec3a301555faea", "EVD-9f30cb0b17e78ca8dedd", "EVD-330404cc1bd0fdd4e6b8"], "reason": "The Goldman Sachs row expressly names the issuer. The surrounding document is addressed to Berkshire Hathaway shareholders, describes the table as 'our' investments, and refers to Berkshire subsidiary pension funds, supporting identification of Berkshire Hathaway as the reporting holder."}, {"target": "/time", "mode": "O", "evidence_ids": ["EVD-7c1c8531d327c04edf1f", "EVD-660633a5901eae9c683e"]}], "gaps": [{"target": "/description", "reason": "This is a year-end snapshot. The passage does not itself identify the listed shares as proceeds of the 2013 warrant settlement, describe acquisitions or disposals during 2013, or establish whether Berkshire retained the position after December 31, 2013; the later residual common-stock endpoint remains unknown from this passage."}]}, {"context_id": "CTX-7882a74d5a799989ba59", "category": "relations", "description": "On March 18, 2011, The Goldman Sachs Group, Inc. announced that the Federal Reserve had concluded it had no objection to Goldman Sachs' proposed 2011 capital actions. Those actions included redeeming in full the 50,000 shares of Goldman's 10% Cumulative Perpetual Preferred Stock, Series G held by Berkshire Hathaway Inc. and certain subsidiaries. The announcement also listed common-stock repurchases and a potential increase in the quarterly common-stock dividend.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3", "ENT-fd7afb94e4ae7a245bbf"], "time": {"text": "March 18, 2011 announcement", "kind": "occurrence_window", "start": "2011-03-18", "end": "2011-03-19", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-4714089faeaf18c7b0e3"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-4714089faeaf18c7b0e3"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-4714089faeaf18c7b0e3"]}], "gaps": [{"target": "/description", "reason": "The Federal Reserve's conclusion is reported without a separate date. Inclusion of common-stock repurchases and a potential dividend increase among the proposed capital actions does not establish that those actions were executed."}]}, {"context_id": "CTX-f030c74ef96789348064", "category": "relations", "description": "Goldman stated that it had mailed redemption notices to Berkshire Hathaway and would redeem all Berkshire-held Preferred Shares at a stated price of $110,000 per share plus accrued and unpaid dividends. The stated redemption date was April 18, 2011. This records the announced terms and schedule, not confirmation that the redemption was completed.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "Scheduled redemption date: April 18, 2011", "kind": "occurrence_window", "start": "2011-04-18", "end": "2011-04-19", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}], "gaps": [{"target": "/description", "reason": "The release does not specify when the notices were mailed, state the aggregate redemption payment, or confirm completion on the scheduled date."}]}, {"context_id": "CTX-f34f6b7257a7def1ca89", "category": "relations", "description": "In the same announcement, Goldman said Berkshire Hathaway continued to hold the warrant to purchase 43,478,260 shares of Goldman common stock, par value $0.01 per share. Thus, the announced preferred-share redemption coexisted with a continuing warrant position; the passage does not describe that warrant's subsequent settlement.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "Continuing position reported in the March 18, 2011 announcement", "kind": "occurrence_window", "start": "2011-03-18", "end": "2011-03-19", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}, {"target": "/time", "mode": "I", "evidence_ids": ["EVD-4714089faeaf18c7b0e3", "EVD-6d1435ce560f9ffaee8b"], "reason": "The first paragraph dates the announcement March 18, 2011, and the following paragraph's statement that Berkshire 'continues to hold' the warrant describes the position reported at that announcement."}], "gaps": [{"target": "/description", "reason": "This passage does not state the warrant's exercise price, expiration, or later amendment and settlement terms."}]}, {"context_id": "CTX-179e0a3e40ed0e8af994", "category": "relations", "description": "Goldman stated that Berkshire Hathaway had purchased the warrant from Goldman concurrently with the Preferred Shares on October 1, 2008. This attributes the concurrent preferred-share and warrant acquisition to Berkshire Hathaway, rather than documenting a personal purchase by Warren Buffett.", "entity_refs": ["ENT-c1d3add6532941830c73", "ENT-fd0c53f3221a07cd4df3"], "time": {"text": "October 1, 2008", "kind": "occurrence_window", "start": "2008-10-01", "end": "2008-10-02", "start_precision": "day", "end_precision": "day"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-6d1435ce560f9ffaee8b"]}], "gaps": [{"target": "/description", "reason": "The sentence does not identify transaction signatories, authorization or closing mechanics, consideration allocated between the instruments, or any individual role in executing the acquisition."}]}, {"context_id": "CTX-211675c33f1dea8f1e45", "category": "environment", "description": "Goldman stated that the redemption included a one-time preferred dividend of approximately $1.64 billion to be reflected in its first-quarter results. It expected this to reduce reported diluted earnings per common share for that quarter by approximately $2.80. Goldman also said the redemption accelerated $24 million of preferred dividends payable from April 1 to the redemption date, expected to reduce first-quarter diluted earnings per common share by approximately $0.04.", "entity_refs": ["ENT-c1d3add6532941830c73"], "time": {"text": "First-quarter results referenced in the March 18, 2011 announcement", "kind": "occurrence_window", "start": "2011-01-01", "end": "2011-04-01", "start_precision": "month", "end_precision": "month"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-33af91651114452a8470"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-33af91651114452a8470"]}, {"target": "/time", "mode": "I", "evidence_ids": ["EVD-4714089faeaf18c7b0e3", "EVD-33af91651114452a8470"], "reason": "The announcement is dated March 18, 2011 and concerns proposed 2011 capital actions. Its reference to the company's first-quarter results therefore supports the first calendar quarter of 2011; the per-share effects remain expectations rather than final reported outcomes."}], "gaps": [{"target": "/description", "reason": "The per-share figures are expected effects, not final reported results. This passage also does not state the total cash payable to Berkshire or separately confirm payment."}]}, {"context_id": "CTX-550162958431cb102263", "category": "environment", "description": "Goldman stated that, while the Preferred Shares were outstanding, it incurred dividend expense of $125 million per quarter, or $500 million annually. It said this expense reduced diluted earnings per common share by $0.85 in 2010.", "entity_refs": ["ENT-c1d3add6532941830c73"], "time": {"text": "2010 diluted-earnings-per-share effect", "kind": "occurrence_window", "start": "2010-01-01", "end": "2011-01-01", "start_precision": "year", "end_precision": "year"}, "perspective": "world", "support": [{"target": "/description", "mode": "A", "evidence_ids": ["EVD-33af91651114452a8470"]}, {"target": "/entity_refs", "mode": "A", "evidence_ids": ["EVD-33af91651114452a8470"]}, {"target": "/time", "mode": "A", "evidence_ids": ["EVD-33af91651114452a8470"]}], "gaps": [{"target": "/time", "reason": "The 2010 window represents the expressly stated diluted-EPS effect. The passage does not bound the entire period during which the Preferred Shares were outstanding or provide year-by-year expense figures."}]}], "sources": [{"source_id": "219e1b8b4e783abdf4d1c027", "title": null, "url": "https://www.berkshirehathaway.com/letters/2009ltr.pdf", "origin": null, "published_at": null, "retrieved_at": "2026-11-15T16:41:36.466881+00:00", "content_status": "success"}, {"source_id": "4732c27ce7d8220f17e59d36", "title": null, "url": "https://www.berkshirehathaway.com/letters/2008ltr.pdf", "origin": null, "published_at": null, "retrieved_at": "2026-11-15T16:40:54.791206+00:00", "content_status": "success"}, {"source_id": "356d705c591a9e9be00faa5e", "title": "Goldman Sachs Amends Terms of Warrants Held by Berkshire Hathaway
