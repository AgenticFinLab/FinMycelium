ire Hathaway and certain subsidiaries, not personally to Buffett. The exact exercise date remains unstated."}, {"context_ref_id": "CREF-21866033093b0fa89215", "context_id": "CTX-6df77ae30892ba8e71fc", "relation_type": "condition", "support": [{"target": "/context_id", "mode": "A", "evidence_ids": ["EVD-2aa4a6f2569d8219677a"]}], "qualification": "Opening delivery condition: the release scheduled 13,062,594 Goldman common shares for delivery to Berkshire on October 4, 2013. It announced a future delivery and did not itself confirm completed receipt."}, {"context_ref_id": "CREF-dffa527e4283127e9862", "context_id": "CTX-b7f3db7591f45859fc48", "relation_type": "condition", "support": [{"target": "/context_id", "mode": "O", "evidence_ids": ["EVD-330404cc1bd0fdd4e6b8", "EVD-7c1c8531d327c04edf1f", "EVD-660633a5901eae9c683e", "EVD-5a7d16ec3a301555faea"]}], "qualification": "Closing observation only: Berkshire's 2013 shareholder letter lists 13,062,594 Goldman shares at December 31, 2013. The snapshot does not establish post-year-end retention, a disposal date, or the residual position's ultimate endpoint."}], "gaps": [{"target": "/time/end", "reason": "No later transaction record establishes when Berkshire's residual Goldman common-stock position was reduced, disposed of or otherwise ended."}]}], "relations": [{"relation_id": "REL-98ad3932f84b291d2400", "from_action_id": "ACT-7f5340d5f0f447a37504", "to_action_id": "ACT-635098845557e07e0728", "type": "precedes", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "I", "evidence_ids": ["EVD-28c774a45a0938b058ab", "EVD-10784b4823828dfe2bf4"], "reason": "The purchase action is the September 2008 Goldman investment identified in the passage explaining the investment that was later repaid."}, {"target": "/to_action_id", "mode": "I", "evidence_ids": ["EVD-28c774a45a0938b058ab"], "reason": "The receipt action is the reported $5.5 billion check that CNBC described as repaying Buffett's Goldman investment."}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-774d7e3887930f74898a", "EVD-28c774a45a0938b058ab", "EVD-10784b4823828dfe2bf4"], "reason": "The investment is dated September 2008, while the April 18, 2011 article reports that a repayment check had already been received. The repayment therefore followed the original investment, although its exact receipt date remains unknown."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-28c774a45a0938b058ab", "EVD-10784b4823828dfe2bf4"], "reason": "The check is expressly connected to the earlier Goldman investment as its repayment, and the following paragraph supplies that investment's September 2008 timing and instruments."}], "description": "The September 2008 preferred-stock investment preceded the reported repayment check, which CNBC expressly described as repaying that crisis-era Goldman investment."}, {"relation_id": "REL-f1ca98649524fc4a564a", "from_action_id": "ACT-12a4b2644faec971e75b", "to_action_id": "ACT-4320509f1a9a2f89eb4c", "type": "precedes", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "A", "evidence_ids": ["EVD-3cc2a7dd9dac1c75ad4b"]}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-76c1c8a45517d5f3d4d5"]}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-27bda8a858929715c101", "EVD-3cc2a7dd9dac1c75ad4b", "EVD-76c1c8a45517d5f3d4d5"], "reason": "The phrase 'Up until now' places the reported rejections before the new Goldman development, while Blankfein describes Buffett's investment decision as already made."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-27bda8a858929715c101", "EVD-3cc2a7dd9dac1c75ad4b", "EVD-76c1c8a45517d5f3d4d5"], "reason": "The lead calls the deal a surprise return to Wall Street, linking the preceding refusal pattern to the later investment decision without supplying exact dates."}], "description": "The reported pattern of rejecting crisis-era pleas to aid Wall Street preceded Buffett's Goldman investment decision, which CNBC presented as a surprise return to Wall Street.", "gaps": [{"target": "/description", "reason": "The sequence is supported at the level of the source's general narrative; no specific rejected plea is identified as preceding or causing the Goldman decision."}]}, {"relation_id": "REL-3db022ef136cf95b30a5", "from_action_id": "ACT-48950dd035c255a56060", "to_action_id": "ACT-bc13e9a8733a00defc05", "type": "precedes", "basis": "asserted", "support": [{"target": "/from_action_id", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}, {"target": "/type", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}, {"target": "/description", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}], "description": "The source says Buffett thought about Trott's solicitation and then places the subsequent deal-hammering with Trott on Tuesday, September 23, supporting narrative precedence without supplying an exact consideration date."}, {"relation_id": "REL-99558c4cb1bded520385", "from_action_id": "ACT-bc13e9a8733a00defc05", "to_action_id": "ACT-f6584a23014e109cc4fc", "type": "order_unknown", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "A", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3"]}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-c04264b0c2b692f09c8f"]}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3", "EVD-c04264b0c2b692f09c8f"], "reason": "Both acts belong to the September 23 deal-making account, but 'that afternoon' supplies proximity rather than a definite sequence between the call and the completion of the deal-hammering."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-eb3e49f17783ca9fb6d3", "EVD-c04264b0c2b692f09c8f"], "reason": "The evidence supports same-afternoon proximity while leaving the precise order and possible overlap unresolved."}], "description": "The deal-hammering and the commitment call are placed on the same day, with the call occurring that afternoon, but the wording does not establish whether the call preceded, followed, or formed part of the deal-hammering."}, {"relation_id": "REL-0ca3389aeb1545c08820", "from_action_id": "ACT-821dc8e7b6ce353b06ef", "to_action_id": "ACT-088e31799e3533d4b22d", "type": "precedes", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "I", "evidence_ids": ["EVD-b57fc4a2b4c2e6f9c142"], "reason": "The referenced action records the warrant receipt expressly reported in this passage."}, {"target": "/to_action_id", "mode": "I", "evidence_ids": ["EVD-fd393e8c9a8db7a1bdc4"], "reason": "The referenced action records the warrant conversion expressly reported in the article's lead."}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-fd393e8c9a8db7a1bdc4", "EVD-b57fc4a2b4c2e6f9c142"], "reason": "The conversion concerns warrants that Reuters says were received as part of the 2008 deal, so their receipt necessarily preceded their conversion."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-fd393e8c9a8db7a1bdc4", "EVD-b57fc4a2b4c2e6f9c142"], "reason": "The two passages link the same warrants to an earlier receipt and a subsequent conversion, supporting the sequence without supplying a precise conversion date."}], "description": "Receipt of the warrants through the 2008 deal preceded their reported conversion into a smaller Goldman stake. The narrative identifies the converted warrants as those received in that earlier deal, although it does not supply the conversion date."}, {"relation_id": "REL-a8cde8db290b0c2a5327", "from_action_id": "ACT-7f5340d5f0f447a37504", "to_action_id": "ACT-2fe4ae02aa6f0c3845f9", "type": "precedes", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "I", "evidence_ids": ["EVD-bc14e04030d2db7b4aa5", "EVD-e3c485aaf776f2024a46"], "reason": "The existing September 2008 Goldman investment action corresponds to the underlying investment represented by the September 2008 $5 billion Berkshire investment and the 2008 warrant. BBC supports the organizational investment but does not itself establish Buffett's personal execution of the 2008 transaction."}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-bc14e04030d2db7b4aa5"]}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-bc14e04030d2db7b4aa5", "EVD-e3c485aaf776f2024a46"], "reason": "BBC dates the original investment and warrant arrangement to 2008 and describes Buffett's agreement as amending the terms of that existing investment, supporting temporal precedence."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-bc14e04030d2db7b4aa5", "EVD-e3c485aaf776f2024a46"], "reason": "The body expressly connects the later amendment to the 2008 investment and separately dates the original Berkshire investment to September 2008."}], "description": "The September 2008 Berkshire Goldman investment and associated 2008 warrant preceded Buffett's later agreement to amend the terms of that investment.", "gaps": [{"target": "/from_action_id", "reason": "BBC supports the underlying organizational investment and warrant but does not itself establish Buffett's personal execution of the 2008 transaction."}]}, {"relation_id": "REL-22b3090b6e980fdcd6fb", "from_action_id": "ACT-ee61441b63072aebdbf7", "to_action_id": "ACT-7f5340d5f0f447a37504", "type": "enables", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "A", "evidence_ids": ["EVD-6e8e7b8d3530ba213ee5"]}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-10784b4823828dfe2bf4"]}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-270d6953ee22671cdbca", "EVD-6e8e7b8d3530ba213ee5", "EVD-10784b4823828dfe2bf4"], "reason": "Buffett said he sold holdings to fund aggregate purchases that expressly included Goldman Sachs, and CNBC separately reported the Goldman preferred-stock and warrant purchase. This supports a funding-facilitation relationship, but not a Goldman-specific proceeds allocation or temporal ordering."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-270d6953ee22671cdbca", "EVD-6e8e7b8d3530ba213ee5"], "reason": "The letter directly connects the sales with funding the large fixed-income purchases, while limiting the supported relationship to that collective financing purpose."}], "description": "The portfolio sales helped fund the aggregate fixed-income purchases that included the Goldman position, enabling the reported investment without establishing a Goldman-specific funding amount.", "gaps": [{"target": "/description", "reason": "The letter does not specify sale dates, proceeds, or the amount of funding allocated to Goldman Sachs, and this edge does not assert that every sale preceded the Goldman purchase."}]}, {"relation_id": "REL-e809adf67fab760e757a", "from_action_id": "ACT-502c39b3d33a8cdb56e6", "to_action_id": "ACT-31f056afd8779278a84a", "type": "precedes", "basis": "derived", "support": [{"target": "/from_action_id", "mode": "I", "evidence_ids": ["EVD-dedc8300ac079bf3768e"], "premise_refs": [{"collection": "actions", "object_id": "ACT-502c39b3d33a8cdb56e6", "field": "/time"}], "reason": "The source action is Buffett's chairman-letter report signed February 27, 2009."}, {"target": "/to_action_id", "mode": "I", "evidence_ids": ["EVD-e47272b102b683bf5188"], "premise_refs": [{"collection": "actions", "object_id": "ACT-31f056afd8779278a84a", "field": "/time"}], "reason": "The target action is Buffett's chairman-letter report signed February 26, 2010."}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-dedc8300ac079bf3768e", "EVD-e47272b102b683bf5188"], "premise_refs": [{"collection": "actions", "object_id": "ACT-502c39b3d33a8cdb56e6", "field": "/time"}, {"collection": "actions", "object_id": "ACT-31f056afd8779278a84a", "field": "/time"}], "reason": "The complete half-open intervals [2009-02-27,2009-02-28) and [2010-02-26,2010-02-27) are conflict-free and nonoverlapping, with the first ending before the second begins."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-dedc8300ac079bf3768e", "EVD-e47272b102b683bf5188"], "premise_refs": [{"collection": "actions", "object_id": "ACT-502c39b3d33a8cdb56e6", "field": "/time"}, {"collection": "actions", "object_id": "ACT-31f056afd8779278a84a", "field": "/time"}], "reason": "The two signature dates directly establish the order of the official reports without assigning any additional transaction dates."}], "description": "Buffett's February 2009 financing-commitment report preceded his February 2010 non-traded-securities report."}, {"relation_id": "REL-25ea97c54e8163e51368", "from_action_id": "ACT-ef371013c89113b8546e", "to_action_id": "ACT-635098845557e07e0728", "type": "precedes", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "A", "evidence_ids": ["EVD-abe7b3dccc8264e1c55a"]}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-28c774a45a0938b058ab"]}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-cb9b772a0328742f7269", "EVD-abe7b3dccc8264e1c55a", "EVD-5ad545bc90ebbe9952fa", "EVD-774d7e3887930f74898a", "EVD-28c774a45a0938b058ab"], "reason": "The March 18, 2011 AP report places the prediction in the previous month and describes regulatory permission for a repurchase, while the later April 18 CNBC report says the repayment check had been received. The prediction therefore preceded the reported repayment, without supplying the check's exact receipt date."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-abe7b3dccc8264e1c55a", "EVD-5ad545bc90ebbe9952fa", "EVD-28c774a45a0938b058ab"], "reason": "The prediction anticipated redemption of the same preferred shares whose repayment was later reported, supporting the process sequence rather than a claim of exact day-level timing."}], "description": "Buffett's February 2011 prediction that Goldman would soon redeem the preferred shares preceded the reported receipt of the repayment check.", "gaps": [{"target": "/type", "reason": "This is source-based temporal inference, not a derived interval relation, because the repayment receipt action has no exact occurrence date."}]}, {"relation_id": "REL-3aa4b271319db794123e", "from_action_id": "ACT-e7549be006fc3b0c2cdc", "to_action_id": "ACT-635098845557e07e0728", "type": "responds_to", "basis": "inferred", "support": [{"target": "/from_action_id", "mode": "O", "evidence_ids": ["EVD-0e0327b8c6d6eecf6203"]}, {"target": "/to_action_id", "mode": "A", "evidence_ids": ["EVD-28c774a45a0938b058ab"]}, {"target": "/type", "mode": "I", "evidence_ids": ["EVD-28c774a45a0938b058ab", "EVD-0e0327b8c6d6eecf6203"], "reason": "Buffett's CNBC statement explains the components of the same Goldman check whose receipt the article reports, making it a response to and explanation of that repayment rather than a separate buyback execution."}, {"target": "/description", "mode": "I", "evidence_ids": ["EVD-28c774a45a0938b058ab", "EVD-0e0327b8c6d6eecf6203"], "reason": "The $5 billion preferred-share component and $500 million dividend directly elaborate the reported $5.5 billion repayment check."}], "description": "Buffett's explanation of the check's preferred-share buyback and dividend components responded to the reported repayment receipt.", "gaps": [{"target": "/description", "reason": "The source does not separately date the explanation or establish its precise temporal order relative to the actual check delivery."}]}]}</script>

<script id="epg-view" type="application/json">{"details": {"PERSON-0001-E0034": {"title": "Goldman Sachs crisis investment", "paragraphs": ["Buffett considered and explained conditions for a crisis-era Goldman investment, communicated and publicly endorsed Berkshire's proposed terms and $5 billion commitment, and was reported to have established the preferred-stock and warrant position, with related portfolio sales funding the broader purchases. He later reported the outstanding position in shareholder letters, anticipated and explained the 2011 preferred redemption and was reported to receive and explain the repayment check. In 2013 he stated an intention to remain a significant Goldman investor while reports attributed warrant amendment and conversion conduct to him. Goldman's October 4, 2013 delivery of 13,062,594 shares to Berkshire and Berkshire's December 31, 2013 common-stock listing document the residual position; they are not recast as separate personal settlement executions by Buffett."], "date": "Undated pre-commitment activity through the 2013 year-end residual-position observation"}, "ACT-31f056afd8779278a84a": {"title": "Buffett reported the Goldman Sachs non-traded securities position", "paragraphs": ["In a letter signed February 26, 2010, Warren E. Buffett disclosed in the Investments section that the letter's \"we\" owned non-traded securities of Goldman Sachs and four other issuers, and reported the five positions' collective purchase timing and economics."], "date": "February 26, 2010"}, "ACT-ee61441b63072aebdbf7": {"title": "Buffett sold holdings to fund the fixed-income purchases", "paragraphs": ["Buffett stated that he had to sell portions of holdings he would have preferred to keep, primarily Johnson & Johnson, Procter & Gamble and ConocoPhillips, to fund these large purchases."], "date": null}, "ACT-7e1ac17da64f58aae1b8": {"title": "Buffett stated an intention to hold a significant Goldman Sachs investment", "paragraphs": ["On March 26, 2013, in Goldman Sachs's announcement of the warrant amendment, Buffett publicly said that “we” intended to hold a significant investment in Goldman Sachs, describing it as the firm with which he had done his first transaction more than 50 years earlier. He also said that he had known and admired Goldman's executive leadership team since his first meeting with Sidney Weinberg in 1940. This records Buffett's statement of intent, not execution of the amended warrant settlement."], "date": "March 26, 2013"}, "ACT-5cad0000faec2867057a": {"title": "Buffett and Goldman Sachs amended the 2008 warrant deal", "paragraphs": ["Reuters reported that Buffett and Goldman Sachs amended a 2008 deal to exchange his potential profit on Goldman warrants for stock. This records the reported amendment, not completion of the contemplated share delivery."], "date": null}, "ACT-e297c7f4f9baa8effcb7": {"title": "Buffett publicly praised Goldman Sachs in the investment announcement", "paragraphs": ["In Goldman Sachs's September 23, 2008 announcement of Berkshire Hathaway's investment agreement, Buffett called Goldman Sachs an exceptional institution and cited its unrivaled global franchise, proven and deep management team, and intellectual and financial capital to continue its track record of outperformance. CNBC separately reported the same quotation as appearing in the investment release."], "date": "September 23, 2008 announcement"}, "ACT-7f5340d5f0f447a37504": {"title": "Buffett bought Goldman Sachs preferred stock and received common-stock warrants", "paragraphs": ["CNBC reported that in September 2008 Buffett, identified as Berkshire Hathaway's CEO and a longtime Goldman Sachs client, bought $5 billion of Goldman preferred stock and received warrants to buy $5 billion of its common stock. This records the report's attribution to Buffett in his official Berkshire capacity, not a personal securities transaction."], "date": "September 2008"}, "ACT-635098845557e07e0728": {"title": "Buffett received a $5.5 billion repayment check from Goldman Sachs", "paragraphs": ["CNBC reported that Warren Buffett received a $5.5 billion check from Goldman Sachs repaying his crisis-era Goldman investment. Buffett separately told CNBC that the check comprised $5 billion to buy back 50,000 preferred shares and a $500 million dividend. This preserves CNBC's attribution and does not independently establish personal legal ownership of the check."], "date": null}, "ACT-e7549be006fc3b0c2cdc": {"title": "Buffett explained the repayment check to CNBC", "paragraphs": ["Buffett told CNBC that the check consisted of $5 billion to buy back the 50,000 preferred shares he had acquired, plus a $500 million dividend. This records his reported explanation, not a separate buyback execution by Buffett."], "date": null}, "ACT-ef371013c89113b8546e": {"title": "Buffett predicted that Goldman would soon redeem the preferred shares", "paragraphs": ["The Associated Press reported that Buffett predicted in his annual letter to shareholders “last month” that Goldman would soon redeem the shares. The same sentence reports that he did not immediately respond to a message Friday seeking comment; this record captures the earlier letter prediction, not a new direct comment to the AP."], "date": "“Last month” relative to the article dated March 18, 2011"}, "ACT-4ae6cacdde9d9dcefdb9": {"title": "Buffett characterized Goldman's preferred dividend", "paragraphs": ["The AP reported that Buffett had said the $500 million dividend Goldman had been paying Berkshire amounted to nearly $16 a second, making every tick of the clock sound like music to his ears. He also said Goldman did not seem to like hearing its money tick away. This preserves his reported characterization rather than treating the figurative language as a transaction."], "date": null}, "ACT-cb5da684fec1f469f503": {"title": "Buffett told shareholders the redemption would diminish Berkshire's earning power", "paragraphs": ["The AP reported that Buffett told shareholders Goldman's decision to redeem the shares, together with similar moves by Swiss Re and General Electric, would diminish Berkshire's earning power because it would no longer receive the special high dividends. This records his stated expectation, not confirmation of the eventual earnings impact; the other issuers are comparisons only and are not merged into this event."], "date": null}, "ACT-12a4b2644faec971e75b": {"title": "Buffett rejected pleas to aid Wall Street before the Goldman deal", "paragraphs": ["CNBC stated that, up until the Goldman announcement, Buffett had rejected all pleas to come to Wall Street's aid during the current crisis. This preserves the source's collective characterization rather than asserting separately documented rejections."], "date": "Before the September 23, 2008 Goldman announcement; exact period not stated"}, "ACT-fc6b179e4e529f7ca98d": {"title": "Buffett stipulated a share-sale restriction for Goldman Sachs executives", "paragraphs": ["Goldman Sachs's retrospective account states that Buffett stipulated that its top executives pledge not to sell their own shares before Buffett sold his. This records the stipulated investment term, not evidence that the executives subsequently gave or complied with the requested pledge."], "date": null}, "ACT-7ebf2e9c45f6177bd5f7": {"title": "Buffett stated a bailout condition for the Goldman purchase", "paragraphs": ["The article reported that Buffett said he would not have purchased Goldman unless he was sure Congress would do the \"right thing\" by approving the $700 billion bailout. This records the reported statement and its expressed condition, not independent proof of an unobserved private motive or of any subsequent congressional action."], "date": null}, "ACT-48950dd035c255a56060": {"title": "Buffett considered Trott's Goldman Sachs investment solicitation", "paragraphs": ["Vanity Fair reports that when Byron Trott asked Buffett whether he would be interested in investing in Goldman during the frenetic days after Lehman Brothers' bankruptcy, Buffett thought about it. This records the reported consideration, not a final decision or execution of an investment."], "date": "During the frenetic days after Lehman Brothers' bankruptcy; exact dates not stated"}, "ACT-f6584a23014e109cc4fc": {"title": "Buffett communicated a $5 billion Goldman investment commitment and terms", "paragraphs": ["On the afternoon of September 23, 2008, Buffett orally communicated a $5 billion Goldman Sachs investment commitment and core terms: a 10 percent annual dividend and rights to buy additional stock for five years at $115 per share. Inteliview's account says Goldman CFO David Viniar called Omaha, specifies Berkshire Hathaway as the purchaser of $5 billion of perpetual preferred shares and recipient of warrants to purchase $5 billion of common shares, adds redemption at 110% of face value, and says Viniar wrote down terms Buffett stated in a call lasting under five minutes. Vanity Fair instead describes a brief call that afternoon with Blankfein, Trott and Jon Winkelried and quotes Buffett saying he was taking his grandchildren to Dairy Queen and asking the Goldman men to call with their decision. This records the communicated commitment and terms, not a separately observed closing."], "date": "Afternoon of Tuesday, September 23, 2008"}, "ACT-69ec785fc9fc24041e51": {"title": "Buffett expressed confidence in Blankfein despite opaque Wall Street balance sheets", "paragraphs": ["Vanity Fair reports that Buffett had said no one could ever understand the balance sheet of any Wall Street firm, but that he had confidence Blankfein was both very smart and very conservative. This records Buffett's reported assessment, not independent verification of either proposition."], "date": null}, "ACT-180d46e23d0c97f507b4": {"title": "Buffett explained a government-action condition for his investment activity", "paragraphs": ["In the article's account of another reason he invested, Buffett explained to CNBC's Becky Quick: “If I didn’t think the government was going to act, I would not be doing anything this week.” He added, “I might be trying to undo things this week.” This preserves his stated condition and expectation rather than asserting an unobserved private motive or subsequent government conduct."], "date": "“This week” in an undated explanation to CNBC's Becky Quick"}, "ACT-088e31799e3533d4b22d": {"title": "Buffett converted Goldman Sachs warrants into a smaller stake", "paragraphs": ["Reuters reported that Warren Buffett had given up the chance to become Goldman Sachs Group Inc's largest shareholder by converting his warrants into a smaller stake in the bank, at no additional cost to Berkshire Hathaway Inc. This preserves Reuters' attribution and characterization; the supplied passage does not independently establish the share-delivery mechanics or the residual common-stock position's endpoint."], "date": null}, "ACT-821dc8e7b6ce353b06ef": {"title": "Buffett received warrants through the 2008 Goldman Sachs deal", "paragraphs": ["Reuters stated that Buffett received the warrants as part of a 2008 deal during the depths of the financial crisis. The following sentence attributes the share-purchase right under that deal to Berkshire. This records Reuters' reported attribution of the warrant receipt within the corporate investment setting, not a separately documented personal securities transaction."], "date": "As part of a 2008 deal"}, "ACT-2fe4ae02aa6f0c3845f9": {"title": "Buffett agreed to amend the 2008 Goldman Sachs investment terms", "paragraphs": ["BBC reported that Warren Buffett agreed to amend the terms of his 2008 Goldman Sachs investment. Under the reported arrangement, instead of Berkshire buying the warrant shares, Goldman would provide shares without Berkshire having to spend billions of dollars up front. This records the reported agreement, not completion of the contemplated share delivery."], "date": null}, "ACT-502c39b3d33a8cdb56e6": {"title": "Buffett reported the Goldman Sachs financing commitment", "paragraphs": ["In a letter signed February 27, 2009, Buffett reported that \"we\" had made purchases totaling $14.5 billion in fixed-income securities issued by Wrigley, Goldman Sachs and General Electric \"last year.\" He said the commitments carried high current yields and that each of the three purchases also provided a substantial equity participation as a bonus."], "date": "February 27, 2009 (letter signature)"}, "ACT-4320509f1a9a2f89eb4c": {"title": "Buffett decided to make a significant Goldman Sachs investment", "paragraphs": ["Goldman Sachs's September 23, 2008 release and CNBC's report quoted Lloyd C. Blankfein saying that, given the longstanding relationship, Warren Buffett had decided to make a significant investment in Goldman Sachs. Both accounts identify Berkshire Hathaway as the party to the accompanying $5 billion preferred-stock transaction and warrant arrangement. This records Blankfein's attribution of the investment decision to Buffett, not separate evidence that Buffett personally executed the corporate transaction."], "date": null}, "ACT-ab15a2abc379c12d7521": {"title": "Buffett told CNBC he loved the Goldman deal's terms and Goldman", "paragraphs": ["In a brief off-camera telephone conversation, Buffett told CNBC's Becky Quick that he loved the terms of the Goldman investment deal and loved Goldman. This records CNBC's short report of his statement, not a separate execution of the deal."], "date": "Tonight, September 23, 2008"}, "ACT-bc13e9a8733a00defc05": {"title": "Buffett and Trott hammered out a Goldman investment deal", "paragraphs": ["Vanity Fair reports that, after Buffett considered Trott's solicitation, Buffett and Trott hammered out a deal on Tuesday, September 23. The article does not provide transaction documents or establish whether this wording denotes final execution rather than negotiation of the terms."], "date": "Tuesday, September 23, 2008; the year is inferred from the article's fall 2008 crisis framing"}, "ACT-db29c14ce1d1cf9fa0da": {"title": "Buffett announced Berkshire's prospective Goldman Sachs position", "paragraphs": ["The article reported that Warren Buffett announced Berkshire Hathaway, described as his holding company, would take a $5 billion position in Goldman Sachs. This records the reported announcement, not separate evidence that Buffett personally executed or closed the corporate transaction."], "date": "“Last night” in the article dated September 24, 2008"}, "CTX-1823c8d49bf5e30ec19e": {"title": "Buffett's letter states that Berkshire owned a position in non-traded Goldman Sachs securities. Goldman Sachs was grouped with Dow Chemical, General Electric, Swiss Re and Wrigley; the five positions together had an aggregate cost of $21.1 billion and a carrying value of $26.0 billion, provided significant equity potential, and delivered an aggregate $2.1 billion annually in dividends and interest.", "paragraphs": [], "date": null}, "CTX-79f36b6a681345612194": {"title": "Using \"we,\" the letter states that the same five non-traded securities positions, including the Goldman Sachs position, were purchased \"in the last 18 months.\"", "paragraphs": [], "date": "\"In the last 18 months,\" relative to the dated letter"}, "CTX-4defdf4bcad57885b368": {"title": "Buffett's letter asserts that Berkshire made aggregate purchases totaling $14.5 billion in fixed-income securities issued by Wrigley, Goldman Sachs and General Electric in the prior year. It characterizes the commitments as carrying high current yields and says each of the three purchases included substantial equity participation as a bonus.", "paragraphs": [], "date": "\"last year\" in the letter signed February 27, 2009"}, "CTX-b95831bee645161abc3a": {"title": "Goldman Sachs announced that it had amended its warrant agreement with Berkshire Hathaway Inc. and certain of its subsidiaries, collectively Berkshire Hathaway, changing the agreement from cash settlement to net share settlement.", "paragraphs": [], "date": "March 26, 2013 (“today” in the announcement)"}, "CTX-f0fa62d8ba86181d3274": {"title": "The release states that the warrant had provided Berkshire Hathaway the right to purchase 43,478,260 shares of Goldman Sachs common stock, par value $0.01 per share, at an exercise price of $115 at any time until October 1, 2013.", "paragraphs": [], "date": "Exercise right available at any time until October 1, 2013; starting date not stated"}, "CTX-baa624915efb944e740f": {"title": "Under the amended agreement, Goldman Sachs will deliver to Berkshire Hathaway a number of common shares equal in value to the difference between the average closing price over the 10 trading days preceding October 1, 2013 and the $115 exercise price, multiplied by the 43,478,260 shares covered by the warrant.", "paragraphs": [], "date": "Settlement formula tied to the 10 trading days preceding October 1, 2013; delivery date not stated"}, "CTX-6987da47c89ff96d1f0c": {"title": "Goldman Sachs announced that Berkshire Hathaway Inc. and certain of its subsidiaries, collectively Berkshire Hathaway, had exercised in full their warrant to purchase shares of Goldman Sachs common stock.", "paragraphs": [], "date": "Announced October 1, 2013; exact exercise date not separately stated"}, "CTX-6df77ae30892ba8e71fc": {"title": "The same release states that Goldman Sachs will deliver 13,062,594 shares of common stock to Berkshire Hathaway on October 4, 2013. This records the announced future delivery rather than independently confirming its completion.", "paragraphs": [], "date": "Scheduled delivery on October 4, 2013"}, "CTX-e6689eaf0f82a021726a": {"title": "Reuters projected that Buffett would become one of Goldman Sachs' ten largest shareholders “essentially for free” after the amendment. It also characterized the exchange as saving Buffett billions of dollars in upfront costs and allowing Goldman to minimize dilution to its stock. These are reported expected effects, not confirmation in this passage that share delivery or a residual-position endpoint had occurred.", "paragraphs": [], "date": null}, "CTX-d875121c6f5fa2b8b1fe": {"title": "Reuters stated that under a 2008 deal Buffett had held the right to acquire about 43.5 million shares of stock at an exercise price of $115. The article's holder wording is retained rather than converted into a claim about Buffett's personal legal ownership.", "paragraphs": [], "date": "2008 deal"}, "CTX-43f0f879bad12fc88fa5": {"title": "In a September 23, 2008 release, Goldman Sachs announced that it had reached an agreement to sell $5 billion of perpetual preferred stock to Berkshire Hathaway in a private offering. The preferred stock carried a 10 percent dividend and was callable at any time at a 10 percent premium. In conjunction with the offering, Berkshire Hathaway would also receive warrants to purchase $5 billion of common stock with a strike price of $115 per share, exercisable at any time for a five-year term.", "paragraphs": [], "date": "September 23, 2008 announcement; agreement execution date not separately stated"}, "CTX-d7fd2131708745ef4d3f": {"title": "Alongside the Berkshire Hathaway private offering, the same release stated that Goldman Sachs was raising at least $2.5 billion in common equity in a public offering.", "paragraphs": [], "date": "September 23, 2008 announcement"}, "CTX-c3452fddc5cf0545c4a4": {"title": "Blankfein said Goldman Sachs viewed Buffett's investment as a strong validation of its client franchise and future prospects and that the investment would further bolster Goldman's strong capitalization and liquidity position. He also referred to the longstanding relationship underlying the investment.", "paragraphs": [], "date": "September 23, 2008 announcement"}, "CTX-bd5b3eda4c44d237def7": {"title": "CNBC characterized Buffett's investment as a sign of confidence in Goldman, said it helped boost Goldman's stock price, and called it a smart investment because the preferred shares paid a 10 percent dividend.", "paragraphs": [], "date": "At the time of the September 2008 investment; precise market-effect timing not stated"}, "CTX-df817e91bef3bd3997c6": {"title": "In its April 18, 2011 report, CNBC said that Buffett continued to hold warrants to buy 43,478,260 Goldman Sachs shares. It said the warrants could be exercised over the next two and a half years, had a $115 strike price, and that with Goldman trading at about $152.97 Buffett stood to make a substantial profit. The profit is a projection, not a reported realization.", "paragraphs": [], "date": "As reported April 18, 2011"}, "CTX-c0f2d02ec6857af641c1": {"title": "Goldman announced in March that it would buy back the preferred shares after passing its latest stress test. It also said it would take a charge of $2.80 a share in the first quarter to cover the buyback costs. This records Goldman's announced organizational action preceding the reported repayment.", "paragraphs": [], "date": "March 2011 announcement"}, "CTX-cf211c6cf4d62f16d5e6": {"title": "In comments to CNBC on Monday, Goldman described Berkshire Hathaway's September 2008 investment as a major vote of confidence in the firm and said it was very appreciative of the investment.", "paragraphs": [], "date": "Monday, April 18, 2011"}, "CTX-7c3da8731c9ccfe2c5af": {"title": "On Friday, Goldman said it had received regulators' permission to spend $5.65 billion to repurchase Berkshire Hathaway's preferred shares. Goldman said the Federal Reserve had approved its plan to repay Warren Buffett's company for the $5 billion investment made at the height of the financial crisis in fall 2008. This records the announced authorization and repayment plan, not completion of the repurchase.", "paragraphs": [], "date": "Friday announcement in the article dated March 18, 2011"}, "CTX-9881c1e687fb8ec62200": {"title": "The AP reported that Goldman had been paying 10-percent interest on the preferred shares, translating into a $500 million annual expense, and gave that cost as the reason Goldman was eager to repay Berkshire. It also stated prospectively that the repurchase would weigh down Goldman's first-quarter earnings by $2.80 per share because it included a one-time preferred dividend of about $1.65 billion.", "paragraphs": [], "date": "Dividend cost preceding the announced repurchase and a projected first-quarter earnings effect"}, "CTX-5aebfd8f0bd9d65ecd51": {"title": "The article stated that Berkshire's 50,000 preferred shares would be repurchased for $110,000 apiece on April 18 because Goldman was required to give 30 days' notice. This is the announced future repurchase schedule, not independent confirmation that the repurchase was completed.", "paragraphs": [], "date": "Scheduled for April 18, 2011"}, "CTX-060d5a19a51ff91d0cdf": {"title": "The article reported that Berkshire would continue to hold warrants to buy 43.5 million common Goldman shares at $115 per share anytime before fall 2013, notwithstanding the planned preferred-share repurchase.", "paragraphs": [], "date": "As reported March 18, 2011; exercise right described as available anytime before fall 2013"}, "CTX-ce3cb8744c2c19ff8fd4": {"title": "On September 23, 2008, CNBC reported that Berkshire Hathaway had a deal to invest at least $5 billion in Goldman Sachs. Berkshire would buy $5 billion of preferred Goldman stock with a 10 percent dividend and receive warrants to buy another $5 billion of common stock. The warrants had a $115 strike price and could be used at any time over a five-year period. Goldman revealed the investment in a news release late that afternoon. This records the announced terms, not a completed closing.", "paragraphs": [], "date": "Announced September 23, 2008; agreement execution and closing not separately dated"}, "CTX-d9cb0613642567c1d333": {"title": "CNBC described Goldman Sachs as having recently converted from an investment bank to a bank holding company. It also reported that Goldman would raise at least $2.5 billion in common equity through a public offering alongside the Berkshire investment.", "paragraphs": [], "date": "Reported September 23, 2008; conversion and offering dates not supplied"}, "CTX-f63a2925ffc01d202c7d": {"title": "Goldman CEO Lloyd Blankfein welcomed Buffett's investment decision and referred to their longstanding relationship. He said Goldman viewed the investment as a strong validation of its client franchise and future prospects and that it would further bolster Goldman's capitalization and liquidity position.", "paragraphs": [], "date": "September 23, 2008 news release"}, "CTX-4f1bdf8b605c2ae275ca": {"title": "CNBC reported that Buffett had avoided Wall Street since coming to Salomon Brothers' aid as a hands-on manager during its 1991 trading scandal. He had bought a $700 million stake four years earlier and eventually turned a profit, but the experience was long and difficult for him. CNBC presented that history as making the Goldman announcement especially unexpected.", "paragraphs": [], "date": "Background preceding the Goldman announcement, including a 1991 Salomon episode and a stake purchase four years earlier"}, "CTX-7ddf869aaddd4ddde53d": {"title": "CNBC reported that Goldman Sachs shares were higher in after-hours trading on the night of the investment announcement.", "paragraphs": [], "date": "After-hours trading on September 23, 2008"}, "CTX-d811ea7ae95185c266dd": {"title": "The source situates the investment within the 2008 global financial crisis, when leading Wall Street firms were seeking adequate capitalization and liquidity. It says that while many US firms looked overseas for capital infusions, Goldman Sachs found willing investors closer to home.", "paragraphs": [], "date": "2008 global financial crisis"}, "CTX-778e7464aef2ade46d1b": {"title": "The source says that Buffett first met senior partner Sidney Weinberg in 1940 and had worked with Goldman Sachs for more than 50 years. It states that this long-term relationship formed the basis for approaching Buffett about a potential Goldman Sachs investment to help the firm meet its capital needs during the financial crisis.", "paragraphs": [], "date": "First meeting in 1940; crisis-era approach not separately dated"}, "CTX-e599203c35b7a2ed045a": {"title": "On September 23, 2008, Goldman Sachs announced a private offering under which Berkshire Hathaway would purchase US$5 billion of special preferred shares paying a 10 percent annual dividend. Goldman had an option to buy back the shares for US$5 billion plus a one-time US$500 million dividend, and Berkshire would also acquire warrants to buy an additional US$5 billion of common stock at US$115 per share.", "paragraphs": [], "date": "September 23, 2008 announcement"}, "CTX-a9217585c95efbc14873": {"title": "On the day after the Berkshire investment announcement, Goldman Sachs completed a separate public offering of 46.7 million common shares at US$123 per share, raising US$5.75 billion. The source describes that offering as well-received and oversubscribed.", "paragraphs": [], "date": "The day after the September 23, 2008 announcement"}, "CTX-a68400a75b64953f0561": {"title": "In March 2011, Goldman Sachs announced that it would exercise its option to buy back the Berkshire Hathaway shares two years early. The source states that Goldman had secured Federal Reserve approval to make the payments following a review of its balance sheet.", "paragraphs": [], "date": "March 2011 announcement"}, "CTX-95d5b83c2468ae84ab8e": {"title": "Goldman Sachs's Form 8-K states that Goldman agreed to issue and sell, and Berkshire Hathaway Inc. and certain affiliates agreed to purchase, 50,000 shares of 10% Cumulative Perpetual Preferred Stock, Series G, with a liquidation value of $100,000 per share, together with a warrant to purchase 43,478,260 shares of voting common stock with par value $0.01 per share. The stated aggregate purchase price was $5.0 billion in cash.", "paragraphs": [], "date": "The form reports September 23, 2008 as the earliest event date; the supplied range does not separately state the agreement's execution or closing date."}, "CTX-29d11ed35b0bdfa022b8": {"title": "The filing states that Series G preferred dividends accrue annually at 10% of liquidation value but are payable only when declared by Goldman's board from legally available funds. Unpaid amounts accrue dividends at the same rate, and while dividends remain unpaid Goldman cannot pay dividends or other distributions on, or repurchase, outstanding common stock or any series of its preferred stock. Subject to approval by the Board of Governors of the Federal Reserve System, Goldman may redeem the preferred stock at any time, in whole or in part, at 110% of the liquidation value redeemed plus accrued unpaid dividends. The preferred stock has no maturity date and ranks senior to common stock, and pari passu with Goldman's other preferred series, for dividends and liquidation distributions.", "paragraphs": [], "date": null}, "CTX-99743573aa5bb187cdd8": {"title": "While at least 10,000 preferred shares remain outstanding, the preferred stock voting as a separate class has approval rights over future senior preferred issuance and specified charter amendments, mergers, reclassifications or similar events that substantially modify its rights. Subject to limited exceptions, the preferred stock and warrant are not transferrable for five years. Common shares issuable on exercise may be transferred at any time, but only through public offerings and other public market sales, or private transactions, that do not transfer more than 3.5% of outstanding common stock to any single purchaser or group. While the investor owns at least 10,000 preferred shares, a Goldman spin-off requires part of that preferred stock to be exchanged for preferred stock in the spun-off business based on the relative values of Goldman and that business.", "paragraphs": [], "date": "Five-year transfer restriction; calendar start and end dates are not stated in the supplied range."}, "CTX-0ca476ac99e2b4fe4e66": {"title": "The warrant is exercisable at the holder's option, in whole or in part, at any time and from time to time for five years at $115 per common share. Its exercise price and share count are subject to antidilution adjustments for stock splits, reclassifications, noncash distributions, extraordinary cash dividends, pro rata common-stock repurchases, business combinations, and certain issuances of common stock or convertible or exercisable securities below 95% of the common stock's market price at pricing. The investor agreed not to increase its beneficial ownership above 14.9% of outstanding common stock. At issuance, the warrant would be exercisable for approximately 9.0% of post-exercise outstanding common stock.", "paragraphs": [], "date": "Five-year exercise period; the supplied range does not provide calendar start or end dates."}, "CTX-21c3582bcef9151594e6": {"title": "The article stated that Berkshire Hathaway was buying $5 billion of Goldman Sachs perpetual preferred stock with a 10% coupon. It said the shares were senior to Goldman's other preferred stock and common stock, and that no other shareholders would receive dividends until Buffett had been paid his 10% in full each year.", "paragraphs": [], "date": null}, "CTX-3774624178344989be8c": {"title": "The article stated that Goldman agreed to include a warrant, described as a long-term call option, entitling Berkshire Hathaway to buy an additional $5 billion of Goldman common stock at $115 per share. It reported Goldman trading at about $130 at the time and said Berkshire would be entitled to buy at $115 regardless of how high the price had risen five years from then.", "paragraphs": [], "date": null}, "CTX-ec95e926e5426eef411f": {"title": "Jeff Clark, identified by the article as its options-trading expert, estimated that the Goldman options Buffett received were worth about $78 each, or $3.2 billion in total on a $5 billion position. The article then calculated net exposure of $1.8 billion, $500 million in annual payments and a 27.7% annual return, and said Buffett might eventually own 10% of the company. These are the source's estimates and analysis, not observed cash receipts or confirmation of a resulting shareholding.", "paragraphs": [], "date": null}, "CTX-731dcc78d22d09bfe59e": {"title": "The article describes Buffett as famously reluctant to invest in Wall Street firms but as having a long history with Goldman. It says that, as a 10-year-old, he visited Sidney Weinberg at Goldman Sachs with his father. Buffett recalls Weinberg speaking to him for 45 minutes as if he were an adult and asking him what stock he liked.", "paragraphs": [], "date": "Buffett's childhood and later recollection; no visit date stated"}, "CTX-22edb540a576a0efc634": {"title": "In later years, Buffett liked to cite Byron Trott, who until recently had worked in Goldman's Chicago office, as one of the few investment bankers worth his salt. This records Buffett's reported regard for Trott, which preceded their investment interaction.", "paragraphs": [], "date": "In later years; exact period not stated"}, "CTX-adfddfea39212009ad15": {"title": "Byron Trott asked Buffett whether he would be interested in investing in Goldman during the frenetic days after Lehman Brothers' bankruptcy. This other actor's approach initiated the interaction in which Buffett considered the possibility and subsequently negotiated with Trott.", "paragraphs": [], "date": "The frenetic days after Lehman Brothers' bankruptcy; exact dates not stated"}, "CTX-4689a1e9016b9c285cc2": {"title": "Vanity Fair reports that Goldman accepted Buffett's tough terms and, thanks to the investment, was able to raise another $5.75 billion by selling stock to other investors. It also reports Blankfein's statement that Goldman could have raised multiples of that amount but did not need more money. The causal contribution of Buffett's investment is the source's account, not a separately demonstrated calculation.", "paragraphs": [], "date": "Following Buffett's offer; acceptance and additional stock-sale dates not stated"}, "CTX-ac4cbaea9250234e3139": {"title": "Discussing whether Goldman could have survived the fall 2008 crisis without government help, Blankfein said he thought it would have survived, but at a much higher risk than he was comfortable with. He said government actions left Goldman better off, while expressing uncertainty about whether they were dispositive. When asked whether Goldman would have failed, he invoked Buffett's agreement to invest $5 billion as his trump card.", "paragraphs": [], "date": "An October interview concerning fall 2008; exact interview date and year not stated in the passage"}, "CTX-1da65c714b993ca71d81": {"title": "Blankfein referred to the crisis period as “the fog of war.” Vanity Fair reports that a firmwide story line credited Goldman's culture and risk management, rather than government assistance, with getting it through fall 2008. Asked whether Goldman would have survived without government intervention barring a financial Armageddon, David Viniar answered affirmatively, while Gary Cohn said he thought Goldman would not have failed because it had cash. These are reported beliefs, not established findings about a counterfactual.", "paragraphs": [], "date": "Accounts concerning fall 2008; interview dates not fully stated"}, "CTX-54a2f95d7446e272255a": {"title": "The article situates the Goldman call in September 2008, the week after Lehman Brothers collapsed, and characterizes the call as a consequential episode in American financial history.", "paragraphs": [], "date": "September 2008"}, "CTX-6399004273d43552d8c1": {"title": "The article reports that Goldman Sachs CFO David Viniar called Omaha on Tuesday afternoon, September 23, 2008, and that Warren Buffett answered the telephone. This records Viniar's approach and the interaction preceding Buffett's stated terms.", "paragraphs": [], "date": "Tuesday afternoon, September 23, 2008"}, "CTX-5f48c6a7596a13675d24": {"title": "The article describes an immediate divided reaction inside Goldman, with some executives calling the terms \"usury,\" and attributes the acceptance decision to CEO Lloyd Blankfein with the words \"We accept.\" This is Goldman's reported response to Buffett's terms, not an action by Buffett.", "paragraphs": [], "date": "Immediate reaction to the terms in the September 23, 2008 narrative; acceptance time not separately stated"}, "CTX-5031752981aa32c5b851": {"title": "In its rationale section, the article presents \"this fear is temporary\" as part of Buffett's thinking, calls \"Be greedy when others are fearful\" his lifelong principle that he had repeated for decades, and applies that principle to September 2008. This records the article's characterization of Buffett's stated outlook, not an independently observed private motive.", "paragraphs": [], "date": "Application to September 2008 as characterized by the article"}, "CTX-3632058cd39b52aa2ee3": {"title": "The article reports that in March 2011 Goldman redeemed Berkshire's preferred shares at 110% of face value \"as agreed\" and that Berkshire received a $500 million premium. This records the organizational redemption and receipt, not a separate Buffett action.", "paragraphs": [], "date": "March 2011"}, "CTX-14eebfbe2c5f47069150": {"title": "The article reports that in 2013 Berkshire exercised the warrants, converting them into approximately 13 million Goldman shares \"via cash settlement,\" with a value at the time of roughly $2.1 billion. This preserves the article's wording and does not recast the organizational transaction as a personal Buffett trade.", "paragraphs": [], "date": "2013"}, "CTX-0fea780f0f95b75e703d": {"title": "The article retrospectively lists $1.25 billion of dividends, a $500 million premium and $2.1 billion of warrant shares, producing its stated total return of approximately $3.85 billion.", "paragraphs": [], "date": "Retrospective total; no single valuation date stated"}, "CTX-127dc93f78d1b6d952f9": {"title": "Reuters stated that under the 2008 deal, Berkshire had the right to buy about 43.5 million Goldman shares, described as roughly a 9 percent stake, at an exercise price of $115 per share, for $5 billion in total.", "paragraphs": [], "date": "Under the 2008 deal"}, "CTX-51ffa481c56ab5b06c87": {"title": "Reuters situated Buffett's receipt of the Goldman warrants and the associated 2008 investment deal during the depths of the financial crisis.", "paragraphs": [], "date": "During the 2008 deal, in the depths of the financial crisis"}, "CTX-08e0b6cf3b5e5e315c07": {"title": "Reuters reported that Buffett's investment in Goldman was seen as a vote of confidence in the firm when the warrants were received as part of the 2008 crisis-era deal. The passage does not identify the people holding that perception.", "paragraphs": [], "date": "At the time of the 2008 investment"}, "CTX-97c88f167ace2d996da6": {"title": "AP reported that Berkshire and Goldman announced on Tuesday that they had renegotiated their agreement and that the 2008 deal would now be settled with stock. The announcement is attributed to the two companies, not directly to Warren Buffett.", "paragraphs": [], "date": "Tuesday announcement in the article updated March 26, 2013"}, "CTX-f8e9074ed6046a708095": {"title": "The agreement being renegotiated was identified as a 2008 deal that gave Berkshire the right to buy 43.5 million shares of Goldman Sachs, described in the passage as the investment bank, for $115 per share.", "paragraphs": [], "date": "2008 deal"}, "CTX-2f906da94fb4f86c524a": {"title": "AP projected that Warren Buffett's company, identified in the same sentence as Berkshire Hathaway Inc., would likely become one of the biggest shareholders in Goldman Sachs Group Inc. later that year without Berkshire having to part with any cash. This records the projection, not a completed acquisition.", "paragraphs": [], "date": "Later this year"}, "CTX-a53986f0d79abfe89de9": {"title": "BBC reported that in September 2008 Buffett's Berkshire Hathaway fund invested $5bn (£3.3bn) in Goldman at 10% interest. Berkshire also received an opportunity to buy billions of additional shares in the future.", "paragraphs": [], "date": "September 2008"}, "CTX-83f0724bf1f839f70013": {"title": "BBC stated that under the 2008 deal Berkshire had a warrant to buy a further 43.5 million Goldman shares for $115 each on 1 October 'this year.' The article's publication metadata dates it to 26 March 2013, resolving that referenced exercise date to 1 October 2013. BBC also compared the $115 warrant price with Goldman's $147.43 share price in early Tuesday trading.", "paragraphs": [], "date": "2008 deal; warrant exercise referenced as 1 October 2013"}, "CTX-6f63c82c7b79677e74af": {"title": "BBC reported that Goldman was giving Buffett shares for free to limit dilution of its stock and that Berkshire would not have to spend billions of dollars up front. Instead of buying the warrant shares, Berkshire would receive additional Goldman shares equivalent in value to the difference between $115 and Goldman's average closing price for the 10 trading days before 1 October. The article presents the share receipt as contemplated, not as completed delivery.", "paragraphs": [], "date": "Contemplated settlement keyed to 1 October; delivery date not stated"}, "CTX-1ae8019e67124fda19a5": {"title": "BBC's opening framed Buffett's top-10 Goldman shareholder status as prospective, and estimates cited by the article projected that the arrangement would make him the bank's ninth-largest shareholder. This was an estimate, not an observed completed position or evidence of the residual common-stock position's endpoint.", "paragraphs": [], "date": null}, "CTX-4f4b9847aa2f170ed247": {"title": "BBC quoted Goldman Sachs chief executive Lloyd Blankfein saying: \"We are pleased that Berkshire Hathaway intends to remain a long-term investor in Goldman Sachs.\"", "paragraphs": [], "date": null}, "CTX-8327d3f6b3be06a4993e": {"title": "BBC situated the 2008 Goldman investment at the height of the global financial crisis. It reported that the investment attracted substantial media attention, particularly concerning the 10% interest Goldman agreed to pay Berkshire.", "paragraphs": [], "date": "2008 investment"}, "CTX-37ac2eded0d112f762fd": {"title": "BBC reported analysts' view that the 10% interest reflected Goldman's need for the funds and the lack of other potential investors either willing or able to provide the money.", "paragraphs": [], "date": null}, "CTX-b7f3db7591f45859fc48": {"title": "Berkshire Hathaway's 2013 shareholder letter lists 13,062,594 shares of The Goldman Sachs Group, Inc. among its fifteen common-stock investments with the largest market value at year-end. The 12/31/13 table reports 2.8% of Goldman owned, a cost of $750 million and a market value of $2,315 million. The footnotes state that cost is the actual purchase price and tax basis, subject to certain GAAP differences, and that the listed share counts exclude shares held by Berkshire subsidiary pension funds.", "paragraphs": [], "date": "12/31/13"}, "CTX-7882a74d5a799989ba59": {"title": "On March 18, 2011, The Goldman Sachs Group, Inc. announced that the Federal Reserve had concluded it had no objection to Goldman Sachs' proposed 2011 capital actions. Those actions included redeeming in full the 50,000 shares of Goldman's 10% Cumulative Perpetual Preferred Stock, Series G held by Berkshire Hathaway Inc. and certain subsidiaries. The announcement also listed common-stock repurchases and a potential increase in the quarterly common-stock dividend.", "paragraphs": [], "date": "March 18, 2011 announcement"}, "CTX-f030c74ef96789348064": {"title": "Goldman stated that it had mailed redemption notices to Berkshire Hathaway and would redeem all Berkshire-held Preferred Shares at a stated price of $110,000 per share plus accrued and unpaid dividends. The stated redemption date was April 18, 2011. This records the announced terms and schedule, not confirmation that the redemption was completed.", "paragraphs": [], "date": "Scheduled redemption date: April 18, 2011"}, "CTX-f34f6b7257a7def1ca89": {"title": "In the same announcement, Goldman said Berkshire Hathaway continued to hold the warrant to purchase 43,478,260 shares of Goldman common stock, par value $0.01 per share. Thus, the announced preferred-share redemption coexisted with a continuing warrant position; the passage does not describe that warrant's subsequent settlement.", "paragraphs": [], "date": "Continuing position reported in the March 18, 2011 announcement"}, "CTX-179e0a3e40ed0e8af994": {"title": "Goldman stated that Berkshire Hathaway had purchased the warrant from Goldman concurrently with the Preferred Shares on October 1, 2008. This attributes the concurrent preferred-share and warrant acquisition to Berkshire Hathaway, rather than documenting a personal purchase by Warren Buffett.", "paragraphs": [], "date": "October 1, 2008"}, "CTX-211675c33f1dea8f1e45": {"title": "Goldman stated that the redemption included a one-time preferred dividend of approximately $1.64 billion to be reflected in its first-quarter results. It expected this to reduce reported diluted earnings per common share for that quarter by approximately $2.80. Goldman also said the redemption accelerated $24 million of preferred dividends payable from April 1 to the redemption date, expected to reduce first-quarter diluted earnings per common share by approximately $0.04.", "paragraphs": [], "date": "First-quarter results referenced in the March 18, 2011 announcement"}, "CTX-550162958431cb102263": {"title": "Goldman stated that, while the Preferred Shares were outstanding, it incurred dividend expense of $125 million per quarter, or $500 million annually. It said this expense reduced diluted earnings per common share by $0.85 in 2010.", "paragraphs": [], "date": "2010 diluted-earnings-per-share effect"}, "PERSON-0001": {"title": "Warren Edward Buffett", "paragraphs": [], "date": null}, "ENT-fd0c53f3221a07cd4df3": {"title": "Berkshire", "paragraphs": [], "date": null}, "ENT-c1d3add6532941830c73": {"title": "Goldman Sachs", "paragraphs": [], "date": null}, "ENT-3938c86b6c487e7495e5": {"title": "Lloyd C. Blankfein", "paragraphs": [], "date": null}, "ENT-fd7afb94e4ae7a245bbf": {"title": "Federal Reserve", "paragraphs": [], "date": null}, "ENT-92e17f059643e03e4aac": {"title": "Salomon Brothers", "paragraphs": [], "date": null}, "ENT-36e7b8847aa61d72ca0e": {"title": "Sidney Weinberg", "paragraphs": [], "date": null}, "ENT-c4dd54c27919820fee82": {"title": "Jeff Clark", "paragraphs": [], "date": null}, "ENT-f174a0aa5ad2090f66e2": {"title": "Byron Trott", "paragraphs": [], "date": null}, "ENT-c6be258ead618b2b0c4b": {"title": "Jon Winkelried", "paragraphs": [], "date": null}, "ENT-4119923c68394077a7bb": {"title": "Becky Quick", "paragraphs": [], "date": null}, "ENT-a63c0dba5cef33a6d014": {"title": "CNBC", "paragraphs": [], "date": null}, "ENT-b967d35d9be5fdebe7e4": {"title": "Gary Cohn", "paragraphs": [], "date": null}, "ENT-5612d96c1506d2fb3d49": {"title": "David Viniar", "paragraphs": [], "date": null}, "ENT-f36e88ef4880989abcc8": {"title": "Lehman Brothers", "paragraphs": [], "date": null}, "PHS-932d67a1776522493d80": {"title": "Assessment, commitment and position establishment", "paragraphs": ["Buffett's behavioral mode is active evaluation and establishment: considering the solicitation, expressing investment conditions and assessments, communicating terms and commitments, publicly endorsing or announcing the investment, and being reported to have acquired the preferred-stock and warrant position. The associated portfolio sales are included as funding conduct, while undated explanatory statements are assigned by their decision-related content rather than given invented dates."], "date": "Undated assessment and negotiation through the 2008 establishment year"}, "PHS-ac557b9d01b89eb85857": {"title": "Official reporting while the financing position remained outstanding", "paragraphs": ["Buffett's documented behavior consists principally of chairman-letter reporting and explanation of Berkshire's Goldman financing position: the February 2009 account of the aggregate fixed-income commitments and the February 2010 account of the non-traded securities positions. No continuous personal trading activity is inferred between those disclosures."], "date": "Coarse 2009 post-establishment boundary through January 2011"}, "PHS-94b6018e266bbae2ec8b": {"title": "Redemption anticipation and repayment explanation", "paragraphs": ["Buffett's behavioral mode shifts to addressing the preferred investment's termination: predicting redemption, characterizing the dividend cost, telling shareholders that losing the special dividends would reduce Berkshire's earning power, and being reported to receive and explain the repayment check. Undated remarks are placed here because of their redemption-related content, not by assigning them the article's publication date."], "date": "February 2011 through the April 18, 2011 redemption day"}, "PHS-3f931785e8d006509447": {"title": "Warrant-only interval after preferred redemption", "paragraphs": ["After the preferred shares were redeemed, Berkshire continued to hold the Goldman warrant. No focal-person Action is documented for this interval; the phase records the changed investment situation and does not invent trading, negotiation or public statements to fill it."], "date": "After April 18, 2011 until the March 26, 2013 amendment announcement"}, "PHS-aa1e013a0e9c597edeb4": {"title": "Warrant renegotiation and stated continuing investment", "paragraphs": ["Buffett's documented mode becomes active amendment-related conduct and public communication: reported agreement to amend the 2008 terms, reported amendment or conversion of the warrant position, and his March 26 statement that 'we' intended to hold a significant Goldman investment. These records do not by themselves establish that Buffett personally executed the later share delivery."], "date": "March 26, 2013 amendment announcement through the day before the announced October 4 share delivery"}, "PHS-80c8e60eba92143176e9": {"title": "Corporate share settlement and residual-position observation", "paragraphs": ["Goldman's full warrant exercise announcement, the October 4 delivery of 13,062,594 shares to Berkshire and Berkshire's year-end listing of that common-stock position define this phase. No separate focal-person Action is documented for the delivery or for a later disposal, so none is invented."], "date": "October 4, 2013 through the December 31, 2013 residual-position observation"}, "219e1b8b4e783abdf4d1c027": {"title": "berkshirehathaway.com", "paragraphs": [], "date": null}, "4732c27ce7d8220f17e59d36": {"title": "berkshirehathaway.com", "paragraphs": [], "date": null}, "356d705c591a9e9be00faa5e": {"title": "Goldman Sachs Amends Terms of Warrants Held by Berkshire Hathaway | Goldman Sachs", "paragraphs": [], "date": "2013-03-26"}, "810da557f18ea28e6ce49f0c": {"title": "Berkshire Hathaway Exercises its Warrant to Purchase Goldman Sachs’ Shares | Goldman Sachs", "paragraphs": [], "date": "2013-10-01"}, "3d30378962d36f913c8882c6": {"title": "Buffett to take major Goldman Sachs stake in warrant deal", "paragraphs": [], "date": "2013-03-26"}, "479d9dde099e87f5e59034c5": {"title": "Berkshire Hathaway to Invest $5 Billion in Goldman Sachs | Goldman Sachs", "paragraphs": [], "date": "2008-09-23"}, "07845faddf660053bd5ce9f1": {"title": "Goldman Sachs Pays Back Buffett His $5.5 Billion", "paragraphs": [], "date": "2011-04-18"}, "d390ffe67fb43e6415f72026": {"title": "Goldman to pay Berkshire $5.65B to redeem shares", "paragraphs": [], "date": "2011-03-19"}, "f6fa09f6e6ee500b9fa3fafc": {"title": "Warren Buffett
